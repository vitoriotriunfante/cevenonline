name = "ceven-cftv-matrix"
compatibility_date = "2024-08-01"
pages_build_output_dir = "./public"

[[d1_databases]]
binding = "DB"
database_name = "ceven_noc_d1"
database_id = "6112e60c-3546-41dd-aae1-ef44958596b7"
migrations_dir = "./migrations"

# 16/10/2026: o CEVEN recusa chamadas de fora do Brasil. Sem isto, as Functions rodam no data center de quem acessa
# (ex.: Vitorio na Argentina -> EZE/Buenos Aires) e o CEVEN trava. Smart placement: o Cloudflare passa a rodar perto do backend (region fixa nao e aceita no Pages).
[placement]
mode = "smart"
