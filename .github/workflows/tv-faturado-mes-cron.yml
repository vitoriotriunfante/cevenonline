# FICHA DO ARQUIVO
# O QUE É: dispara o agregado de faturado/meta do MÊS (functions/api/cron-faturado-mes.js) a
#          cada 15 minutos.
# ETAPA 2 DA UNIFICAÇÃO (29/09/2026): desde que cron-faturado-mes.js passou a ler o dashboard já
#          gravado em varredura_central_rca (em vez de chamar o CEVEN direto pra cada RCA), essa
#          execução é só leitura/agregação de D1 — rápida, timeout curto de novo. Continua a
#          cada 15min (offset dos minutos do cron de 5min do mapa) por simplicidade, não porque
#          precise mais desse espaçamento.
# PROJETO: CFTV/TV. Só faz um GET no endpoint público.
name: TV Executiva — Faturado/Meta do Mês

on:
  schedule:
    - cron: '2-59/15 * * * *' # minutos 2,17,32,47
  workflow_dispatch: {}

jobs:
  atualizar_faturado_mes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar agregado de faturado/meta do mês (cron-faturado-mes)
        run: |
          curl -sS -m 60 "https://ceven-cftv-matrix.pages.dev/api/cron-faturado-mes" \
            -o resultado.json -w "\nHTTP %{http_code}\n"
          cat resultado.json
