# FICHA DO ARQUIVO
# O QUE É: dispara a agregação do mapa/resumo da TV Executiva (functions/api/cron-mapa-executivo.js)
#          a cada 5 minutos, com offset de 2min sobre a varredura central (tv-varredura-central-cron.yml,
#          também a cada 5min) — dá tempo da central gravar antes deste ler.
# ETAPA 2 DA UNIFICAÇÃO (29/09/2026): cron-mapa-executivo.js não fala mais direto com o CEVEN pra
#          roteiro-hoje/produtividade — lê de varredura_central_rca. Timeout bem menor agora (era
#          240s quando fazia sua própria varredura de ~560 RCAs).
# PROJETO: CFTV/TV. Só faz um GET no endpoint público.
name: TV Executiva — Atualizar Mapa ao Vivo

on:
  # Agendamento removido em 03/10/2026: quem dispara agora e o Worker do Cloudflare (worker-cron), que e pontual;
  # o agendador do GitHub executava so ~1/3 das chamadas. Aqui ficou so a execucao manual.
  workflow_dispatch: {}

jobs:
  atualizar_mapa_live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Disparar agregação do mapa executivo (cron-mapa-executivo)
        run: |
          curl -sS -m 60 "https://ceven-cftv-matrix.pages.dev/api/cron-mapa-executivo" \
            -o resultado.json -w "\nHTTP %{http_code}\n"
          cat resultado.json
