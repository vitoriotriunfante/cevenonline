# FICHA DO ARQUIVO
# O QUE É: coleta ONLINE do GEROT (industria = GEROT, decisao do Vitorio) — sem PC. Ver docs/GEROT_ESTADO_E_PLANO.md.
#   Depois de cada janela do GEROT (09h15, 11h15, 13h15, 15h15, 17h15, 19h15 de Brasilia), extrai
#   mes x filial x supervisor x vendedor x fornecedor e grava no D1 (/api/gerot-carga, so o que mudou).
# NAO envia WhatsApp e NAO chama o CEVEN.
# Segredos: GEROT_EMAIL, GEROT_SENHA (login do painel) e EVO_KEY (chave das rotas de carga, ja existe).
name: GEROT — coleta online para o D1

on:
  schedule:
    - cron: '42 3,9,11,13,15,17,19,21,23 * * 1-6'   # janela oficial :40 BRT (00h42, 06h42 .. 20h42 BRT, seg-sab) + dispara via sonda/cron
    - cron: '15 23 * * 0'                             # domingo 20h15 BRT: fecha o fim de semana para a Matinal de segunda
  workflow_dispatch:
    inputs:
      meses:
        description: 'Meses (AAAA-MM separados por virgula). Vazio = mes atual (dias 1-5: tambem o anterior)'
        required: false
        default: ''
      tier:
        description: 'Tier de coleta (auto | 1 | 2 | 3 | all)'
        required: false
        default: 'auto'
      ensaio:
        description: 'Ensaio: baixa e le o cubo do GEROT, mas nao grava no D1'
        type: boolean
        default: false
      gerar_cards:
        description: 'Gerar 242 cards PNG da Matinal no D1 (automatico 06h-08h BRT e dom 20h15)'
        type: boolean
        default: false
      forcar:
        description: 'Forcar publicacao mesmo se o Portao Contabil sinalizar diferenca'
        type: boolean
        default: false

concurrency:
  group: gerot-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache SHA-256 dos blocos do GEROT
        uses: actions/cache@v4
        with:
          path: ~/.cache/gerot-blocos
          key: gerot-blocos-${{ github.run_number }}
          restore-keys: |
            gerot-blocos-
      - name: Coletar GEROT (motor HTTP direto - 43 telas)
        env:
          GEROT_EMAIL: ${{ secrets.GEROT_EMAIL }}
          GEROT_SENHA: ${{ secrets.GEROT_SENHA }}
          EVO_KEY: ${{ secrets.EVO_KEY }}
        run: |
          ARGS="--tier=${{ github.event.inputs.tier || 'auto' }}"
          if [ -n "${{ github.event.inputs.meses }}" ]; then ARGS="$ARGS --meses=${{ github.event.inputs.meses }}"; fi
          if [ "${{ github.event.inputs.ensaio }}" = "true" ]; then ARGS="$ARGS --ensaio"; fi
          if [ "${{ github.event.inputs.forcar }}" = "true" ]; then ARGS="$ARGS --forcar"; fi
          node pipeline/gerot_motor_coleta.mjs $ARGS
      - name: Liga — lances do dia (Clube + GEROT)
        # 17/11/2026 (Vitorio: "colocar no ar urgente a Champions"): /api/liga-clube grava os lances de hoje que ja aconteceram (INSERT OR IGNORE)
        if: github.event.inputs.ensaio != 'true'
        continue-on-error: true
        env:
          EVO_KEY: ${{ secrets.EVO_KEY }}
        run: |
          curl -s --max-time 150 -H "X-Evo-Key: $EVO_KEY" "https://ceven-cftv-matrix.pages.dev/api/liga-clube?grava=1" | head -c 600 || true
      - name: Gerar cards PNG da Matinal (WhatsApp)
        if: github.event.inputs.ensaio != 'true'
        env:
          EVO_KEY: ${{ secrets.EVO_KEY }}
        run: |
          H=$(TZ=America/Sao_Paulo date +%H)
          if [ "${{ github.event.inputs.gerar_cards }}" = "true" ] || [ "$H" = "06" ] || [ "$H" = "07" ] || [ "$H" = "08" ]; then
            npm ci --no-audit --no-fund
            for t in 1 2 3; do npx playwright install --with-deps chromium && break; sleep 15; done
            node scripts/gerar_cards_matinal.mjs || true
          else
            echo "cards da Matinal: so na coleta da manha"
          fi
      # 16/11/2026: o repositorio e PUBLICO — artefatos (Excel e prints do GEROT) ficavam abertos por 7 dias. Removido: nada da empresa sai como artefato.
