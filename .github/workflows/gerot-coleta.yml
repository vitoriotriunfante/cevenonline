# FICHA DO ARQUIVO
# O QUE É: coleta ONLINE do GEROT (industria = GEROT, decisao do Vitorio) — sem PC. Ver docs/GEROT_ESTADO_E_PLANO.md.
#   Depois de cada janela do GEROT (09h15, 11h15, 13h15, 15h15, 17h15, 19h15 de Brasilia), extrai
#   mes x filial x supervisor x vendedor x fornecedor e grava no D1 (/api/gerot-carga, so o que mudou).
# NAO envia WhatsApp e NAO chama o CEVEN.
# Segredos: GEROT_EMAIL, GEROT_SENHA (login do painel) e EVO_KEY (chave das rotas de carga, ja existe).
name: GEROT — coleta online para o D1

on:
  schedule:
    - cron: '15 10,12,14,16,18,20,22 * * 1-6'   # 07h15 (Vitorio 11/11/2026: 'comecar o dia com os dados'), 09h15 ... 19h15 BRT, segunda a sabado
    - cron: '15 23 * * 0'                         # domingo 20h15 BRT: fecha o fim de semana para a Matinal de segunda 07h15
  workflow_dispatch:
    inputs:
      meses:
        description: 'Meses (AAAA-MM separados por virgula). Vazio = mes atual (dias 1-5: tambem o anterior)'
        required: false
        default: ''
      ensaio:
        description: 'Ensaio: baixa e le o Excel, mas nao grava no D1'
        type: boolean
        default: false
      gerar_cards:
        description: 'Gerar 242 cards PNG da Matinal no D1 (automatico so 07h15 e dom 20h15)'
        type: boolean
        default: false

concurrency:
  group: gerot-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias e navegador
        run: |
          npm ci --no-audit --no-fund
          # 12/11/2026: em 11/11 11h17 e 13h17 a instalacao caiu por rede do GitHub (security.ubuntu.com) e a coleta nao rodou. Ate 4 tentativas.
          for t in 1 2 3 4; do npx playwright install --with-deps chromium && break; echo "tentativa $t falhou, nova em 30 s"; sleep 30; sudo apt-get update -qq || true; done
          npx playwright install chromium
      - name: Coletar GEROT
        env:
          GEROT_EMAIL: ${{ secrets.GEROT_EMAIL }}
          GEROT_SENHA: ${{ secrets.GEROT_SENHA }}
          EVO_KEY: ${{ secrets.EVO_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.meses }}" ]; then ARGS="--meses=${{ github.event.inputs.meses }}"; fi
          if [ "${{ github.event.inputs.ensaio }}" = "true" ]; then ARGS="$ARGS --ensaio"; fi
          node pipeline/gerot_coletor_online.mjs $ARGS
      - name: Carteira Total (status e bloqueio de cada pedido em aberto)
        # 17/11/2026: pipeline/gerot_carteira.mjs; falha aqui nao derruba a coleta; log so com contagens
        if: github.event.inputs.ensaio != 'true'
        continue-on-error: true
        env:
          GEROT_EMAIL: ${{ secrets.GEROT_EMAIL }}
          GEROT_SENHA: ${{ secrets.GEROT_SENHA }}
          EVO_KEY: ${{ secrets.EVO_KEY }}
        run: node pipeline/gerot_carteira.mjs
      - name: Devolucao por motivo (tela Devolucoes do GEROT)
        # 18/11/2026: o Extrair dados nao tem motivo; a tela tem (pipeline/gerot_devolucoes.mjs). Log so com contagens.
        if: github.event.inputs.ensaio != 'true'
        continue-on-error: true
        env:
          GEROT_EMAIL: ${{ secrets.GEROT_EMAIL }}
          GEROT_SENHA: ${{ secrets.GEROT_SENHA }}
          EVO_KEY: ${{ secrets.EVO_KEY }}
        # 18/11/2026: motivo por VENDEDOR (Motivo > Filial > Supervisor > Vendedor, ~16 min) so nas rodadas das 12h e das 18h (BRT)
        run: |
          H=$(TZ=America/Sao_Paulo date +%H)
          if [ "$H" = "12" ] || [ "$H" = "18" ]; then DEV_VEND=1 node pipeline/gerot_devolucoes.mjs; else node pipeline/gerot_devolucoes.mjs; fi
      - name: Liga — lances do dia (Clube + GEROT)
        # 17/11/2026 (Vitorio: "colocar no ar urgente a Champions"): /api/liga-clube grava os lances de hoje que ja aconteceram (INSERT OR IGNORE)
        if: github.event.inputs.ensaio != 'true'
        continue-on-error: true
        env:
          EVO_KEY: ${{ secrets.EVO_KEY }}
        run: |
          curl -s --max-time 150 -H "X-Evo-Key: $EVO_KEY" "https://ceven-cftv-matrix.pages.dev/api/liga-clube?grava=1" | head -c 600 || true
      - name: Gerar cards PNG da Matinal (WhatsApp)
        # 17/11/2026 (Vitorio: 'nao e a cada carga... e se o cara perguntar... nao gaste a toa'): imagem so sob demanda (matinal-card.yml); aqui so se pedido a mao
        if: github.event.inputs.ensaio != 'true' && github.event.inputs.gerar_cards == 'true'
        env:
          EVO_KEY: ${{ secrets.EVO_KEY }}
        run: node scripts/gerar_cards_matinal.mjs || true
      # 16/11/2026: o repositorio e PUBLICO — artefatos (Excel e prints do GEROT) ficavam abertos por 7 dias. Removido: nada da empresa sai como artefato.
