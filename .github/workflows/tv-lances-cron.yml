# FICHA DO ARQUIVO
# DESATIVADO em 29/09/2026: este workflow chama functions/api/cron-lances.js, que nunca chegou a
# ser escrito — foi criado o .yml descrevendo a funcionalidade sem implementar o endpoint (erro
# achado nesta mesma sessão: o workflow ficou ativo em produção apontando pra uma rota 404,
# gastando um slot de execução do GitHub Actions a cada 10min à toa). A detecção de lances hoje
# só roda dentro do JavaScript da TV, no navegador de quem abrir a tela — 8 das 11 filiais ficam
# sem detecção se ninguém abrir aquela tela, problema real, mas resolver direito (replicar o
# algoritmo de detecção do client-side pro servidor sem duplicar/inventar lance) é tarefa própria,
# não algo pra fazer às pressas em cima de um incidente de carga no CEVEN. schedule DESLIGADO até
# cron-lances.js existir de verdade; workflow_dispatch (manual) continua disponível pra quando for
# implementado.
name: TV — Detectar Lances de Todas as Filiais (DESATIVADO — endpoint nao existe)

on:
  workflow_dispatch: {}

jobs:
  detectar_lances:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Disparar detecção de lances (cron-lances)
        run: |
          curl -sS -m 480 "https://ceven-cftv-matrix.pages.dev/api/cron-lances" \
            -o resultado.json -w "\nHTTP %{http_code}\n"
          cat resultado.json
