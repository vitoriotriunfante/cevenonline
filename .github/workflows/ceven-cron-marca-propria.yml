# FICHA DO ARQUIVO
# O QUE É: gera os relatórios de Marca Própria (hoje + acumulado do mês) por gerente
#     e envia via WhatsApp para todos (Vitório + gerentes).
# RODA: workflow_dispatch disparado pelo Cloudflare ceven-cron-sync às 10:00 BRT.
#     NÃO tem mais schedule próprio aqui — o Cloudflare é o gatilho único (evita
#     duplicação: GH schedule + CF workflow_dispatch no mesmo horário = 2 runs).
# LÊ do Google Drive: pedidos_historico_ceven.db, VENDEDORES AUDITADOS.xlsx,
#     Lista de SKUs vem de config/catalogo_produtos_por_filial.json (fornecedor 24318). Gera a árvore viva de vendedores ao vivo.
# ESCREVE: OPERACAO_WHATSAPP/relatorios_por_horario/10_00/*.md + envia WhatsApp.
# DEPENDE DE: secrets GDRIVE_SA_JSON e GDRIVE_FOLDER_ID + o banco ter sido atualizado
#     às 03:00 pelo ceven-cron-datalake.yml no mesmo dia.
# ÚLTIMA REVISÃO: 24/09/2026 (envio WA ligado + schedule removido, CF assume gatilho).
name: CEVEN — Marca Própria 10:00

on:
  # SEM schedule aqui — o Cloudflare (ceven-cron-sync) dispara workflow_dispatch
  # exatamente às 10:00 BRT. Ter schedule E CF = duplicação garantida.
  workflow_dispatch:
    inputs:
      destino:
        description: 'Destinatário (todos = envio oficial; vitorio = teste só para o Vitório, não marca o ciclo)'
        required: true
        default: 'todos'
        type: choice
        options:
          - 'todos'
          - 'vitorio'

concurrency:
  group: ceven-marca-propria
  cancel-in-progress: false

jobs:
  gerar_marca_propria:
    runs-on: ubuntu-latest
    # 15min estourava quando a API do CEVEN ficava lenta (mesma causa do ceven-cron-whatsapp.yml,
    # achado em 28/09/2026). 25min da folga sem deixar o job preso indefinidamente.
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Trava de Segurança - Bloqueio de Fim de Semana e Feriados (com Exceção em Esporádicos)
        id: calendario
        run: |
          DIA=$(TZ='America/Sao_Paulo' date +%u)
          DATA_HOJE=$(TZ='America/Sao_Paulo' date +%Y-%m-%d)
          BLOQUEADO=false
          if [ "$DIA" -ge 6 ]; then
            if jq -e --arg d "$DATA_HOJE" '.esporadicos.datas_autorizadas | index($d)' config/diretrizes_operacionais.json >/dev/null; then
              echo "⚠️ Fim de semana com autorização esporádica ativa em diretrizes_operacionais.json. Prosseguindo..."
            else
              echo "🛑 [ABORTADO] Hoje é fim de semana em Brasília ($DATA_HOJE). Disparos comerciais suspensos."
              BLOQUEADO=true
            fi
          fi
          FERIADOS="2026-01-01 2026-02-16 2026-02-17 2026-04-03 2026-04-21 2026-05-01 2026-06-04 2026-09-07 2026-10-12 2026-11-02 2026-11-15 2026-11-20 2026-12-25"
          if [ "$BLOQUEADO" = "false" ] && echo "$FERIADOS" | grep -qw "$DATA_HOJE"; then
            if jq -e --arg d "$DATA_HOJE" '.esporadicos.datas_autorizadas | index($d)' config/diretrizes_operacionais.json >/dev/null; then
              echo "⚠️ Feriado com autorização esporádica ativa em diretrizes_operacionais.json. Prosseguindo..."
            else
              echo "🛑 [ABORTADO] Hoje é feriado nacional ($DATA_HOJE). Disparos comerciais suspensos."
              BLOQUEADO=true
            fi
          fi
          echo "bloqueado=$BLOQUEADO" >> $GITHUB_OUTPUT

      - name: Configurar Node.js
        if: steps.calendario.outputs.bloqueado != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências (npm ci, mesma versão travada localmente)
        if: steps.calendario.outputs.bloqueado != 'true'
        run: npm ci

      - name: Instalar rclone
        if: steps.calendario.outputs.bloqueado != 'true'
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (Google Drive)
        if: steps.calendario.outputs.bloqueado != 'true'
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || '1sqzFpWEKb1WKhT9MksQcQl8RuY94DQum' }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_JSON" > /tmp/gdrive-sa.json
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive-sa.json
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Baixar banco de dados do Google Drive
        if: steps.calendario.outputs.bloqueado != 'true'
        run: |
          mkdir -p analises
          rclone copy gdrive:pedidos_historico_ceven.db analises/

      - name: Baixar a equipe (Gestão de Equipe, via /api/tv-mostra) - fonte única
        if: steps.calendario.outputs.bloqueado != 'true'
        run: curl -fsS -m 60 "https://ceven-cftv-matrix.pages.dev/api/tv-mostra?t=1" -o mostra_equipe.json || echo "Equipe não baixada — equipe não aplicada neste ciclo."
        continue-on-error: true

      - name: Gerar árvore viva de vendedores (ao vivo do CEVEN)
        if: steps.calendario.outputs.bloqueado != 'true'
        run: node scripts/atualizar_arvore_viva_11_filiais.js

      - name: Gerar relatórios de Marca Própria (hoje + acumulado do mês)
        if: steps.calendario.outputs.bloqueado != 'true'
        env:
          CEVEN_ADMIN_USER: ${{ secrets.CEVEN_ADMIN_USER }}
          CEVEN_ADMIN_PASS: ${{ secrets.CEVEN_ADMIN_PASS }}
          EVO_URL: ${{ secrets.EVO_URL }}
          EVO_KEY: ${{ secrets.EVO_KEY }}
          EVO_INSTANCE: ${{ secrets.EVO_INSTANCE }}
        run: node scripts/gerar_marca_propria.js "$(date -u -d '-3 hours' +%Y-%m-%d)" "${{ github.event.inputs.destino || 'todos' }}"

      - name: Copiar para a pasta oficial de entrega
        if: steps.calendario.outputs.bloqueado != 'true'
        run: |
          DATA_REF="$(date -u -d '-3 hours' +%Y-%m-%d)"
          DEST="OPERACAO_WHATSAPP/relatorios_por_horario/10_00"
          mkdir -p "$DEST"
          for f in auditoria_mensagens/$DATA_REF/10_00__*.txt; do
            cp "$f" "$DEST/$(basename "$f" .txt).md"
          done

      # LOCK GLOBAL (achado 29/09/2026, mesma lógica de ceven-cron-whatsapp.yml): WhatsApp tem
      # prioridade sobre TV Executiva/CFTV.
      - name: 🔒 Travar lock global (prioridade sobre TV/CFTV)
        if: steps.calendario.outputs.bloqueado != 'true'
        run: curl -sS -m 15 -X POST "https://ceven-cftv-matrix.pages.dev/api/cron-lock?dono=marca-propria" || true

      - name: ⚡ Enviar via WhatsApp (ciclo 10:00 — todos)
        if: steps.calendario.outputs.bloqueado != 'true' && (github.event.inputs.destino || 'todos') == 'todos'
        env:
          CEVEN_ADMIN_USER: ${{ secrets.CEVEN_ADMIN_USER }}
          CEVEN_ADMIN_PASS: ${{ secrets.CEVEN_ADMIN_PASS }}
          EVO_URL: ${{ secrets.EVO_URL }}
          EVO_KEY: ${{ secrets.EVO_KEY }}
          EVO_INSTANCE: ${{ secrets.EVO_INSTANCE }}
        run: |
          node pipeline/ceven_unified_engine.js \
            --hora="10:00" \
            --acao="marca_propria" \
            --destino="todos"

      - name: 🔓 Liberar lock global
        if: always()
        run: curl -sS -m 15 -X DELETE "https://ceven-cftv-matrix.pages.dev/api/cron-lock" || true

      - name: Commitar relatórios + marca de disparo
        if: always() && steps.calendario.outputs.bloqueado != 'true' && (github.event.inputs.destino || 'todos') == 'todos'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          DATA_REF="$(date -u -d '-3 hours' +%Y-%m-%d)"
          FILES="OPERACAO_WHATSAPP/relatorios_por_horario/10_00/ config/diretrizes_operacionais.json"
          git add $FILES
          git diff --cached --quiet && echo "Sem mudança pra commitar." || (
            git commit -m "chore: relatorios de marca propria 10:00 + marca de disparo [skip ci]"
            OK=0
            for i in 1 2 3 4 5 6 7 8; do
              if git push; then
                OK=1
                break
              fi
              echo "Push falhou (tentativa $i) -- reconstruindo o commit em cima do origin mais recente (evita ficar preso no mesmo conflito de rebase)..."
              git fetch origin ${{ github.ref_name }}
              git show origin/${{ github.ref_name }}:config/diretrizes_operacionais.json > /tmp/diretrizes_origin.json
              jq --arg d "$DATA_REF" '.controles_dia.ultimo_disparo_por_ciclo["10:00"] = $d' /tmp/diretrizes_origin.json > config/diretrizes_operacionais.json
              # --mixed (nao --soft): --soft mantinha o indice do checkout velho e o commit DESFAZIA arquivos de outras sessoes (ex.: dataset do Brasileirao, 05/10/2026)
              git reset --mixed origin/${{ github.ref_name }}
              git add $FILES
              git diff --cached --quiet || git commit -m "chore: relatorios de marca propria 10:00 + marca de disparo [skip ci]"
              sleep $((i * 5))
            done
            if [ "$OK" != "1" ]; then
              echo "::error::Push da marca de disparo 10:00 falhou apos 8 tentativas -- marca de idempotencia NAO foi salva, risco de reenvio duplicado."
              exit 1
            fi
          )
