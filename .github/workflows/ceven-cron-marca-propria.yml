# FICHA DO ARQUIVO
# O QUE É: gera os relatórios de Marca Própria (hoje + acumulado do mês) por gerente
#     e envia via WhatsApp para todos (Vitório + gerentes).
# RODA: workflow_dispatch disparado pelo Cloudflare ceven-cron-sync às 10:00 BRT.
#     NÃO tem mais schedule próprio aqui — o Cloudflare é o gatilho único (evita
#     duplicação: GH schedule + CF workflow_dispatch no mesmo horário = 2 runs).
# LÊ do Google Drive: pedidos_historico_ceven.db, VENDEDORES AUDITADOS.xlsx,
#     Produtos - Marcas Exclusivas.xls. Gera a árvore viva de vendedores ao vivo.
# ESCREVE: OPERACAO_WHATSAPP/relatorios_por_horario/10_00/*.md + envia WhatsApp.
# DEPENDE DE: secrets GDRIVE_SA_JSON e GDRIVE_FOLDER_ID + o banco ter sido atualizado
#     às 03:00 pelo ceven-cron-datalake.yml no mesmo dia.
# ÚLTIMA REVISÃO: 24/09/2026 (envio WA ligado + schedule removido, CF assume gatilho).
name: CEVEN — Marca Própria 10:00

on:
  # SEM schedule aqui — o Cloudflare (ceven-cron-sync) dispara workflow_dispatch
  # exatamente às 10:00 BRT. Ter schedule E CF = duplicação garantida.
  workflow_dispatch: {}

concurrency:
  group: ceven-marca-propria
  cancel-in-progress: false

jobs:
  gerar_marca_propria:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências (npm ci, mesma versão travada localmente)
        run: npm ci

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (Google Drive)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_JSON" > /tmp/gdrive-sa.json
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive-sa.json
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Baixar banco de dados do Google Drive
        run: |
          mkdir -p analises
          rclone copy gdrive:pedidos_historico_ceven.db analises/

      - name: Baixar VENDEDORES AUDITADOS.xlsx do Google Drive (fonte de verdade manual)
        run: rclone copy "gdrive:VENDEDORES AUDITADOS.xlsx" . || echo "Planilha não encontrada no Drive — usando filtro só por canal."
        continue-on-error: true

      - name: Baixar lista de SKUs de Marca Própria do Google Drive
        run: rclone copy "gdrive:Produtos - Marcas Exclusivas.xls" .

      - name: Gerar árvore viva de vendedores (ao vivo do CEVEN)
        run: node scripts/atualizar_arvore_viva_11_filiais.js

      - name: Gerar relatórios de Marca Própria (hoje + acumulado do mês)
        run: node scripts/gerar_marca_propria.js "$(date -u -d '-3 hours' +%Y-%m-%d)" todos

      - name: Copiar para a pasta oficial de entrega
        run: |
          DATA_REF="$(date -u -d '-3 hours' +%Y-%m-%d)"
          DEST="OPERACAO_WHATSAPP/relatorios_por_horario/10_00"
          mkdir -p "$DEST"
          for f in auditoria_mensagens/$DATA_REF/10_00__*.txt; do
            cp "$f" "$DEST/$(basename "$f" .txt).md"
          done

      - name: ⚡ Enviar via WhatsApp (ciclo 10:00 — todos)
        run: |
          node pipeline/ceven_unified_engine.js \
            --hora="10:00" \
            --acao="marca_propria" \
            --destino="todos"

      - name: Commitar relatórios + marca de disparo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          DATA_REF="$(date -u -d '-3 hours' +%Y-%m-%d)"
          FILES="OPERACAO_WHATSAPP/relatorios_por_horario/10_00/ config/diretrizes_operacionais.json"
          git add $FILES
          git diff --cached --quiet && echo "Sem mudança pra commitar." || (
            git commit -m "chore: relatorios de marca propria 10:00 + marca de disparo [skip ci]"
            OK=0
            for i in 1 2 3 4 5 6 7 8; do
              if git push; then
                OK=1
                break
              fi
              echo "Push falhou (tentativa $i) -- reconstruindo o commit em cima do origin mais recente (evita ficar preso no mesmo conflito de rebase)..."
              git fetch origin clean-v3
              git show origin/clean-v3:config/diretrizes_operacionais.json > /tmp/diretrizes_origin.json
              jq --arg d "$DATA_REF" '.controles_dia.ultimo_disparo_por_ciclo["10:00"] = $d' /tmp/diretrizes_origin.json > config/diretrizes_operacionais.json
              git reset --soft origin/clean-v3
              git add $FILES
              git diff --cached --quiet || git commit -m "chore: relatorios de marca propria 10:00 + marca de disparo [skip ci]"
              sleep $((i * 5))
            done
            if [ "$OK" != "1" ]; then
              echo "::error::Push da marca de disparo 10:00 falhou apos 8 tentativas -- marca de idempotencia NAO foi salva, risco de reenvio duplicado."
              exit 1
            fi
          )
