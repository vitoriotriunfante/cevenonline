# FICHA DO ARQUIVO
# O QUE É: coleta ONLINE do Clube da Venda (TradePro) via /api/clube-carga (sem depender de PC local).
# Segredos: TP_USER, TP_PASS (login TradePro) e EVO_KEY (ja existente).
name: Clube da Venda — coleta online para o D1

on:
  schedule:
    # REDUNDANCIA (16/11/2026): o worker-cron dispara em :02 e :32 (07h-20h45); este schedule do GitHub e a reserva em :17 e :47, 06h17-20h47 BRT.
    # Os dois juntos dao uma leitura a cada ~15 min; se um falhar, o outro segura 30 min. Seg a sab.
    - cron: '17 3-8 * * 1-6'      # 17/11/2026 (Vitorio: 'pq popular so as 07... ja tem todos os dados'): o Clube ja tem a rota do dia de madrugada — de hora em hora, 00h17-05h17 BRT
    - cron: '17,47 9-23 * * 1-6'  # depois, de 30 em 30 min (06h17-20h47 BRT); o worker-cron tambem dispara em :02 e :32 a partir das 07h
  workflow_dispatch:

concurrency:
  group: clube-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar segredos TradePro
        id: check
        env:
          TP_USER: ${{ secrets.TP_USER }}
          TP_PASS: ${{ secrets.TP_PASS }}
        run: |
          if [ -z "$TP_USER" ] || [ -z "$TP_PASS" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "AVISO: segredos TP_USER / TP_PASS ainda nao configurados neste repositorio."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar dependencias e navegador
        if: steps.check.outputs.ok == 'true'
        run: |
          npm ci --no-audit --no-fund
          for t in 1 2 3 4; do npx playwright install --with-deps chromium && break; sleep 20; done
      - name: Coletar Clube da Venda e enviar para /api/clube-carga
        if: steps.check.outputs.ok == 'true'
        env:
          TP_USER: ${{ secrets.TP_USER }}
          TP_PASS: ${{ secrets.TP_PASS }}
          EVO_KEY: ${{ secrets.EVO_KEY }}
          CEVEN_SITE_URL: https://ceven-cftv-matrix.pages.dev
        run: node pipeline/clube_coletor.mjs --api
      - name: Rota do dia com os nomes (Clube, Roteiro Consolidado Geral; so rele depois de 3 h)
        # 18/11/2026 (plano do JOTA, bloco D): a rota nominal das 11 filiais sai do Clube, nao do CEVEN
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          TP_USER: ${{ secrets.TP_USER }}
          TP_PASS: ${{ secrets.TP_PASS }}
          EVO_KEY: ${{ secrets.EVO_KEY }}
          CEVEN_SITE_URL: https://ceven-cftv-matrix.pages.dev
        run: node pipeline/clube_roteiro.mjs --api
      - name: Arvore de supervisores (CEVEN admin, so se passou de 45 min)
        # 17/11/2026 (Vitorio: "a arvore precisa bater no CEVEN e no GEROT"): quem renovava era o coletor de lances antigo, parado desde 13/11
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        run: |
          curl -s --max-time 120 "https://ceven-cftv-matrix.pages.dev/api/cron-arvore?so_se_velha=1" | head -c 400 || true
      - name: Liga — lances do dia (Clube + GEROT)
        # 17/11/2026 (Vitorio: "colocar no ar urgente a Champions"): /api/liga-clube grava os lances de hoje que ja aconteceram (INSERT OR IGNORE)
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        env:
          EVO_KEY: ${{ secrets.EVO_KEY }}
        run: |
          curl -s --max-time 150 -H "X-Evo-Key: $EVO_KEY" "https://ceven-cftv-matrix.pages.dev/api/liga-clube?grava=1" | head -c 600 || true

