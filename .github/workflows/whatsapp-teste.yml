# FICHA DO ARQUIVO
# O QUE É: manda UMA mensagem de teste pelo WhatsApp (Evolution, instancia dos disparos) para um numero escolhido.
#          Nao mexe nos ciclos, nao marca nada como disparado. Vitorio, 22/10/2026 (troca do numero para Mais Mix Triunfante).
name: WhatsApp — mensagem de teste

on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Numero(s) com DDI e DDD, separados por virgula (ex.: 554187525605)'
        required: true
        default: '554187525605'
      texto:
        description: 'Texto (vazio = mensagem de teste)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar
        env:
          EVO_URL: ${{ secrets.EVO_URL }}
          EVO_KEY: ${{ secrets.EVO_KEY }}
          EVO_INSTANCE: ${{ secrets.EVO_INSTANCE }}
          NUMERO: ${{ github.event.inputs.numero }}
          TEXTO: ${{ github.event.inputs.texto }}
        run: |
          INST="${EVO_INSTANCE:-ceven-noc}"
          TXT="${TEXTO:-✅ Teste do CEVEN NOC: esta mensagem saiu do número novo dos disparos (Mais Mix Triunfante) em $(TZ=America/Sao_Paulo date '+%d/%m %H:%M').}"
          FALHA=0; PRIMEIRO=1
          for N in $(echo "$NUMERO" | tr ',' ' '); do
            case "$N" in *[!0-9]*|"") echo "numero invalido: $N"; FALHA=1; continue;; esac
            [ $PRIMEIRO = 1 ] || sleep 20; PRIMEIRO=0
            BODY=$(jq -n --arg n "$N" --arg t "$TXT" '{number:$n, text:$t}')
            CODE=$(curl -s -o resp.json -w '%{http_code}' -X POST "${EVO_URL%/}/message/sendText/$INST" -H "apikey: $EVO_KEY" -H 'Content-Type: application/json' -d "$BODY")
            echo "$N -> HTTP $CODE $(jq -c '.status' resp.json 2>/dev/null)"
            [ "$CODE" -lt 300 ] || FALHA=1
          done
          exit $FALHA
