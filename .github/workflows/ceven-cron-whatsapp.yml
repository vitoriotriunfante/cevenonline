# FICHA DO ARQUIVO
# O QUE É: dispara os 6 ciclos de WhatsApp do dia (04:00, 07:45, 11:30, 14:30, 17:00, 18:30).
# RODA: cron abaixo (seg-sex, horário UTC = BRT+3) ou manual via workflow_dispatch.
# LÊ: API do CEVEN ao vivo (via pipeline/ceven_unified_engine.js) + VENDEDORES AUDITADOS.xlsx
#     e a árvore viva de vendedores, ambos baixados/gerados dentro deste próprio workflow.
# ESCREVE: mensagens reais no WhatsApp + pipeline/dados_abertura_matinal.json (cache 04:00→07:45).
# DEPENDE DE: secrets GDRIVE_SA_JSON e GDRIVE_FOLDER_ID (só pra planilha de vendedores).
# ÚLTIMA REVISÃO: 23/09/2026 (Node 24 + npm ci, geração da árvore viva embutida).
name: CEVEN NOC — Disparos Oficiais WhatsApp

concurrency:
  group: ceven-whatsapp-dispatch
  cancel-in-progress: false

on:
  schedule:
    # UM ÚNICO horário de cron, rodando a cada 10min de 06:00 a 23:59 UTC (03:00 a
    # 20:59 BRT), seg-sex. Evidência real de hoje (23/09): ceven-cron-datalake.yml
    # (1 unico cron) disparou sozinho; este arquivo, com 12 entradas de cron
    # diferentes, NÃO disparou nenhuma vez em 2 janelas + 2 réplicas. Muitas entradas
    # de schedule no mesmo workflow parecem atrapalhar o agendador do GitHub. Solução:
    # só 1 entrada (como o datalake, que funcionou), rodando com frequência — a lógica
    # de janela de horário (abaixo, "Determinar Ciclo") e a trava de idempotência
    # (controles_dia.ultimo_disparo_por_ciclo) já decidem sozinhas o que fazer a cada
    # execução, sem duplicar envio.
    - cron: '*/10 6-23 * * 1-5'

  workflow_dispatch:
    inputs:
      ciclo:
        description: 'Ciclo a disparar'
        required: true
        default: '11:30'
        type: choice
        options:
          - '04:00'
          - '07:45'
          - '11:30'
          - '14:30'
          - '17:00'
          - '18:30'
      destino:
        description: 'Destinatário (segurança: vitorio por padrão)'
        required: true
        default: 'vitorio'
        type: choice
        options:
          - 'vitorio'
          - 'todos'
          - 'dry_run'

jobs:
  executar_disparo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Dependências do Motor (npm ci, mesma versão travada localmente)
        run: npm ci

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (Google Drive)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_JSON" > /tmp/gdrive-sa.json
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive-sa.json
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Baixar VENDEDORES AUDITADOS.xlsx do Google Drive (fonte de verdade manual)
        run: rclone copy "gdrive:VENDEDORES AUDITADOS.xlsx" . || echo "Planilha não encontrada no Drive ainda — disparo segue só com filtro de canal."
        continue-on-error: true

      - name: Definir CNAE do dia (rotação automática seg-sex)
        run: node scripts/atualizar_cnae_do_dia.js

      - name: Gerar árvore viva de vendedores (ao vivo do CEVEN)
        run: node scripts/atualizar_arvore_viva_11_filiais.js

      - name: Determinar Ciclo e Parâmetros de Disparo
        id: config
        run: |
          HORA_UTC=$(date -u +"%H:%M")
          H=$(date -u +"%H")
          M=$(date -u +"%M")
          TOTAL_MIN=$(( 10#$H * 60 + 10#$M ))

          if [ "${{ github.event.inputs.ciclo }}" != "" ]; then
            CICLO="${{ github.event.inputs.ciclo }}"
          # 21:30 UTC = 1290 min (18:30 BRT Fechamento) -> Se disparar após 21:00 UTC (>= 1260 min)
          elif [ $TOTAL_MIN -ge 1260 ]; then
            CICLO="18:30"
          # 20:00 UTC = 1200 min (17:00 BRT Reta Final) -> Janela 1170 a 1259 min (16:30 a 17:59 BRT)
          elif [ $TOTAL_MIN -ge 1170 ] && [ $TOTAL_MIN -le 1259 ]; then
            CICLO="17:00"
          # 17:30 UTC = 1050 min (14:30 BRT Virada Tarde) -> Janela 990 a 1169 min (13:30 a 16:29 BRT)
          elif [ $TOTAL_MIN -ge 990 ] && [ $TOTAL_MIN -le 1169 ]; then
            CICLO="14:30"
          # 14:30 UTC = 870 min (11:30 BRT Gestão Campo) -> Janela 796 a 989 min (10:56 a 13:29 BRT)
          elif [ $TOTAL_MIN -ge 796 ] && [ $TOTAL_MIN -le 989 ]; then
            CICLO="11:30"
          # 10:45 UTC = 645 min (07:45 BRT Abertura) -> Janela 510 a 795 min (05:30 a 10:55 BRT)
          elif [ $TOTAL_MIN -ge 510 ] && [ $TOTAL_MIN -le 795 ]; then
            CICLO="07:45"
          # 07:00 UTC = 420 min (04:00 BRT Aquecimento Noturno) -> Janela 360 a 509 min (03:00 a 05:29 BRT)
          elif [ $TOTAL_MIN -ge 360 ] && [ $TOTAL_MIN -le 509 ]; then
            CICLO="04:00"
          else
            echo "⚠️ Execução fora das janelas operacionais comerciais ($TOTAL_MIN min UTC). Abortando com segurança."
            exit 0
          fi

          # 1. Determinar Ação baseada no Ciclo
          if [ "$CICLO" = "04:00" ]; then
            ACAO="aquecimento_matinal"
          elif [ "$CICLO" = "07:45" ]; then
            ACAO="abertura"
          elif [ "$CICLO" = "11:30" ]; then
            ACAO="gestao_campo"
          else
            ACAO="vendas_zerados"
          fi

          # 2. Determinar Destino
          if [ "${{ github.event.inputs.destino }}" != "" ]; then
            DESTINO="${{ github.event.inputs.destino }}"
          elif [ "$CICLO" = "04:00" ]; then
            DESTINO="dry_run"
          elif [ "$CICLO" = "07:45" ]; then
            DESTINO="vitorio"
          else
            DESTINO="todos"
          fi

          echo "ciclo=$CICLO" >> $GITHUB_OUTPUT
          echo "acao=$ACAO" >> $GITHUB_OUTPUT
          echo "destino=$DESTINO" >> $GITHUB_OUTPUT
          echo "🚀 Executando Ciclo: $CICLO | Ação: $ACAO | Destino: $DESTINO (Hora UTC: $HORA_UTC)"

      - name: ⚡ Executar Motor Unificado CEVEN (WhatsApp)
        run: |
          CICLO="${{ steps.config.outputs.ciclo }}"
          ACAO="${{ steps.config.outputs.acao }}"
          DESTINO="${{ steps.config.outputs.destino }}"

          if [ -z "$CICLO" ]; then
            echo "Nenhum ciclo definido para esta execução. Finalizando."
            exit 0
          fi

          echo "Iniciando ceven_unified_engine.js..."
          node pipeline/ceven_unified_engine.js \
            --hora="$CICLO" \
            --acao="$ACAO" \
            --destino="$DESTINO"

      - name: 💾 Salvar Cache Matinal no Repositório (se ciclo 04:00)
        if: steps.config.outputs.ciclo == '04:00'
        run: |
          if [ -f "pipeline/dados_abertura_matinal.json" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add pipeline/dados_abertura_matinal.json
            git commit -m "chore: atualizacao automatica do cache matinal 04h [skip ci]" || true
            git push || true
            echo "✅ Cache matinal salvo com sucesso para o disparo das 07:45."
          fi

      - name: 🔒 Salvar marca de "ciclo já disparado hoje" + Alerta de Risco (07:45)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config/diretrizes_operacionais.json OPERACAO_WHATSAPP/relatorios_por_horario/07_45/ OPERACAO_WHATSAPP/relatorios_por_horario/11_30/
          git diff --cached --quiet && echo "Sem mudança pra commitar." || (
            git commit -m "chore: marca ciclo ${{ steps.config.outputs.ciclo }} disparado + alerta de risco [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin clean-v3 && git push && break
              echo "Push falhou (tentativa $i), tentando de novo..."
              sleep 5
            done
          )
