name: CEVEN NOC — Disparos Oficiais WhatsApp

on:
  schedule:
    # =========================================================================
    # GRADE OFICIAL DE HORÁRIOS UTC (Brasília = UTC - 3)
    # =========================================================================
    # 07:00 BRT (10:00 UTC) — Abertura Matinal (Diretoria)
    - cron: '0 10 * * 1-6'
    # 11:00 BRT (14:00 UTC) — 1ª Parcial de Vendas & Varejo Zerados (Todos)
    - cron: '0 14 * * 1-6'
    # 11:30 BRT (14:30 UTC) — Gestão de Campo: Compromissos & RET (Gerentes)
    - cron: '30 14 * * 1-6'
    # 14:30 BRT (17:30 UTC) — Relatório Operacional de Tração (Pausado para validação do Vitório)
    # - cron: '30 17 * * 1-6'
    # 17:00 BRT (20:00 UTC) — Fechamento de Campo (Pausado para validação prévia do Vitório às 16:55)
    # - cron: '0 20 * * 1-6'
    # 18:30 BRT (21:30 UTC) — Fechamento Oficial do Dia (Todos)
    - cron: '30 21 * * 1-6'

  workflow_dispatch:
    inputs:
      ciclo:
        description: 'Ciclo a disparar'
        required: true
        default: '11:00'
        type: choice
        options:
          - '07:00'
          - '11:00'
          - '11:30'
          - '14:30'
          - '17:00'
          - '18:30'

jobs:
  executar_disparo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências do Motor
        run: |
          npm install axios xlsx

      - name: Determinar Ciclo e Parâmetros de Disparo
        id: config
        run: |
          HORA_UTC=$(date -u +"%H:%M")
          H=$(date -u +"%H")
          M=$(date -u +"%M")
          TOTAL_MIN=$(( 10#$H * 60 + 10#$M ))

          if [ "${{ github.event.inputs.ciclo }}" != "" ]; then
            CICLO="${{ github.event.inputs.ciclo }}"
          # 10:00 UTC = 600 min (07:00 BRT Abertura) -> Janela 585 a 620 min
          elif [ $TOTAL_MIN -ge 585 ] && [ $TOTAL_MIN -le 620 ]; then
            CICLO="07:00"
          # 14:00 UTC = 840 min (11:00 BRT Vendas) -> Janela 825 a 855 min
          elif [ $TOTAL_MIN -ge 825 ] && [ $TOTAL_MIN -le 855 ]; then
            CICLO="11:00"
          # 14:30 UTC = 870 min (11:30 BRT Gestão Campo) -> Janela 856 a 900 min
          elif [ $TOTAL_MIN -ge 856 ] && [ $TOTAL_MIN -le 900 ]; then
            CICLO="11:30"
          # 17:30 UTC = 1050 min (14:30 BRT Tração) -> Janela 1035 a 1080 min
          elif [ $TOTAL_MIN -ge 1035 ] && [ $TOTAL_MIN -le 1080 ]; then
            CICLO="14:30"
          # 20:00 UTC = 1200 min (17:00 BRT Reta Final) -> Janela 1185 a 1230 min
          elif [ $TOTAL_MIN -ge 1185 ] && [ $TOTAL_MIN -le 1230 ]; then
            CICLO="17:00"
          # 21:30 UTC = 1290 min (18:30 BRT Fechamento) -> Janela 1275 a 1320 min
          elif [ $TOTAL_MIN -ge 1275 ] && [ $TOTAL_MIN -le 1320 ]; then
            CICLO="18:30"
          else
            CICLO="11:00"
          fi

          if [ "$CICLO" = "07:00" ]; then
            ACAO="abertura"
            DESTINO="vitorio"
          elif [ "$CICLO" = "11:30" ]; then
            ACAO="gestao_campo"
            DESTINO="todos"
          else
            ACAO="vendas_zerados"
            DESTINO="todos"
          fi

          echo "ciclo=$CICLO" >> $GITHUB_OUTPUT
          echo "acao=$ACAO" >> $GITHUB_OUTPUT
          echo "destino=$DESTINO" >> $GITHUB_OUTPUT
          echo "🚀 Executando Ciclo: $CICLO | Ação: $ACAO | Destino: $DESTINO (Hora UTC: $HORA_UTC)"

      - name: ⚡ Executar Motor Unificado CEVEN (WhatsApp)
        run: |
          CICLO="${{ steps.config.outputs.ciclo }}"
          ACAO="${{ steps.config.outputs.acao }}"
          DESTINO="${{ steps.config.outputs.destino }}"

          echo "Iniciando ceven_unified_engine.js..."
          node pipeline/ceven_unified_engine.js \
            --hora="$CICLO" \
            --acao="$ACAO" \
            --destino="$DESTINO"
