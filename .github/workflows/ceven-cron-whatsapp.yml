# FICHA DO ARQUIVO
# O QUE É: dispara os 6 ciclos de WhatsApp do dia (04:00, 07:45, 11:30, 14:30, 17:00, 18:30).
# RODA: cron abaixo (seg-sex, horário UTC = BRT+3) ou manual via workflow_dispatch.
# LÊ: API do CEVEN ao vivo (via pipeline/ceven_unified_engine.js) + VENDEDORES AUDITADOS.xlsx
#     e a árvore viva de vendedores, ambos baixados/gerados dentro deste próprio workflow.
# ESCREVE: mensagens reais no WhatsApp + pipeline/dados_abertura_matinal.json (cache 04:00→07:45).
# DEPENDE DE: secrets GDRIVE_SA_JSON e GDRIVE_FOLDER_ID (só pra planilha de vendedores).
# ÚLTIMA REVISÃO: 23/09/2026 (Node 24 + npm ci, geração da árvore viva embutida).
name: CEVEN NOC — Disparos Oficiais WhatsApp

concurrency:
  group: ceven-whatsapp-dispatch
  cancel-in-progress: true

on:
  # SEM schedule no GitHub — O Cloudflare Pago (ceven-cron-sync) e o Maestro Unico
  # que dispara via workflow_dispatch com pontualidade suica nos horarios oficiais.
  workflow_dispatch:
    inputs:
      ciclo:
        description: 'Ciclo a disparar'
        required: true
        default: '11:30'
        type: choice
        options:
          - '04:00'
          - '07:45'
          - '11:30'
          - '14:30'
          - '17:00'
          - '18:30'
      destino:
        description: 'Destinatário (segurança: vitorio por padrão)'
        required: true
        default: 'vitorio'
        type: choice
        options:
          - 'vitorio'
          - 'todos'
          - 'dry_run'

jobs:
  executar_disparo:
    runs-on: ubuntu-latest
    # 15min estourava quando a API do CEVEN ficava lenta (achado em 28/09/2026: 8 de 30 runs
    # recentes cancelados por timeout, cortando o envio no meio -- 9 gerentes sem receber a
    # mensagem das 17:00 nesse dia). 25min da folga sem deixar o job preso indefinidamente.
    # 07/10/2026: o disparo das 18:30 estourou os 25 min porque o CEVEN ficou lento (coleta de 13,5 min contra 2,7 min no 17:00) e foi cancelado sem enviar. Folga de 40 min.
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Trava de Segurança - Bloqueio de Fim de Semana e Feriados (com Exceção em Esporádicos)
        id: calendario
        run: |
          DIA=$(TZ='America/Sao_Paulo' date +%u)
          DATA_HOJE=$(TZ='America/Sao_Paulo' date +%Y-%m-%d)
          BLOQUEADO=false
          DESTINO_INPUT="${{ github.event.inputs.destino }}"
          if [ "$DESTINO_INPUT" = "dry_run" ]; then
            echo "🔎 destino=dry_run (nunca manda mensagem real) — trava de calendário não se aplica. Aquecimento pode rodar todo dia."
            echo "bloqueado=$BLOQUEADO" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$DIA" -ge 6 ]; then
            if jq -e --arg d "$DATA_HOJE" '.esporadicos.datas_autorizadas | index($d)' config/diretrizes_operacionais.json >/dev/null; then
              echo "⚠️ Fim de semana com autorização esporádica ativa em diretrizes_operacionais.json. Prosseguindo..."
            else
              echo "🛑 [ABORTADO] Hoje é fim de semana em Brasília ($DATA_HOJE). Disparos comerciais suspensos."
              BLOQUEADO=true
            fi
          fi
          FERIADOS="2026-01-01 2026-02-16 2026-02-17 2026-04-03 2026-04-21 2026-05-01 2026-06-04 2026-09-07 2026-10-12 2026-11-02 2026-11-15 2026-11-20 2026-12-25"
          if [ "$BLOQUEADO" = "false" ] && echo "$FERIADOS" | grep -qw "$DATA_HOJE"; then
            if jq -e --arg d "$DATA_HOJE" '.esporadicos.datas_autorizadas | index($d)' config/diretrizes_operacionais.json >/dev/null; then
              echo "⚠️ Feriado com autorização esporádica ativa em diretrizes_operacionais.json. Prosseguindo..."
            else
              echo "🛑 [ABORTADO] Hoje é feriado nacional ($DATA_HOJE). Disparos comerciais suspensos."
              BLOQUEADO=true
            fi
          fi
          echo "bloqueado=$BLOQUEADO" >> $GITHUB_OUTPUT

      - name: Configurar Node.js
        if: steps.calendario.outputs.bloqueado != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Dependências do Motor (npm ci, mesma versão travada localmente)
        if: steps.calendario.outputs.bloqueado != 'true'
        run: npm ci

      - name: Instalar rclone
        if: steps.calendario.outputs.bloqueado != 'true'
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (Google Drive)
        if: steps.calendario.outputs.bloqueado != 'true'
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || '1sqzFpWEKb1WKhT9MksQcQl8RuY94DQum' }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_JSON" > /tmp/gdrive-sa.json
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive-sa.json
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Baixar a equipe (Gestão de Equipe, via /api/tv-mostra) - fonte única
        if: steps.calendario.outputs.bloqueado != 'true'
        run: curl -fsS -m 60 "https://ceven-cftv-matrix.pages.dev/api/tv-mostra?t=1" -o mostra_equipe.json || echo "Equipe não baixada — equipe não aplicada neste ciclo."
        continue-on-error: true

      - name: Definir CNAE do dia (rotação automática seg-sex)
        if: steps.calendario.outputs.bloqueado != 'true'
        run: node scripts/atualizar_cnae_do_dia.js

      - name: Gerar árvore viva de vendedores (ao vivo do CEVEN)
        if: steps.calendario.outputs.bloqueado != 'true'
        run: node scripts/atualizar_arvore_viva_11_filiais.js

      - name: Determinar Ciclo e Parâmetros de Disparo
        id: config
        if: steps.calendario.outputs.bloqueado != 'true'
        run: |
          HORA_UTC=$(date -u +"%H:%M")
          H=$(date -u +"%H")
          M=$(date -u +"%M")
          TOTAL_MIN=$(( 10#$H * 60 + 10#$M ))

          if [ "${{ github.event.inputs.ciclo }}" != "" ]; then
            CICLO="${{ github.event.inputs.ciclo }}"
          # 21:30 UTC = 1290 min (18:30 BRT Fechamento) -> Se disparar após 21:00 UTC (>= 1260 min)
          elif [ $TOTAL_MIN -ge 1260 ]; then
            CICLO="18:30"
          # 20:00 UTC = 1200 min (17:00 BRT Reta Final) -> Janela 1170 a 1259 min (16:30 a 17:59 BRT)
          elif [ $TOTAL_MIN -ge 1170 ] && [ $TOTAL_MIN -le 1259 ]; then
            CICLO="17:00"
          # 17:30 UTC = 1050 min (14:30 BRT Virada Tarde) -> Janela 990 a 1169 min (13:30 a 16:29 BRT)
          elif [ $TOTAL_MIN -ge 990 ] && [ $TOTAL_MIN -le 1169 ]; then
            CICLO="14:30"
          # 14:30 UTC = 870 min (11:30 BRT Gestão Campo) -> Janela 796 a 989 min (10:56 a 13:29 BRT)
          elif [ $TOTAL_MIN -ge 796 ] && [ $TOTAL_MIN -le 989 ]; then
            CICLO="11:30"
          # 10:45 UTC = 645 min (07:45 BRT Abertura) -> Janela 510 a 795 min (05:30 a 10:55 BRT)
          elif [ $TOTAL_MIN -ge 510 ] && [ $TOTAL_MIN -le 795 ]; then
            CICLO="07:45"
          # 07:00 UTC = 420 min (04:00 BRT Aquecimento Noturno) -> Janela 360 a 509 min (03:00 a 05:29 BRT)
          elif [ $TOTAL_MIN -ge 360 ] && [ $TOTAL_MIN -le 509 ]; then
            CICLO="04:00"
          else
            echo "⚠️ Execução fora das janelas operacionais comerciais ($TOTAL_MIN min UTC). Abortando com segurança."
            exit 0
          fi

          # 1. Determinar Ação baseada no Ciclo
          if [ "$CICLO" = "04:00" ]; then
            ACAO="aquecimento_matinal"
          elif [ "$CICLO" = "07:45" ]; then
            ACAO="abertura"
          elif [ "$CICLO" = "11:30" ]; then
            ACAO="gestao_campo"
          else
            ACAO="vendas_zerados"
          fi

          # 2. Determinar Destino
          # 07:45 liberado para "todos" (Vitorio + gerentes) em 24/09/2026 -- ate aqui
          # ficava so "vitorio" (fase de validacao do modelo, ja aprovado pelo Vitorio).
          if [ "${{ github.event.inputs.destino }}" != "" ]; then
            DESTINO="${{ github.event.inputs.destino }}"
          elif [ "$CICLO" = "04:00" ]; then
            DESTINO="dry_run"
          else
            DESTINO="todos"
          fi

          echo "ciclo=$CICLO" >> $GITHUB_OUTPUT
          echo "acao=$ACAO" >> $GITHUB_OUTPUT
          echo "destino=$DESTINO" >> $GITHUB_OUTPUT
          echo "🚀 Executando Ciclo: $CICLO | Ação: $ACAO | Destino: $DESTINO (Hora UTC: $HORA_UTC)"

      # LOCK GLOBAL (achado 29/09/2026): WhatsApp tem prioridade sobre TV Executiva/CFTV — os
      # crons da TV checam esse lock (functions/api/cron-lock.js) e pulam o ciclo se estiver
      # ativo. Trava aqui, ANTES do motor rodar (que é quem de fato varre os RCAs no CEVEN);
      # libera sempre no fim, com if: always(), mesmo se o motor falhar — nunca deixa os
      # outros crons travados por um disparo que deu erro.
      - name: 🔒 Travar lock global (prioridade sobre TV/CFTV)
        if: steps.calendario.outputs.bloqueado != 'true'
        run: curl -sS -m 15 -X POST "https://ceven-cftv-matrix.pages.dev/api/cron-lock?dono=whatsapp" || true

      - name: ⚡ Executar Motor Unificado CEVEN (WhatsApp)
        if: steps.calendario.outputs.bloqueado != 'true'
        env:
          CEVEN_ADMIN_USER: ${{ secrets.CEVEN_ADMIN_USER }}
          CEVEN_ADMIN_PASS: ${{ secrets.CEVEN_ADMIN_PASS }}
          EVO_URL: ${{ secrets.EVO_URL }}
          EVO_KEY: ${{ secrets.EVO_KEY }}
          EVO_INSTANCE: ${{ secrets.EVO_INSTANCE }}
        run: |
          CICLO="${{ steps.config.outputs.ciclo }}"
          ACAO="${{ steps.config.outputs.acao }}"
          DESTINO="${{ steps.config.outputs.destino }}"

          if [ -z "$CICLO" ]; then
            echo "Nenhum ciclo definido para esta execução. Finalizando."
            exit 0
          fi

          echo "Iniciando ceven_unified_engine.js..."
          node pipeline/ceven_unified_engine.js \
            --hora="$CICLO" \
            --acao="$ACAO" \
            --destino="$DESTINO"

      - name: 🔓 Liberar lock global
        if: always()
        run: curl -sS -m 15 -X DELETE "https://ceven-cftv-matrix.pages.dev/api/cron-lock" || true

      - name: 💾 Salvar Cache Matinal no Repositório (se ciclo 04:00)
        if: steps.calendario.outputs.bloqueado != 'true' && steps.config.outputs.ciclo == '04:00'
        run: |
          if [ -f "pipeline/dados_abertura_matinal.json" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add pipeline/dados_abertura_matinal.json
            git commit -m "chore: atualizacao automatica do cache matinal 04h [skip ci]" || true
            git push || true
            echo "✅ Cache matinal salvo com sucesso para o disparo das 07:45."
          fi

      - name: 🔒 Salvar marca de "ciclo já disparado hoje" + Alerta de Risco (07:45)
        if: always() && steps.calendario.outputs.bloqueado != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          CICLO="${{ steps.config.outputs.ciclo }}"
          DATA_REF="$(date -u -d '-3 hours' +%Y-%m-%d)"
          FILES="config/diretrizes_operacionais.json OPERACAO_WHATSAPP/relatorios_por_horario/07_45/ OPERACAO_WHATSAPP/relatorios_por_horario/11_30/ OPERACAO_WHATSAPP/relatorios_por_horario/14_30/ OPERACAO_WHATSAPP/relatorios_por_horario/17_00/ OPERACAO_WHATSAPP/relatorios_por_horario/18_30/"
          git add $FILES
          git diff --cached --quiet && echo "Sem mudança pra commitar." || (
            git commit -m "chore: marca ciclo $CICLO disparado + alerta de risco [skip ci]"
            OK=0
            for i in 1 2 3 4 5 6 7 8; do
              if git push; then
                OK=1
                break
              fi
              echo "Push falhou (tentativa $i) -- reconstruindo o commit em cima do origin mais recente (evita ficar preso no mesmo conflito de rebase)..."
              git fetch origin ${{ github.ref_name }}
              # Sempre parte do diretrizes_operacionais.json mais recente do origin e só
              # reaplica nossa marca de disparo por cima (evita conflito textual no resto do arquivo).
              git show origin/${{ github.ref_name }}:config/diretrizes_operacionais.json > /tmp/diretrizes_origin.json
              jq --arg c "$CICLO" --arg d "$DATA_REF" '.controles_dia.ultimo_disparo_por_ciclo[$c] = $d' /tmp/diretrizes_origin.json > config/diretrizes_operacionais.json
              # --mixed e NAO --soft (autorizado pelo Vitorio em 05/10/2026): o --soft mantinha o indice do checkout velho e o commit automatico DESFAZIA arquivos de outras sessoes (reproduzido em teste isolado)
              git reset --mixed origin/${{ github.ref_name }}
              git add $FILES
              git diff --cached --quiet || git commit -m "chore: marca ciclo $CICLO disparado + alerta de risco [skip ci]"
              sleep $((i * 5))
            done
            if [ "$OK" != "1" ]; then
              echo "::error::Push da marca de disparo $CICLO falhou apos 8 tentativas -- marca de idempotencia NAO foi salva, risco de reenvio duplicado."
              exit 1
            fi
          )
