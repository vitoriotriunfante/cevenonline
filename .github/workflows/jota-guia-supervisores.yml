# =========================================================================
# JOTA — Envio Oficial do Guia de Comandos aos Supervisores
# Vitório (29/10/2026): "Deixe agendado para enviar o cardapio aos supervisores as 07:00 da manhã de Brasilia, ok?"
#                      "se não der, manda um texto mesmo com alguns exemplos... não quero que eles tenham links por agora"
# Roda: Sexta-feira 30/10/2026 às 07:00 BRT (10:00 UTC).
# Intervalo de segurança anti-spam: 5 segundos entre cada supervisor.
# Quem já recebeu (bot_msgs tipo 'cardapio') NUNCA recebe de novo (idempotente).
# =========================================================================
name: JOTA — Guia de Comandos aos Supervisores

on:
  schedule:
    # 07:00 BRT = 10:00 UTC no dia 30/10/2026
    - cron: '0 10 30 10 *'
  workflow_dispatch:
    inputs:
      destino:
        description: 'Destinatário (todos ou teste vitorio)'
        required: true
        default: 'todos'
        type: choice
        options:
          - 'todos'
          - 'vitorio'
          - 'dry_run'

jobs:
  disparo_supervisores:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Disparar Guia Operacional do Jota via API Cloudflare
        env:
          EVO_KEY: ${{ secrets.EVO_KEY }}
          DESTINO: ${{ github.event.inputs.destino || 'todos' }}
        run: |
          echo "Iniciando disparo do Guia do Jota..."
          echo "Destino configurado: $DESTINO"
          B="https://ceven-cftv-matrix.pages.dev/api/jota-cardapio"

          if [ "$DESTINO" = "vitorio" ]; then
            echo "Enviando teste exclusivo para Vitório..."
            curl -fsS -m 40 -X POST -H "X-Evo-Key: $EVO_KEY" "$B?celular=554187525605"
            echo ""
            exit 0
          fi

          if [ "$DESTINO" = "dry_run" ]; then
            echo "--- SIMULAÇÃO DE PRÉVIA DO TEXTO (ZERO LINKS) ---"
            curl -fsS -m 30 -H "X-Evo-Key: $EVO_KEY" "$B?previa=1"
            echo ""
            echo "Consultando lista de pendentes:"
            curl -fsS -m 30 -H "X-Evo-Key: $EVO_KEY" "$B"
            echo ""
            exit 0
          fi

          # Busca a lista de celulares pendentes
          RES_JSON=$(curl -fsS -m 30 -H "X-Evo-Key: $EVO_KEY" "$B")
          echo "Resposta pendentes: $RES_JSON"

          LISTA=$(echo "$RES_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join([x['celular'] for x in d.get('pendentes',[])]))")
          TOTAL=$(echo $LISTA | wc -w)
          echo "Total de supervisores a enviar: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo "Nenhum supervisor pendente. Todos já receberam!"
            exit 0
          fi

          I=1
          for CEL in $LISTA; do
            echo "[$I/$TOTAL] Enviando para $CEL..."
            RESP=$(curl -fsS -m 40 -X POST -H "X-Evo-Key: $EVO_KEY" "$B?celular=$CEL")
            echo "  Resultado: $RESP"
            I=$((I + 1))
            sleep 5
          done

          echo "Disparo concluído com sucesso!"
