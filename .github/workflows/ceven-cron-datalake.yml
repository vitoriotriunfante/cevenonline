# FICHA DO ARQUIVO
# O QUE É: atualiza os dados operacionais do Data Lake sem bloquear a publicação do histórico expandido,
#     popula analises/pedidos_historico_ceven.db e entrega a etapa longa ao workflow de histórico expandido.
# RODA: todo dia às 03:00 BRT (cron abaixo) ou manual via workflow_dispatch.
# LÊ do Google Drive: pedidos_historico_ceven.db (se existir; senão cria do zero).
# ESCREVE no Google Drive: pedidos_historico_ceven.db atualizado somente se os 10
#     extratores terminarem sem falha. Se algum falhar, preserva a última cópia boa.
# USADO POR: ceven-cron-marca-propria.yml (10:00) depende do banco já atualizado aqui.
# DEPENDE DE: secrets GDRIVE_SA_JSON e GDRIVE_FOLDER_ID.
# ÚLTIMA REVISÃO: 23/09/2026 (Node 24 + npm ci; corrigido YAML invalido "gdrive:" solto
#     no fim de linha, que quebrava o parse do arquivo inteiro desde a criação).
name: CEVEN Data Lake — Atualização Diária (Pedidos, Devoluções, PDVs, Live)

on:
  # Agendamento do GitHub removido em 03/10/2026: quem dispara e o Worker do Cloudflare, todo dia as 03:00 BRT
  # (06:00 UTC, '0 6 * * *' em worker-cron). Os dois juntos faziam a rotina inteira rodar duas vezes.
  workflow_dispatch: {}

concurrency:
  group: ceven-datalake-update
  cancel-in-progress: false

env:
  CEVEN_APP_SECRET: ${{ secrets.CEVEN_APP_SECRET }}

jobs:
  atualizar_datalake:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write   # para disparar o gerador do Brasileirao no fim
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4


      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Header X-App-Secret em toda chamada ao CEVEN (node sempre com --require; 19/10/2026)
        # NODE_OPTIONS via $GITHUB_ENV e BLOQUEADO pelo GitHub ("Can't store NODE_OPTIONS"): desde 09/10/2026 os scripts chamavam o CEVEN SEM o header,
        # levavam 401 e o Data Lake gravou ZERO pedidos por 11 dias sem acusar erro. Agora um atalho 'node' na frente do PATH carrega o header sempre.
        run: |
          REAL="$(command -v node)"
          mkdir -p "$HOME/ceven-bin"
          printf '#!/bin/bash\nexec "%s" --require "%s/pipeline/ceven_header.js" "$@"\n' "$REAL" "$GITHUB_WORKSPACE" > "$HOME/ceven-bin/node"
          chmod +x "$HOME/ceven-bin/node"
          echo "$HOME/ceven-bin" >> "$GITHUB_PATH"
          "$HOME/ceven-bin/node" -e "if(!process.env.CEVEN_APP_SECRET){console.error('CEVEN_APP_SECRET ausente');process.exit(1)} console.log('header X-App-Secret ativo')"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências Node (npm ci, mesma versão travada localmente)
        run: npm ci

      - name: Instalar dependências Python
        run: pip install requests openpyxl

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (Google Drive)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || '1sqzFpWEKb1WKhT9MksQcQl8RuY94DQum' }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_JSON" > /tmp/gdrive-sa.json
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive-sa.json
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Baixar banco de dados do Google Drive
        run: |
          mkdir -p analises
          rclone copy gdrive:pedidos_historico_ceven.db analises/ || echo "Banco não encontrado no Drive ainda, vai ser criado do zero."

      - name: Rodar orquestrador diário
        id: orquestrador
        run: node pipeline/orquestrador_diario.js

      - name: Subir banco de dados atualizado pro Google Drive
        id: upload
        if: success()
        run: |
          rclone copy analises/pedidos_historico_ceven.db gdrive:/
          rclone copy analises/hierarquia_completa_ceven.json gdrive:/

      - name: Resumo
        if: always()
        env:
          ORQUESTRADOR: ${{ steps.orquestrador.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          echo "Orquestrador: $ORQUESTRADOR"
          echo "Upload do banco: $UPLOAD"
