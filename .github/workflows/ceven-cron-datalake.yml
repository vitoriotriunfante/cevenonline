# FICHA DO ARQUIVO
# O QUE É: "atualiza TUDO" — roda pipeline/orquestrador_diario.js (9 extratores),
#     popula analises/pedidos_historico_ceven.db inteiro.
# RODA: todo dia às 03:00 BRT (cron abaixo) ou manual via workflow_dispatch.
# LÊ do Google Drive: pedidos_historico_ceven.db (se existir; senão cria do zero).
# ESCREVE no Google Drive: pedidos_historico_ceven.db atualizado (upload sempre no
#     final, mesmo se algum dos 9 passos falhar — "if: always()").
# USADO POR: ceven-cron-marca-propria.yml (10:00) depende do banco já atualizado aqui.
# DEPENDE DE: secrets GDRIVE_SA_JSON e GDRIVE_FOLDER_ID.
# ÚLTIMA REVISÃO: 23/09/2026 (Node 24 + npm ci; corrigido YAML invalido "gdrive:" solto
#     no fim de linha, que quebrava o parse do arquivo inteiro desde a criação).
name: CEVEN Data Lake — Atualização Diária (Pedidos, Devoluções, PDVs, Live)

on:
  schedule:
    # 03:00 BRT = 06:00 UTC, todos os dias
    - cron: '0 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: ceven-datalake-update
  cancel-in-progress: false

jobs:
  atualizar_datalake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências Node (npm ci, mesma versão travada localmente)
        run: npm ci

      - name: Instalar dependências Python
        run: pip install requests openpyxl

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (Google Drive)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GDRIVE_SA_JSON" > /tmp/gdrive-sa.json
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive-sa.json
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF

      - name: Baixar banco de dados do Google Drive
        run: |
          mkdir -p analises
          rclone copy gdrive:pedidos_historico_ceven.db analises/ || echo "Banco não encontrado no Drive ainda, vai ser criado do zero."

      - name: Rodar orquestrador diário
        run: node pipeline/orquestrador_diario.js
        continue-on-error: true

      - name: Subir banco de dados atualizado pro Google Drive
        if: always()
        run: rclone copy analises/pedidos_historico_ceven.db gdrive:/

      - name: Gerar dataset do Brasileirão Triunfante (public/dados_brasileirao.json)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scratch/build_brasileirao_dataset.py
        continue-on-error: true

      - name: Commitar dataset do Brasileirão atualizado
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/dados_brasileirao.json
          git diff --cached --quiet && echo "Sem mudança no dataset do Brasileirão." || (
            git commit -m "chore: atualiza dataset do Brasileirao Triunfante [skip ci]"
            git push || (
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }}
              git push
            )
          )

      - name: Resumo
        if: always()
        run: echo "Atualização do data lake concluída (ver logs acima pra detalhes por etapa)."
