name = "ceven-cron-sync"
main = "src/index.js"
compatibility_date = "2024-08-01"

# Repropositado em 23/09/2026: este worker NÃO manda mais WhatsApp (ver FICHA em
# src/index.js). Agora é só um gatilho externo confiável pro GitHub Actions, porque
# o agendador nativo (`schedule` no .yml) está falhando repetidamente. D1 removido,
# não é mais usado por este worker.
#
# Conta Cloudflare free = limite de 5 cron triggers NA CONTA INTEIRA (não só
# deste worker) — o worker "comandda" já usa 2, sobram só 3 pra este. Ficam os
# 3 mais críticos: fundação da madrugada, primeiro relatório e fechamento do
# dia. Os demais (10:00, 11:30, 14:30, 17:00) ficam só no `schedule` nativo do
# próprio .yml no GitHub Actions.

[triggers]
crons = [
  "0 6 * * 1-5",    # 03:00 BRT -> ceven-cron-datalake.yml
  "45 10 * * 1-5",  # 07:45 BRT -> ceven-cron-whatsapp.yml (07:45)
  "30 21 * * 1-5"   # 18:30 BRT -> ceven-cron-whatsapp.yml (18:30)
]
