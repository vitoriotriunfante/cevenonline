name = "ceven-cron-sync"
main = "src/index.js"
compatibility_date = "2024-08-01"

[[d1_databases]]
binding = "DB"
database_name = "ceven_noc_d1"
database_id = "2e5bb59c-8db4-43a2-a13c-5c78e404e52d"

[triggers]
crons = [
  "0 10 * * 1-5",    # 07:00 BRT (Abertura)
  "0 14 * * 1-5",    # 11:00 BRT (Relatório Oficial 1)
  "30 17 * * 1-5",   # 14:30 BRT (Relatório Oficial 2)
  "0 20 * * 1-5",    # 17:00 BRT (Relatório Oficial 3)
  "30 21 * * 1-5"    # 18:30 BRT (Fechamento Oficial)
]
