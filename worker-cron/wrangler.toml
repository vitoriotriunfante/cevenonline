name = "ceven-cron-sync"
main = "src/index.js"
compatibility_date = "2024-08-01"

# Repropositado em 23/09/2026: este worker NÃO manda mais WhatsApp (ver FICHA em
# src/index.js). Agora é só um gatilho externo confiável pro GitHub Actions, porque
# o agendador nativo (`schedule` no .yml) está falhando repetidamente. D1 removido,
# não é mais usado por este worker.
#
# Conta Cloudflare free = limite de 5 cron triggers NA CONTA INTEIRA.
# Em 24/09/2026: crons do "comandda" removidos (2 slots liberados).
# Agora todos os 5 slots desta conta estão alocados para ceven-cron-sync.
# 10:00 e 14:30 BRT adicionados via API (marcas proprias + tarde) -> destino "todos".

[triggers]
crons = [
  "0 6 * * 1-5",    # 03:00 BRT -> ceven-cron-datalake.yml (sync dados)
  "45 10 * * 1-5",  # 07:45 BRT -> ceven-cron-whatsapp.yml (abertura) -> todos
  "0 13 * * 1-5",   # 10:00 BRT -> ceven-cron-whatsapp.yml (marcas proprias) -> todos (NOVO 24/09/2026)
  "30 17 * * 1-5",  # 14:30 BRT -> ceven-cron-whatsapp.yml (tarde) -> todos (NOVO 24/09/2026)
  "30 21 * * 1-5"   # 18:30 BRT -> ceven-cron-whatsapp.yml (fechamento) -> todos
]
