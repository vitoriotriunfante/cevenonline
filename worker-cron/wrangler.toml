name = "ceven-cron-sync"
main = "src/index.js"
compatibility_date = "2024-08-01"

# Repropositado em 23/09/2026: este worker NÃO manda mais WhatsApp (ver FICHA em
# src/index.js). Agora é só um gatilho externo confiável pro GitHub Actions, porque
# o agendador nativo (`schedule` no .yml) está falhando repetidamente. D1 removido,
# não é mais usado por este worker.
#
# Conta Cloudflare free = limite de 5 cron triggers NA CONTA INTEIRA.
# Em 24/09/2026: crons do "comandda" removidos (2 slots liberados).
# Agora todos os 5 slots desta conta estão alocados para ceven-cron-sync.
# 10:00 e 14:30 BRT adicionados via API (marcas proprias + tarde) -> destino "todos".

# Grade Oficial Completa (Cloudflare Pago — Maestro Unico):
# 03:00 BRT (06:00 UTC) -> Data Lake (Atualiza TUDO)
# 04:00 BRT (07:00 UTC) -> Aquecimento Matinal (dry_run, gera cache)
# 07:45 BRT (10:45 UTC) -> Abertura Oficial WhatsApp
# 10:00 BRT (13:00 UTC) -> Marcas Proprias WhatsApp
# 11:30 BRT (14:30 UTC) -> Gestao de Campo WhatsApp
# 14:30 BRT (17:30 UTC) -> Parcial da Tarde WhatsApp
# 17:00 BRT (20:00 UTC) -> Reta Final WhatsApp
# 18:30 BRT (21:30 UTC) -> Fechamento Oficial WhatsApp

[triggers]
crons = [
  "0 6 * * *",     # 03:00 BRT -> ceven-cron-datalake.yml (Atualiza TUDO no Drive)
  "0 7 * * 1-5",   # 04:00 BRT -> ceven-cron-whatsapp.yml (Aquecimento matinal / dry_run)
  "45 10 * * 1-5", # 07:45 BRT -> ceven-cron-whatsapp.yml (Abertura oficial)
  "0 13 * * 1-5",  # 10:00 BRT -> ceven-cron-marca-propria.yml (Marcas proprias)
  "30 14 * * 1-5", # 11:30 BRT -> ceven-cron-whatsapp.yml (Gestao de campo)
  "30 17 * * 1-5", # 14:30 BRT -> ceven-cron-whatsapp.yml (Parcial da tarde)
  "0 20 * * 1-5",  # 17:00 BRT -> ceven-cron-whatsapp.yml (Reta final)
  "30 21 * * 1-5"  # 18:30 BRT -> ceven-cron-whatsapp.yml (Fechamento oficial)
]

