# Servidor de WhatsApp (Evolution API v2.3.7) + Postgres + Redis + Caddy (HTTPS automatico).
# Feito para rodar numa maquina Ubuntu gratuita da Oracle Cloud ("Always Free"), instalado por instalar.sh.
# Nao contem segredos: a senha do banco e a chave da API sao geradas na propria maquina e ficam em .env.
# A imagem fica FIXA na versao estavel v2.3.7 (a tag "latest" aponta para versao em teste). Tem versao para ARM.

services:
  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - evolution_instances:/evolution/instances

  caddy:
    image: caddy:2-alpine
    container_name: evolution_caddy
    restart: always
    depends_on:
      - evolution-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  caddy_data:
  caddy_config:
