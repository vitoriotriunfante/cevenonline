<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divergências de cadastro · CEVEN</title>
<style>
  :root { --bg:#0e1424; --card:#151d33; --linha:#243049; --tx:#e8edf7; --mut:#8b97b3; --ok:#34d399; --aviso:#fbbf24; --ruim:#f87171; --acc:#60a5fa; }
  @media (prefers-color-scheme: light) { :root { --bg:#f3f5fa; --card:#fff; --linha:#dde3ef; --tx:#16203a; --mut:#5d6985; --ok:#0f9f6e; --aviso:#b7791f; --ruim:#d64545; --acc:#2563eb; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 system-ui, "Segoe UI", sans-serif; padding:20px 16px 60px; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--mut); margin-bottom:18px; max-width:880px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px; }
  .chip { background:var(--card); border:1px solid var(--linha); border-radius:10px; padding:10px 14px; min-width:150px; }
  .chip b { display:block; font-size:22px; }
  .chip span { color:var(--mut); font-size:12px; }
  section { background:var(--card); border:1px solid var(--linha); border-radius:12px; margin-bottom:22px; overflow:hidden; }
  section > header { padding:14px 16px; border-bottom:1px solid var(--linha); }
  section h2 { margin:0; font-size:16px; }
  section p { margin:4px 0 0; color:var(--mut); font-size:13px; }
  .tabela { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:0; }
  th, td { text-align:left; padding:clamp(5px,.6vw,8px) clamp(5px,.7vw,12px); font-size:clamp(11px,.95vw,14px); border-bottom:1px solid var(--linha); }
  td.n, th.n { white-space:nowrap; }
  th { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; font-weight:700; }
  .tag.mov { background:color-mix(in srgb, var(--ruim) 22%, transparent); color:var(--ruim); }
  .tag.nova { background:color-mix(in srgb, var(--aviso) 24%, transparent); color:var(--aviso); }
  .tag.ok { background:color-mix(in srgb, var(--ok) 20%, transparent); color:var(--ok); }
  .vazio { padding:18px 16px; color:var(--mut); }
  .rodape { color:var(--mut); font-size:12px; margin-top:6px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:600; }
</style>
</head>
<body>
<h1>Divergências de cadastro</h1>
<div class="sub">Lista viva: tudo que o CEVEN e o banco têm e a <b>Gestão de Equipe</b> não tem, e o contrário. A decisão de cada linha é feita na própria <a href="/gestao-equipe" style="color:var(--acc)">Gestão de Equipe</a> (modo Diretoria, painel "Divergências com o CEVEN"); a lista aqui se atualiza sozinha.</div>
<div class="chips" id="chips"></div>
<div id="corpo">Carregando…</div>
<div class="rodape" id="rodape"></div>
<p><button id="btn">Atualizar agora</button></p>
<script>
const $ = (id) => document.getElementById(id);
const brl = (x) => 'R$ ' + (Number(x) || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const nv = (x) => (Number(x) || 0).toLocaleString('pt-BR');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tabela(cols, linhas, vazio) {
  if (!linhas.length) return `<div class="vazio">${vazio}</div>`;
  return `<div class="tabela"><table><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.t}</th>`).join('')}</tr></thead><tbody>` +
    linhas.map(l => `<tr>${cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f(l)}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
}
function secao(titulo, explica, html) { return `<section><header><h2>${titulo}</h2><p>${explica}</p></header>${html}</section>`; }
async function carrega() {
  let d;
  try { d = await (await fetch('/api/divergencias', {cache: 'no-store'})).json(); } catch { $('corpo').textContent = 'Não consegui ler os dados agora.'; return; }
  if (d.erro) { $('corpo').textContent = 'Erro: ' + d.erro; return; }
  const r = d.resumo;
  const ar = d.arvore || {}; // antes dos quadradinhos: eles tambem usam
  $('chips').innerHTML = [
    ['NÃO MOSTRA na Gestão', ((d.decisao || {}).nao_mostra || []).length, 'confirme se continua assim'],
    ['CEVEN que a Gestão nunca viu', ((d.decisao || {}).fora_da_gestao || []).length, 'decida mostra / não mostra'],
    ['No banco e fora da Gestão de Equipe', r.banco_fora_da_planilha, `${r.banco_fora_produzindo} produzindo · ${r.banco_fora_sem_atividade} sem atividade`],
    ['Faturado no mês fora da Gestão de Equipe', brl(r.faturado_mes_fora_da_planilha), 'soma dos vendedores do item 1'],
    ['Vendedores novos da árvore do CEVEN', (ar.novos || []).length, 'já entraram nas telas'],
    ['Supervisor trocado pelo CEVEN', (ar.supervisor_mudou || []).length, 'vale o do CEVEN'],
    ['Só na Gestão (fora da árvore)', (ar.so_gestao || []).length, 'conferir se ainda existem'],
    ['Na Gestão de Equipe e fora do banco', r.planilha_fora_do_banco, 'precisam ser cadastrados'],
    ['Códigos descobertos (devolução)', r.codigos_descobertos, `${r.codigos_descobertos_novos} novos nos últimos 3 dias`],
    ['Devolução nesses códigos (mês)', brl(r.devolucao_descoberta_mes), 'fora de qualquer lista']
  ].map(([t, v, s]) => `<div class="chip"><span>${t}</span><b>${v}</b><span>${s}</span></div>`).join('');
  // --- ÁRVORE VIVA DO CEVEN x GESTÃO ---
  const aviso = ar.disponivel ? '' : '<div class="vazio">A árvore do CEVEN ainda não foi baixada hoje. Ela se atualiza sozinha a cada 45 minutos.</div>';
  const A0 = tabela([
    {t: 'Filial', f: l => esc(l.filial)}, {t: 'Código', f: l => esc(l.codigo)}, {t: 'Nome', f: l => esc(l.nome)},
    {t: 'Supervisor (CEVEN)', f: l => esc(l.supervisor)}, {t: 'Canal', f: l => esc(l.canal || '—')},
    {t: 'Gerente', f: l => esc(l.gerente || '—') + (l.grupo ? ' / ' + esc(l.grupo) : '')},
    {t: 'Na tela', f: l => '<span class="tag ok">MOSTRA</span>'}
  ], ar.novos || [], 'Nenhum vendedor novo: todo vendedor da árvore do CEVEN já está na Gestão de Equipe.');
  const A1 = tabela([
    {t: 'Filial', f: l => esc(l.filial)}, {t: 'Código', f: l => esc(l.codigo)}, {t: 'Nome', f: l => esc(l.nome)},
    {t: 'Supervisor na Gestão (antigo)', f: l => esc(l.supervisor_gestao || '—')}, {t: 'Supervisor no CEVEN (vale)', f: l => '<b>' + esc(l.supervisor_ceven || '—') + '</b>'},
    {t: 'Mostra', f: l => l.mostra ? 'SIM' : 'NÃO'}
  ], ar.supervisor_mudou || [], 'Nenhuma troca: o supervisor da Gestão de Equipe é o mesmo do CEVEN em todos os vendedores.');
  const A2 = tabela([
    {t: 'Filial', f: l => esc(l.filial)}, {t: 'Código', f: l => esc(l.codigo)}, {t: 'Nome', f: l => esc(l.nome)}, {t: 'Canal', f: l => esc(l.canal || '—')},
    {t: 'Supervisor (Gestão)', f: l => esc(l.supervisor || '—')}, {t: 'Mostra', f: l => l.mostra ? 'SIM' : 'NÃO'}, {t: 'Motivo', f: l => esc(l.motivo || '')}
  ], ar.so_gestao || [], 'Nenhum: todo vendedor da Gestão de Equipe está na árvore do CEVEN.');
  const pct = (x, m) => m > 0 ? ' (' + Math.round(x / m * 100) + '%)' : '';
  const metaCols = [
    {t: 'Meta faturamento', n: 1, f: l => l.meta_fat ? brl(l.meta_fat) : '—'}, {t: 'Faturado no mês', n: 1, f: l => brl(l.fat_mes) + pct(l.fat_mes, l.meta_fat)},
    {t: 'Meta positiv.', n: 1, f: l => l.meta_pos ? nv(l.meta_pos) : '—'}, {t: 'Positivados no mês', n: 1, f: l => nv(l.pos_mes) + pct(l.pos_mes, l.meta_pos)},
    {t: 'Visitas / rota hoje', n: 1, f: l => nv(l.visitas_hoje) + ' / ' + nv(l.rota_hoje)}, {t: 'Pedidos hoje', n: 1, f: l => nv(l.pedidos_hoje)}, {t: 'Digitado hoje', n: 1, f: l => brl(l.digitado_hoje)},
    {t: 'Devolução (mês)', n: 1, f: l => brl(l.devolucao_mes) + (l.notas_devolucao_mes ? ' · ' + l.notas_devolucao_mes + ' nota(s)' : '')}
  ];
  const leituraCol = {t: 'O que os números dizem', f: l => { const t = l.leitura || {}; const cls = t.tipo === 'produzindo' ? 'mov' : t.tipo === 'sem_atividade' ? 'ok' : 'nova'; return `<span class="tag ${cls}">${esc(t.texto || '')}</span>` + ((t.sinais || []).length ? '<br><small style="color:var(--aviso)">⚠ ' + esc(t.sinais.join(' · ')) + '</small>' : ''); }};
  const A = tabela([
    {t: 'Filial', f: l => esc(l.filial)}, {t: 'Código', f: l => esc(l.codigo)}, {t: 'Nome', f: l => esc(l.nome)}, {t: 'Sem abrir o app', n: 1, f: l => l.dias_sem_acesso == null ? '—' : l.dias_sem_acesso + ' d'},
    ...metaCols, leituraCol
  ], d.banco_fora_da_planilha, 'Nenhuma divergência: todo vendedor ativo do banco está na Gestão de Equipe.');
  const B = tabela([
    {t: 'Filial', f: l => esc(l.filial)}, {t: 'Código', f: l => esc(l.codigo)}, {t: 'Nome', f: l => esc(l.nome)}, {t: 'Canal', f: l => esc(l.canal)},
    {t: 'Supervisor', f: l => esc(l.supervisor)}, {t: 'Mostra', f: l => l.mostra ? 'SIM' : 'NÃO'},
    ...metaCols, leituraCol
  ], d.planilha_fora_do_banco, 'Nenhuma divergência: todo vendedor da Gestão de Equipe está no banco.');
  const C = tabela([
    {t: 'Filial', f: l => esc(l.filial)}, {t: 'Código', f: l => esc(l.codigo)}, {t: 'Nome no CEVEN', f: l => esc(l.nome || '(sem nome)')},
    {t: 'Meta faturamento', n: 1, f: l => l.meta_fat ? brl(l.meta_fat) : '—'}, {t: 'Faturado no mês', n: 1, f: l => brl(l.fat_mes)},
    {t: 'Rota hoje', n: 1, f: l => nv(l.rota_hoje)}, {t: 'Pedidos hoje', n: 1, f: l => nv(l.pedidos_hoje)},
    {t: 'Devolução (mês)', n: 1, f: l => brl(l.devolucao_mes) + ' · ' + nv(l.notas_mes) + ' nota(s)'},
    {t: 'O que é', f: l => { const t = l.leitura || {}; const cls = (t.tipo === 'conta_interna' || t.tipo === 'vaga' || t.tipo === 'so_devolucao') ? 'ok' : 'nova'; return `<span class="tag ${cls}">${esc(t.texto || '')}</span>` + (l.nova ? ' <span class="tag nova">NOVO</span>' : ''); }}
  ], d.descobertos, 'A varredura de descoberta ainda não achou nenhum código com devolução fora das listas.');
  const dc = d.decisao || {nao_mostra: [], fora_da_gestao: []};
  const tg = (l) => { const t = {...(l.leitura || {})}; t.texto = String(t.texto || '').replace('Vendedor ativo e produzindo: provavelmente deve entrar na planilha.', 'Tem venda no mês e rota hoje: vale conferir se deveria aparecer.'); const cls = t.tipo === 'produzindo' ? 'mov' : (t.tipo === 'sem_atividade' ? 'ok' : 'nova'); return `<span class="tag ${cls}">${esc(t.texto || '')}</span>`; };
  const colsDec = [
    {t: 'Filial', f: l => '<b>' + esc(l.filial) + '</b>'}, {t: 'Vendedor', f: l => esc(l.nome) + ' <span style="color:var(--mut)">(' + esc(l.codigo) + ')</span>'}, {t: 'Supervisor', f: l => esc(l.supervisor || '—')}, {t: 'Canal', f: l => esc(l.canal || '—')},
    {t: 'Meta do mês', n: 1, f: l => l.meta_fat ? brl(l.meta_fat) : '<span style="color:var(--mut)">sem meta</span>'}, {t: 'Faturado + pendente (como no CEVEN)', n: 1, f: l => brl(l.fat_mes) + ' + ' + brl(l.pendente) + ' pend.' + pct(l.fat_mes + (l.pendente || 0), l.meta_fat)}, {t: 'Positivados / meta', n: 1, f: l => nv(l.pos_mes) + ' / ' + (l.meta_pos ? nv(l.meta_pos) : '—')},
    {t: 'Rota hoje', n: 1, f: l => nv(l.rota_hoje)}, {t: 'Pedidos hoje', n: 1, f: l => nv(l.pedidos_hoje)}, {t: 'O que os números dizem', f: tg}
  ];
  const D1 = tabela([...colsDec, {t: 'Motivo na Gestão', f: l => esc(l.motivo || '—')}, {t: 'No CEVEN hoje?', f: l => l.no_ceven ? 'sim' : '<b style="color:var(--aviso)">não</b>'}], dc.nao_mostra, 'Ninguém está como NÃO MOSTRA na Gestão de Equipe.');
  const D2 = tabela([...colsDec, {t: 'Hoje nas telas', f: l => '<span class="tag ok">MOSTRA</span>'}], dc.fora_da_gestao, 'Nenhum: todo vendedor do CEVEN já está na Gestão de Equipe.');
  const dMeta = (L) => L.filter(x => x.meta_fat > 0).length, dVende = (L) => L.filter(x => x.fat_mes > 0 || x.pedidos_hoje > 0).length;
  const decisaoHtml =
    secao('A. Estão como NÃO MOSTRA na Gestão de Equipe — continua assim?', `${dc.nao_mostra.length} vendedores · ${dMeta(dc.nao_mostra)} com meta · ${dVende(dc.nao_mostra)} vendendo. Os que têm meta ou venda aparecem primeiro: são os que merecem sua atenção. Para mudar, use a Gestão de Equipe (MOSTRA = SIM).`, D1) +
    secao('B. Estão no CEVEN agora e a Gestão de Equipe nunca viu — decida', `${dc.fora_da_gestao.length} vendedores · ${dMeta(dc.fora_da_gestao)} com meta · ${dVende(dc.fora_da_gestao)} vendendo. Enquanto você não decide, eles APARECEM nas telas (MOSTRA). Para tirar algum, marque NÃO MOSTRA na Gestão de Equipe.`, D2);
  const tecnico = '<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--mut);padding:8px 0">Outras conferências (técnicas): supervisor trocado, só na Gestão, banco, descobertos</summary>';
  $('corpo').innerHTML = aviso + decisaoHtml + tecnico +
    secao('0. Árvore do CEVEN: vendedores NOVOS (já entraram nas telas)', 'Estão na árvore viva do CEVEN e ainda não estavam na Gestão de Equipe: entram sozinhos, com MOSTRA = SIM e o supervisor do CEVEN. Se algum não deve aparecer, é só ocultar na Gestão de Equipe.', A0) +
    secao('0.1 Árvore do CEVEN: supervisor trocado (vale o do CEVEN)', 'O CEVEN reorganiza a árvore todo dia. Aqui estão os vendedores cujo supervisor na Gestão de Equipe estava diferente do CEVEN: todas as telas, os lances e o WhatsApp já usam o do CEVEN.', A1) +
    secao('0.2 Só na Gestão de Equipe (fora da árvore do CEVEN)', 'Vendedores que a Gestão tem e a árvore do CEVEN não traz (a cascata do CEVEN não é completa: nenhum foi removido). Confira se ainda existem; os que não existem mais podem ser ocultados.', A2) +
    secao('1. No banco e fora da Gestão de Equipe', 'Vendedor ativo no cadastro do banco que a Gestão de Equipe não lista. Com movimento: vende, tem rota ou tem devolução. Decida na Gestão de Equipe se entra como MOSTRA = SIM ou NÃO.', A) +
    secao('2. Só informativo: na Gestão de Equipe e ainda sem cadastro no banco', 'Estes vendedores JÁ estão certos na Gestão de Equipe (com supervisor e gerente) e já aparecem em tudo: TV, Matriz, WhatsApp e Executiva. O banco de cadastros ainda não os recebeu porque o cadastro é sincronizado do CEVEN de madrugada. Você não precisa fazer nada aqui.', B) +
    secao('3. Códigos que o CEVEN tem e que não estão em lugar nenhum nosso', 'Não são vendedores da Gestão de Equipe nem do banco, mas têm devolução neste mês. Costumam ser: conta interna da empresa ("venda empresa", código 2 de cada filial), vaga em aberto, ou ex-vendedor que ainda tem nota. Só vale olhar o que tiver meta e rota: aí pode ser um vendedor que faltou cadastrar (use o painel da Gestão de Equipe).', C);
  $('corpo').innerHTML += '</details>';
  const v = d.varredura_descoberta || {};
  $('rodape').textContent = `Árvore do CEVEN atualizada em ${ar.atualizado_em ? new Date(ar.atualizado_em).toLocaleString('pt-BR') : '—'} · Gerado em ${new Date(d.gerado_em).toLocaleString('pt-BR')} · varredura de descoberta: ciclo ${v.ciclo ?? 0}, posição ${v.pos ?? 0}${v.ciclo_fim ? ', último ciclo fechado em ' + v.ciclo_fim : ''}`;
}
$('btn').onclick = carrega; carrega(); setInterval(carrega, 120000);
</script>
</body>
</html>
