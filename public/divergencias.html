<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divergências de cadastro · CEVEN</title>
<style>
  :root { --bg:#0e1424; --card:#151d33; --linha:#243049; --tx:#e8edf7; --mut:#8b97b3; --ok:#34d399; --aviso:#fbbf24; --ruim:#f87171; --acc:#60a5fa; }
  @media (prefers-color-scheme: light) { :root { --bg:#f3f5fa; --card:#fff; --linha:#dde3ef; --tx:#16203a; --mut:#5d6985; --ok:#0f9f6e; --aviso:#b7791f; --ruim:#d64545; --acc:#2563eb; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 system-ui, "Segoe UI", sans-serif; padding:20px 16px 60px; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--mut); margin-bottom:18px; max-width:880px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px; }
  .chip { background:var(--card); border:1px solid var(--linha); border-radius:10px; padding:10px 14px; min-width:150px; }
  .chip b { display:block; font-size:22px; }
  .chip span { color:var(--mut); font-size:12px; }
  section { background:var(--card); border:1px solid var(--linha); border-radius:12px; margin-bottom:22px; overflow:hidden; }
  section > header { padding:14px 16px; border-bottom:1px solid var(--linha); }
  section h2 { margin:0; font-size:16px; }
  section p { margin:4px 0 0; color:var(--mut); font-size:13px; }
  .tabela { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:720px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--linha); white-space:nowrap; }
  th { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; font-weight:700; }
  .tag.mov { background:color-mix(in srgb, var(--ruim) 22%, transparent); color:var(--ruim); }
  .tag.nova { background:color-mix(in srgb, var(--aviso) 24%, transparent); color:var(--aviso); }
  .tag.ok { background:color-mix(in srgb, var(--ok) 20%, transparent); color:var(--ok); }
  .vazio { padding:18px 16px; color:var(--mut); }
  .rodape { color:var(--mut); font-size:12px; margin-top:6px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:600; }
</style>
</head>
<body>
<h1>Divergências de cadastro</h1>
<div class="sub">Lista viva: tudo que o CEVEN e o banco têm e a <b>Gestão de Equipe</b> não tem, e o contrário. A decisão de cada linha é feita na própria <a href="/gestao-equipe" style="color:var(--acc)">Gestão de Equipe</a> (modo Diretoria, painel "Divergências com o CEVEN"); a lista aqui se atualiza sozinha.</div>
<div class="chips" id="chips"></div>
<div id="corpo">Carregando…</div>
<div class="rodape" id="rodape"></div>
<p><button id="btn">Atualizar agora</button></p>
<script>
const $ = (id) => document.getElementById(id);
const brl = (x) => 'R$ ' + (Number(x) || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const nv = (x) => (Number(x) || 0).toLocaleString('pt-BR');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tabela(cols, linhas, vazio) {
  if (!linhas.length) return `<div class="vazio">${vazio}</div>`;
  return `<div class="tabela"><table><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.t}</th>`).join('')}</tr></thead><tbody>` +
    linhas.map(l => `<tr>${cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f(l)}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
}
function secao(titulo, explica, html) { return `<section><header><h2>${titulo}</h2><p>${explica}</p></header>${html}</section>`; }
async function carrega() {
  let d;
  try { d = await (await fetch('/api/divergencias', {cache: 'no-store'})).json(); } catch { $('corpo').textContent = 'Não consegui ler os dados agora.'; return; }
  if (d.erro) { $('corpo').textContent = 'Erro: ' + d.erro; return; }
  const r = d.resumo;
  $('chips').innerHTML = [
    ['No banco e fora da Gestão de Equipe', r.banco_fora_da_planilha, `${r.banco_fora_produzindo} produzindo · ${r.banco_fora_sem_atividade} sem atividade`],
    ['Faturado no mês fora da Gestão de Equipe', brl(r.faturado_mes_fora_da_planilha), 'soma dos vendedores do item 1'],
    ['Na Gestão de Equipe e fora do banco', r.planilha_fora_do_banco, 'precisam ser cadastrados'],
    ['Códigos descobertos (devolução)', r.codigos_descobertos, `${r.codigos_descobertos_novos} novos nos últimos 3 dias`],
    ['Devolução nesses códigos (mês)', brl(r.devolucao_descoberta_mes), 'fora de qualquer lista']
  ].map(([t, v, s]) => `<div class="chip"><span>${t}</span><b>${v}</b><span>${s}</span></div>`).join('');
  const pct = (x, m) => m > 0 ? ' (' + Math.round(x / m * 100) + '%)' : '';
  const metaCols = [
    {t: 'Meta faturamento', n: 1, f: l => l.meta_fat ? brl(l.meta_fat) : '—'}, {t: 'Faturado no mês', n: 1, f: l => brl(l.fat_mes) + pct(l.fat_mes, l.meta_fat)},
    {t: 'Meta positiv.', n: 1, f: l => l.meta_pos ? nv(l.meta_pos) : '—'}, {t: 'Positivados no mês', n: 1, f: l => nv(l.pos_mes) + pct(l.pos_mes, l.meta_pos)},
    {t: 'Visitas / rota hoje', n: 1, f: l => nv(l.visitas_hoje) + ' / ' + nv(l.rota_hoje)}, {t: 'Pedidos hoje', n: 1, f: l => nv(l.pedidos_hoje)}, {t: 'Digitado hoje', n: 1, f: l => brl(l.digitado_hoje)},
    {t: 'Devolução (mês)', n: 1, f: l => brl(l.devolucao_mes) + (l.notas_devolucao_mes ? ' · ' + l.notas_devolucao_mes + ' nota(s)' : '')}
  ];
  const leituraCol = {t: 'O que os números dizem', f: l => { const t = l.leitura || {}; const cls = t.tipo === 'produzindo' ? 'mov' : t.tipo === 'sem_atividade' ? 'ok' : 'nova'; return `<span class="tag ${cls}">${esc(t.texto || '')}</span>` + ((t.sinais || []).length ? '<br><small style="color:var(--aviso)">⚠ ' + esc(t.sinais.join(' · ')) + '</small>' : ''); }};
  const A = tabela([
    {t: 'Filial', f: l => esc(l.filial)}, {t: 'Código', f: l => esc(l.codigo)}, {t: 'Nome', f: l => esc(l.nome)}, {t: 'Sem abrir o app', n: 1, f: l => l.dias_sem_acesso == null ? '—' : l.dias_sem_acesso + ' d'},
    ...metaCols, leituraCol
  ], d.banco_fora_da_planilha, 'Nenhuma divergência: todo vendedor ativo do banco está na Gestão de Equipe.');
  const B = tabela([
    {t: 'Filial', f: l => esc(l.filial)}, {t: 'Código', f: l => esc(l.codigo)}, {t: 'Nome', f: l => esc(l.nome)}, {t: 'Canal', f: l => esc(l.canal)},
    {t: 'Supervisor', f: l => esc(l.supervisor)}, {t: 'Mostra', f: l => l.mostra ? 'SIM' : 'NÃO'},
    ...metaCols, leituraCol
  ], d.planilha_fora_do_banco, 'Nenhuma divergência: todo vendedor da Gestão de Equipe está no banco.');
  const C = tabela([
    {t: 'Filial', f: l => esc(l.filial)}, {t: 'Código', f: l => esc(l.codigo)},
    {t: 'Notas (mês)', n: 1, f: l => nv(l.notas_mes)}, {t: 'Devolução (mês)', n: 1, f: l => brl(l.devolucao_mes)},
    {t: 'Rota hoje', n: 1, f: l => nv(l.rota_hoje)}, {t: 'Pedidos hoje', n: 1, f: l => nv(l.pedidos_hoje)}, {t: 'Primeira vez', f: l => esc((l.primeira_vez || '').slice(0, 16))},
    {t: '', f: l => l.nova ? '<span class="tag nova">NOVO</span>' : ''}
  ], d.descobertos, 'A varredura de descoberta ainda não achou nenhum código com devolução fora das listas.');
  $('corpo').innerHTML =
    secao('1. No banco e fora da Gestão de Equipe', 'Vendedor ativo no cadastro do banco que a Gestão de Equipe não lista. Com movimento: vende, tem rota ou tem devolução. Decida na Gestão de Equipe se entra como MOSTRA = SIM ou NÃO.', A) +
    secao('2. Na Gestão de Equipe e fora do banco', 'Vendedor que a Gestão de Equipe lista e o banco não tem. Ele já entra na varredura pela Gestão de Equipe; o cadastro no banco precisa ser feito.', B) +
    secao('3. Códigos descobertos pelo CEVEN', 'Códigos que não estão em lista nenhuma e têm devolução neste mês (contas internas como "VENDA EMPRESA", ex-vendedores). A busca percorre todos os códigos de todas as filiais de madrugada.', C);
  const v = d.varredura_descoberta || {};
  $('rodape').textContent = `Gerado em ${new Date(d.gerado_em).toLocaleString('pt-BR')} · varredura de descoberta: ciclo ${v.ciclo ?? 0}, posição ${v.pos ?? 0}${v.ciclo_fim ? ', último ciclo fechado em ' + v.ciclo_fim : ''}`;
}
$('btn').onclick = carrega; carrega(); setInterval(carrega, 120000);
</script>
</body>
</html>
