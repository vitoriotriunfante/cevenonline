<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saúde das fontes</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --txt: #16202c; --sub: #5b6675; --ok: #1a7f4b; --bad: #c2362b; --off: #8a94a3; --line: #e3e7ec; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f141a; --card: #18202a; --txt: #e8edf3; --sub: #9aa6b4; --ok: #3cc47c; --bad: #ff6b5e; --off: #6b7684; --line: #26303c; } }
  :root[data-theme="dark"] { --bg: #0f141a; --card: #18202a; --txt: #e8edf3; --sub: #9aa6b4; --ok: #3cc47c; --bad: #ff6b5e; --off: #6b7684; --line: #26303c; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--sub); font-size: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .nome { font-weight: 600; }
  .det { color: var(--sub); font-size: 14px; }
  .dir { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
  .ok .dot { background: var(--ok); } .bad .dot { background: var(--bad); } .off .dot { background: var(--off); }
  .bad .dir { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Saúde das fontes</h1>
  <div class="sub" id="sub">Carregando…</div>
  <div id="lista"></div>
  <div class="sub">Verde: dentro do limite. Vermelho: parada (o Vitório recebe aviso no WhatsApp). Cinza: fora do horário em que essa fonte é cobrada. Atualiza sozinho a cada minuto.</div>
</main>
<script>
async function carrega() {
  try {
    const r = await fetch('/api/vigia-fontes?saude=1', { cache: 'no-store' });
    const j = await r.json();
    document.getElementById('sub').textContent = `${j.dia.split('-').reverse().join('/')} · conferido às ${j.hora}`;
    document.getElementById('lista').innerHTML = (j.quadro || []).map((f) => {
      const cls = f.parada ? 'bad' : f.vale_agora ? 'ok' : 'off';
      const ult = f.minutos == null ? 'sem leitura hoje' : f.minutos < 60 ? `há ${f.minutos} min` : `há ${Math.floor(f.minutos / 60)}h${String(f.minutos % 60).padStart(2, '0')}`;
      return `<div class="card ${cls}"><span class="dot"></span><div><div class="nome">${f.fonte}</div><div class="det">limite ${f.limite} min</div></div><div class="dir">${ult}</div></div>`;
    }).join('');
  } catch (e) { document.getElementById('sub').textContent = 'Não consegui ler agora; tento de novo em 1 minuto.'; }
}
carrega(); setInterval(carrega, 60000);
</script>
</body>
</html>
