<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEVEN — Sala de Controle v2 (GEROT + Clube)</title>
<style>
  :root{--bg:#050b16;--panel:#0b1626;--panel2:#0f1d33;--line:#1c2d49;--tx:#dbe7f7;--mut:#7f93b2;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--ac:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#0b2142 0%,var(--bg) 60%);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif;min-height:100vh}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,11,22,.92);backdrop-filter:blur(6px);z-index:5;flex-wrap:wrap}
  .farol{width:22px;height:22px;border-radius:50%;background:#555;box-shadow:0 0 0 4px rgba(255,255,255,.05)}
  .farol.ok{background:var(--ok);box-shadow:0 0 18px var(--ok)}.farol.atencao{background:var(--warn);box-shadow:0 0 18px var(--warn)}.farol.critico{background:var(--bad);box-shadow:0 0 22px var(--bad);animation:pulsa 1s infinite}
  @keyframes pulsa{50%{opacity:.45}}
  h1{font-size:18px;margin:0;letter-spacing:.08em;text-transform:uppercase}
  .sub{color:var(--mut);font-size:12px}
  .grow{flex:1}
  .relogio{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
  main{padding:16px 20px 40px;max-width:1500px;margin:0 auto}
  .banner{border:1px solid var(--line);border-left:6px solid var(--ok);background:var(--panel);border-radius:10px;padding:12px 16px;margin-bottom:14px}
  .banner.atencao{border-left-color:var(--warn)}.banner.critico{border-left-color:var(--bad)}
  .banner h2{margin:0 0 4px;font-size:15px}
  .prob{margin:4px 0;font-size:13px}
  .prob .tag{display:inline-block;min-width:78px;text-align:center;font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;margin-right:8px;text-transform:uppercase}
  .prob .tag.critico{background:var(--bad);color:#fff}.prob .tag.atencao{background:var(--warn);color:#201400}
  td .tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:9px;white-space:nowrap}td .tag.ok{background:var(--ok);color:#04210f}td .tag.critico{background:var(--bad);color:#fff}td .tag.atencao{background:var(--warn);color:#201400}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;position:relative}
  .card .t{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .card .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
  .card .s{color:var(--mut);font-size:12px}
  .card.ok{border-top:3px solid var(--ok)}.card.atencao{border-top:3px solid var(--warn)}.card.critico{border-top:3px solid var(--bad)}.card.desligado{border-top:3px solid #475569;opacity:.82}
  .sec{margin:18px 0 8px;color:var(--ac);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:7px 10px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);font-size:13px}
  th{background:var(--panel2);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  th:first-child,td:first-child{text-align:left}
  tr.tot td{font-weight:700;background:var(--panel2)}
  .pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:700}
  .pill.ok{background:rgba(34,197,94,.18);color:var(--ok)}.pill.atencao{background:rgba(245,158,11,.18);color:var(--warn)}.pill.critico{background:rgba(239,68,68,.2);color:var(--bad)}.pill.fut{background:rgba(127,147,178,.18);color:var(--mut)}
  .barra{height:8px;background:#13233d;border-radius:4px;overflow:hidden;min-width:70px}.barra i{display:block;height:100%;background:var(--ok)}
  .leg{font-size:11px;color:var(--mut)}
  .erro{color:var(--bad);padding:30px;text-align:center}
  @media (max-width:640px){header{padding:10px 12px}.relogio{font-size:16px}main{padding:12px}.card .v{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="farol" id="farol"></div>
  <div><h1>CEVEN · Sala de Controle v2</h1><div class="sub" id="sub">carregando…</div></div>
  <a href="/gestao-equipe" style="color:#38bdf8;text-decoration:none;border:1px solid #22304d;border-radius:8px;padding:6px 10px;margin-left:8px">🔄 Gestão de Equipe</a>
  <a href="/contatos" style="color:#38bdf8;text-decoration:none;border:1px solid #22304d;border-radius:8px;padding:6px 10px">👥 Contatos do JOTA</a>
  <div class="grow"></div>
  <div style="text-align:right"><div class="relogio" id="relogio">--:--:--</div><div class="sub" id="prox">atualiza a cada 15 s</div></div>
</header>
<main id="raiz"><div class="erro">Carregando a sala de controle…</div></main>

<script>
const $ = (id) => document.getElementById(id);
const nf = (n) => n == null ? '—' : Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const brl = (n) => n == null ? '—' : 'R$ ' + Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const mi = (n) => n == null ? '—' : 'R$ ' + (Number(n) / 1e6).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' mi';
const idade = (s) => s == null ? '—' : s < 90 ? s + ' s' : s < 5400 ? Math.round(s / 60) + ' min' : (s / 3600).toFixed(1).replace('.', ',') + ' h';
let falhasSeguidas = 0, ultimo = null;

function card(t, v, s, cls) {
  return `<div class="card ${cls || ''}"><div class="t">${t}</div><div class="v">${v}</div><div class="s">${s || ''}</div></div>`;
}

function render(d) {
  const g = d.gerot || {}, cl = d.clube || {}, e = d.equipe, m = d.metas || {}, l = d.lances || {}, c = d.coleta || {};
  const nivelGerot = d.problemas.some((p) => p.bloco === 'gerot' && p.nivel === 'critico') ? 'critico' : d.problemas.some((p) => p.bloco === 'gerot') ? 'atencao' : 'ok';
  const nivelClube = d.problemas.some((p) => p.bloco === 'clube') ? 'atencao' : 'ok';
  const nivelMetas = d.problemas.some((p) => p.bloco === 'metas' && p.nivel === 'critico') ? 'critico' : d.problemas.some((p) => p.bloco === 'metas') ? 'atencao' : 'ok';
  const nivelEq = d.problemas.some((p) => p.bloco === 'equipe' && p.nivel === 'critico') ? 'critico' : d.problemas.some((p) => p.bloco === 'equipe') ? 'atencao' : 'ok';
  const hdr = { ok: 'Todos os sistemas operando (GEROT + Clube)', atencao: 'Atenção: há itens para olhar', critico: 'CRÍTICO: há falha em componente ativo' }[d.nivel] || 'Monitoramento';

  $('farol').className = 'farol ' + d.nivel;
  $('sub').textContent = `${d.dia} · ${d.hora_sp} (Brasília) · ${d.dia_util ? 'dia útil' : 'fim de semana'} · versão ${d.versao || '—'}`;

  let h = `<div class="banner ${d.nivel}"><h2>${hdr}</h2>` +
    (d.problemas.length ? d.problemas.map((p) => `<div class="prob"><span class="tag ${p.nivel}">${p.bloco}</span>${p.texto}</div>`).join('') : '<div class="s" style="color:var(--mut)">Nenhum problema detectado nos sistemas ativos.</div>') + '</div>';

  h += '<div class="sec">GEROT Oficial &amp; Portão Contábil</div><div class="grid">';
  h += card('Posição GEROT ativa', g.portao_status || '—', `${g.posicao || 'sem posição'} · idade ${idade(g.idade_s)}`, nivelGerot);
  h += card('Briefing Cache (IA)', nf(g.briefing_chaves), `chaves pré-agregadas (Brasil/Filiais/Sups) · ${nf(g.filiais_cobertas)}/11 filiais`, g.briefing_chaves >= 12 ? 'ok' : 'atencao');
  h += card('Clube da Venda (hoje)', mi(cl.digitado_hoje), `${nf(cl.rcas_lidos)} RCAs · ${nf(cl.pedidos_hoje)} pedidos · há ${idade(cl.idade_s)}`, nivelClube);
  h += card('Gabarito JOTA', d.jota ? `${d.jota.ok}/${d.jota.total}` : '—', d.jota ? `${d.jota.origem || 'D1'} · ${String(d.jota.em || '').slice(0, 16)}` : 'sem auditoria recente', 'ok');
  h += '</div>';

  h += '<div class="sec">Metas &amp; Gestão de Equipe</div><div class="grid">';
  h += card('Meta GEROT Brasil', mi(m.soma_dos_rcas), `Matriz mostra ${mi(m.matriz_mostra)} · ${nf(m.filiais_no_resumo)}/11 filiais`, nivelMetas);
  if (e) {
    h += card('Gestão de Equipe', nf(e.total), `mostra SIM ${nf(e.mostra_sim)} · NÃO ${nf(e.mostra_nao)} · fonte ${e.origem}${e.atualizado_por ? ' · ' + e.atualizado_por : ''}`, nivelEq);
    h += card('Representantes', nf(e.representantes), `meta ${mi(e.representantes_meta)} · faturado ${mi(e.representantes_faturado)}`, 'ok');
    h += card('Fora da Gestão (com meta)', nf(e.fora_da_gestao_com_meta), `${mi(e.fora_da_gestao_meta)} sem decisão` + (e.fora_da_gestao_top && e.fora_da_gestao_top.length ? ' · maiores: ' + e.fora_da_gestao_top.slice(0, 3).map((x) => x.filial + ' ' + x.rca).join(', ') : ''), e.fora_da_gestao_com_meta ? 'atencao' : 'ok');
  }
  h += '</div>';

  h += '<div class="sec">Lances &amp; WhatsApp (JOTA)</div><div class="grid">';
  h += card('Lances gravados hoje', nf(l.hoje), `último às ${l.ultimo_hora_sp || '—'}` + (l.por_nivel && l.por_nivel.length ? ' · ' + l.por_nivel.slice(0, 4).map((x) => x.nivel + ' ' + x.n).join(' · ') : ''), 'ok');
  const w = d.whatsapp;
  const horarios = w && w.horarios && w.horarios.length ? w.horarios.map((x) => `<span class="pill ${x.estado === 'futuro' ? 'fut' : ['concluido', 'ok', 'enviado', 'em_andamento'].includes(x.estado) ? 'ok' : 'atencao'}" title="${x.estado}">${x.hm}</span>`).join(' ') : '—';
  h += card('Disparos de WhatsApp', w && w.dia_util ? 'dia útil' : 'sem disparo', horarios + (w && w.erro ? ' · ' + w.erro : ''), d.problemas.some((p) => p.bloco === 'whatsapp') ? 'critico' : 'ok');
  h += '</div>';

  h += quadroTVs();

  h += '<div class="sec">Filiais (Consolidado GEROT + Clube Hoje)</div><table><thead><tr><th>Filial</th><th>RCAs Gestão</th><th>Meta Fat.</th><th>Faturado GEROT</th><th>% Meta</th><th>Carteira Pend.</th><th>Positivação / Meta</th><th>Digitado Clube</th><th>TMF (dias)</th></tr></thead><tbody>';
  let T = { rcas: 0, meta: 0, fat: 0, pend: 0, pos: 0, pmeta: 0, dig: 0 };
  for (const f of d.filiais || []) {
    const pct = f.meta_fat ? (f.faturado / f.meta_fat) * 100 : null;
    T.rcas += f.rcas || 0; T.meta += f.meta_fat || 0; T.fat += f.faturado || 0; T.pend += f.pendente || 0; T.pos += f.positivados || 0; T.pmeta += f.meta_pos || 0; T.dig += f.digitado_hoje || 0;
    h += `<tr><td><b>${f.filial}</b></td><td>${nf(f.rcas)}</td><td>${brl(f.meta_fat)}</td><td>${brl(f.faturado)}</td><td>${pct == null ? '—' : pct.toFixed(1).replace('.', ',') + '%'}<div class="barra"><i style="width:${Math.min(100, pct || 0)}%"></i></div></td><td>${brl(f.pendente)}</td><td>${nf(f.positivados)} / ${nf(f.meta_pos)}</td><td>${brl(f.digitado_hoje)}</td><td>${f.tmf_dias == null ? '—' : Number(f.tmf_dias).toFixed(2).replace('.', ',')}</td></tr>`;
  }
  h += `<tr class="tot"><td>TOTAL</td><td>${nf(T.rcas)}</td><td>${brl(T.meta)}</td><td>${brl(T.fat)}</td><td>${T.meta ? ((T.fat / T.meta) * 100).toFixed(1).replace('.', ',') + '%' : '—'}</td><td>${brl(T.pend)}</td><td>${nf(T.pos)} / ${nf(T.pmeta)}</td><td>${brl(T.dig)}</td><td></td></tr></tbody></table>`;

  h += '<div class="sec">CEVEN (legado desligado)</div><div class="grid">';
  h += card('Motor CEVEN', 'DESLIGADO', 'Substituído integralmente pelo GEROT + Clube da Venda', 'desligado');
  h += card('Chamadas simultâneas (auto)', c.concorrencia ? nf(c.concorrencia.atual) : '0', 'Sem atividade (legado)', 'desligado');
  h += '</div>';

  h += `<p class="leg">Gerado em ${d.gerado_em}. Este painel só lê (D1 / fatos); não grava nem aciona rotinas.</p>`;
  $('raiz').innerHTML = h;
}

let TVS = null;
const TVS_ESPERADAS = ['MTZ', 'TBL', 'TPH', 'TCV', 'ABC', 'TCA', 'MCD', 'TCG', 'API', 'TBE', 'TPA', 'TSJ'];
function quadroTVs() {
  if (!TVS) return '<div class="sec">TVs das filiais</div><div class="leg">carregando o sinal das TVs…</div>';
  const porFil = {};
  for (const t of TVS.tvs || []) (porFil[t.filial] = porFil[t.filial] || []).push(t);
  const linhas = [];
  for (const f of TVS_ESPERADAS) {
    const lst = (porFil[f] || []).sort((a, b) => a.minutos_sem_sinal - b.minutos_sem_sinal);
    if (!lst.length) { linhas.push({ f, g: '', st: 'critico', txt: 'SEM SINAL', det: 'desligada ou presa numa versão antiga' }); continue; }
    for (const t of lst) {
      const ligada = t.minutos_sem_sinal <= 3;
      const st = !ligada ? 'critico' : t.versao_velha ? 'atencao' : 'ok';
      const txt = !ligada ? 'DESLIGADA' : t.versao_velha ? 'LIGADA · versão velha' : 'LIGADA';
      const det = (ligada ? '' : 'último sinal há ' + idade(t.minutos_sem_sinal * 60) + ' · ') + (t.ocupado ? 'VAR na tela · ' : '') + 'fila VAR ' + nf(t.espera) + (t.filial !== 'MTZ' ? ' · ' + nf(t.vendedores) + ' vendedores' : '') + (t.dados_de ? ' · dados ' + t.dados_de : '') + ' · v. ' + (t.versao || '—');
      linhas.push({ f, g: t.grupo || '', st, txt, det });
    }
  }
  const lig = linhas.filter((l) => l.st !== 'critico').length;
  return `<div class="sec">TVs das filiais · ${lig} ligada(s) de ${linhas.length} · <a href="/tvs" style="color:#38bdf8">painel para print (/tvs)</a></div><table><thead><tr><th>TV</th><th>Situação</th><th>Detalhe</th></tr></thead><tbody>` +
    linhas.map((l) => `<tr><td><b>${l.f}</b>${l.g ? ' · ' + l.g : ''}</td><td><span class="tag ${l.st}">${l.txt}</span></td><td>${l.det}</td></tr>`).join('') +
    `</tbody></table><p class="leg">Versão atual do site: ${TVS.versao_atual}.</p>`;
}
async function carregaTVs() { try { TVS = await (await fetch('/api/tv-ping?t=' + Date.now(), { cache: 'no-store' })).json(); } catch (e) {} }

async function carregar() {
  await carregaTVs();
  try {
    const r = await fetch('/api/saude?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.erro) throw new Error(d.erro);
    falhasSeguidas = 0; ultimo = Date.now();
    render(d);
  } catch (e) {
    falhasSeguidas++;
    $('farol').className = 'farol critico';
    if (!ultimo) $('raiz').innerHTML = `<div class="erro">Não foi possível ler a saúde do sistema (${e.message}). Tentando de novo…</div>`;
    else $('prox').textContent = `sem resposta há ${falhasSeguidas} tentativas — dados de ${Math.round((Date.now() - ultimo) / 1000)} s atrás`;
  }
}
setInterval(() => { $('relogio').textContent = new Date().toLocaleTimeString('pt-BR'); }, 1000);
carregar(); setInterval(carregar, 15000);
</script>
</body>
</html>
