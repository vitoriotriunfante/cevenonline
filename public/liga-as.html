<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liga AS · Brasileirão Triunfante</title>
<style>
  :root { --bg:#0b1220; --card:#121b2e; --linha:#22304d; --tx:#e8eefc; --mut:#8fa0c2; --ok:#34d399; --ruim:#f87171; --aviso:#fbbf24; --acc:#60a5fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.45 system-ui,"Segoe UI",sans-serif; padding:18px 16px 60px; }
  h1 { margin:0 0 4px; font-size:22px; letter-spacing:.01em; }
  .sub { color:var(--mut); max-width:900px; margin-bottom:12px; }
  .sombra { display:inline-block; background:#7c2d12; color:#fed7aa; font-weight:800; padding:4px 12px; border-radius:99px; font-size:12px; margin-bottom:12px; }
  .barra { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0 14px; }
  select, button { background:var(--card); color:var(--tx); border:1px solid var(--linha); border-radius:8px; padding:7px 12px; font:inherit; }
  button.on { background:var(--acc); color:#04202e; font-weight:800; border-color:var(--acc); }
  .regras { background:var(--card); border:1px solid var(--linha); border-radius:12px; padding:10px 14px; color:var(--mut); margin-bottom:14px; font-size:13px; }
  .tab { overflow-x:auto; background:var(--card); border:1px solid var(--linha); border-radius:12px; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:7px 10px; border-bottom:1px solid var(--linha); text-align:left; white-space:nowrap; font-size:13px; }
  th { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  td.c, th.c { text-align:center; }
  .ok { color:var(--ok); font-weight:800; } .no { color:var(--ruim); font-weight:800; } .fut { color:var(--mut); } .and { color:var(--aviso); font-weight:700; }
  .pts { font-weight:900; font-size:15px; }
  .vazio { padding:18px; color:var(--mut); }
</style>
</head>
<body>
<h1>Brasileirão Triunfante — Liga da Virada · AS</h1>
<div class="sub">Autosserviço: acompanhamento semanal da meta do mês (faseamento), separado para supervisor e vendedor.</div>
<span class="sombra" id="selo">MODO SOMBRA · não vale pontos até 01/11/2026</span>
<div class="regras" id="regras">Carregando…</div>
<div class="barra">
  <button id="bSup" class="on">Supervisores</button><button id="bVend">Vendedores</button>
  <select id="fil"><option value="">Todas as filiais</option></select>
  <span id="rodape" style="color:var(--mut);font-size:12px"></span>
</div>
<div class="tab" id="tab">Carregando…</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl = (x) => 'R$ ' + (Number(x) || 0).toLocaleString('pt-BR', {maximumFractionDigits: 0});
let D = null, VISAO = 'sup';
const cel = (f) => f.status === 'batida' ? `<span class="ok" title="${f.pct}% no dia ${f.ate}">✅ ${f.pct}%</span>` : f.status === 'nao_batida' ? `<span class="no" title="meta ${f.meta}%">❌ ${f.pct}%</span>` : f.status === 'futuro' ? '<span class="fut">⏳</span>' : '—';
const bon = (b) => b.status === 'batido' ? `<span class="ok" title="batida em ${b.quando}">✅ +${b.pontos}</span>` : b.status === 'perdido' ? '<span class="no">❌</span>' : '<span class="and">em jogo</span>';
function desenha() {
  if (!D) return;
  const f = $('fil').value, L = (VISAO === 'sup' ? D.supervisores : D.vendedores).filter((x) => !f || x.filial === f);
  const cab = `<th>Filial</th><th>${VISAO === 'sup' ? 'Supervisor' : 'Vendedor'}</th>${VISAO === 'sup' ? '<th class="n">Equipe</th>' : '<th>Supervisor</th>'}<th class="n">Meta do mês</th><th class="n">Hoje</th><th class="c">S1 20%</th><th class="c">S2 40%</th><th class="c">S3 60%</th><th class="c">S4 110%</th><th class="c">100% até 15</th><th class="c">100% até 25</th><th class="n">Pontos</th>`;
  const lin = L.map((x) => `<tr><td><b>${esc(x.filial)}</b></td><td>${esc(VISAO === 'sup' ? x.supervisor : x.nome)}${VISAO === 'vend' ? ' <span class="fut">(' + esc(x.rca) + ')</span>' : ''}</td>` +
    (VISAO === 'sup' ? `<td class="n">${x.com_meta}/${x.vendedores}</td>` : `<td>${esc(x.supervisor)}</td>`) +
    `<td class="n">${x.meta_mes ? brl(x.meta_mes) : '<span class="fut">sem meta</span>'}</td><td class="n">${x.pct_hoje != null ? x.pct_hoje + '%' : '—'}</td>` +
    x.fases.map((p) => `<td class="c">${cel(p)}</td>`).join('') + x.bonus.map((b) => `<td class="c">${bon(b)}</td>`).join('') + `<td class="n pts">${x.pontos}</td></tr>`).join('');
  $('tab').innerHTML = L.length ? `<table><thead><tr>${cab}</tr></thead><tbody>${lin}</tbody></table>` : '<div class="vazio">Nenhum resultado para este filtro.</div>';
}
async function carrega() {
  let d; try { d = await (await fetch('/api/liga-as?t=' + Date.now(), {cache: 'no-store'})).json(); } catch { $('tab').textContent = 'Não consegui ler os dados agora.'; return; }
  if (d.erro) { $('tab').textContent = 'Erro: ' + d.erro; return; }
  D = d;
  $('regras').innerHTML = '<b>Faseamento</b> (% da meta do mês no fim da semana): ' + d.regras.fases.map((p) => `semana ${p.n} até o dia ${p.fimDoMes ? 'último' : p.ate}: ${p.meta}% = ${p.pontos} pts`).join(' · ') + '. <b>Bônus</b>: ' + d.regras.bonus.map((b) => `${b.nome} (${b.meta}%) = +${b.pontos}`).join(' · ') + `. % = ${esc(d.regras.base)}. <b>${d.totais.vendedores}</b> vendedores AS (${d.totais.vendedores_com_meta} com meta) · <b>${d.totais.supervisores}</b> supervisores.`;
  const sel = $('fil'), atual = sel.value, fs = [...new Set(d.vendedores.map((v) => v.filial))].sort();
  sel.innerHTML = '<option value="">Todas as filiais</option>' + fs.map((x) => `<option value="${x}"${x === atual ? ' selected' : ''}>${x}</option>`).join('');
  $('rodape').textContent = `mês ${d.mes} · atualizado ${new Date().toLocaleTimeString('pt-BR')}`;
  desenha();
}
$('bSup').onclick = () => { VISAO = 'sup'; $('bSup').className = 'on'; $('bVend').className = ''; desenha(); };
$('bVend').onclick = () => { VISAO = 'vend'; $('bVend').className = 'on'; $('bSup').className = ''; desenha(); };
$('fil').onchange = desenha;
carrega(); setInterval(carrega, 5 * 60 * 1000);
</script>
</body>
</html>
