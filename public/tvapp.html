<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEVEN CFTV — TV da Filial</title>
<!--
FICHA DO ARQUIVO
O QUE É: a tela real da TV da filial. Aberta DENTRO da casca /tv (iframe) — quem cuida de tela cheia e atualização é a casca.
PROJETO: CFTV/TV (não é WhatsApp).
PREMISSA: 100% ONLINE - nada aqui pode depender do PC do Vitório (ver PREMISSA_ONLINE.md). Ver CLAUDE.md e docs/CFTV_MATRIX_VISAO_E_ESTADO_ATUAL.md.
LÊ: /api/representantes?filial= e /api/tv-vendedor?filial=&id= (dado ao vivo do CEVEN).
REGRA: nunca inventa dado. Sem resposta = "—" e mantém a última leitura real.
ALTERNÂNCIA: a partir das 08:00 (Brasília) alterna blocos de 10 min: RONDA / PAINEL.
ALERTAS: pênalti (ESTOQUE SUFICIENTE ou cliente fechado, com >30 dias sem compra),
         cartão vermelho (10h sem venda), expulsão (10h sem visita). Ver docs.
DIÁRIO: guarda no navegador os lances e snapshots do dia (botão Exportar).
-->
<style>
:root{--bg:#070b14;--card:#0f1626;--card2:#131c30;--line:#1e2a44;--tx:#e8eefc;--mut:#8b9bbd;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--acc:#38bdf8;--pend:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Segoe UI,Inter,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.mono{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:20px;padding:10px 22px;background:#0a1020;border-bottom:1px solid var(--line);flex-shrink:0;z-index:10}
.rec{color:var(--bad);font-weight:800;font-size:13px;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
.fil{font-size:22px;font-weight:800}.fil small{color:var(--mut);font-weight:500;font-size:14px;margin-left:8px}
.sp{flex:1}
.upd{color:var(--mut);font-size:13px}.upd.old{color:var(--bad);font-weight:800}
.modo{font-size:12px;font-weight:800;letter-spacing:.08em;padding:3px 10px;border-radius:6px;background:#1a2440;color:var(--acc)}
.clock{font-size:26px;font-weight:700}
.tot{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line);flex-shrink:0;z-index:9}
.tot div{background:var(--card);padding:10px 18px}
.tot b{display:block;font-size:24px;margin-top:2px}
.tot span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
main{flex:1;min-height:0;padding:14px 22px;display:flex}
#ronda{flex:1;display:grid;grid-template-columns:1.55fr 1fr;gap:14px;min-height:0}
#painel{flex:1;display:none;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;min-height:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;scrollbar-width:none;position:relative}
.panel::-webkit-scrollbar{display:none}
.panel h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;justify-content:space-between;position:sticky;top:-16px;background:var(--card);padding:6px 0;margin-top:-6px;z-index:5;border-bottom:1px solid rgba(255,255,255,.05)}
.panel h2 b{color:var(--tx)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:16px;padding:4px 0;border-bottom:1px solid #16203a}
.row:last-child{border:0}
.row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mut);display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:6px}
.t-pen{background:var(--bad);color:#fff}
.t-ven{background:#7f1d1d;color:#fecaca;border:1px solid var(--bad)}
.t-vis{background:#450a0a;color:#fff;border:2px solid var(--bad);animation:p 1s infinite}
.hb{height:8px;border-radius:99px;background:#1a2440;overflow:hidden;margin-top:3px}
.hb i{display:block;height:100%;background:var(--acc)}
.hb.red i{background:var(--bad)}
.master{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;gap:16px;min-height:0;position:relative;overflow:hidden}
.master.zer{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad),0 0 40px #ef444433}
.mh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.mh h1{font-size:34px;font-weight:800;line-height:1.1}
.mh .cod{color:var(--mut);font-size:16px}
.badge{padding:4px 12px;border-radius:99px;font-size:13px;font-weight:800;letter-spacing:.05em}
.b-bad{background:#ef444426;color:#fca5a5;border:1px solid var(--bad)}
.b-mut{background:#8b9bbd22;color:var(--mut);border:1px solid #8b9bbd55}
.b-ok{background:#22c55e22;color:#86efac;border:1px solid var(--ok)}
.lances{background:#2a0a0a;border:1px solid var(--bad);border-radius:12px;padding:8px 14px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.sec{display:flex;flex-direction:column;gap:8px}
.lab{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);font-size:14px;text-transform:uppercase;letter-spacing:.07em;gap:12px}
.lab b{color:var(--tx);font-size:30px;letter-spacing:0;text-transform:none}
.bar{height:22px;border-radius:99px;background:#1a2440;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.leg{display:flex;gap:18px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-size:30px;margin-top:4px}
.kpi small{color:var(--mut);font-size:13px}
.side{display:grid;grid-template-rows:repeat(5,1fr);gap:10px;min-height:0}
.mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-content:center}
.mini.zer{border-color:var(--bad)}
.mini h3{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .v{font-size:20px;font-weight:800;text-align:right}
.mini .bar{height:9px;grid-column:1/3;margin-top:4px}
.mini small{color:var(--mut);font-size:12px}
.mini .r{text-align:right}
.rota{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0;overflow:hidden}
.rota h4{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.rt{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--card2);font-size:16px}
.rt.pen{background:#2a0a0a;border:1px solid var(--bad)}
.rt .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt .n small{display:block;color:var(--mut);font-size:12px}
.rt .d{color:var(--mut);font-size:14px;white-space:nowrap}
.st{font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:6px;text-align:center}
.s-v{background:#22c55e26;color:#86efac}.s-x{background:#f59e0b26;color:#fcd34d}.s-a{background:#8b9bbd22;color:var(--mut)}
.supr{padding:12px 20px;border-radius:12px;background:var(--card2);font-size:min(2.1vw,30px)}
.supr.bad{background:#2a0a0a;border:2px solid var(--bad)}.supr.warn{border:1px solid var(--warn)}
.supr-cab{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center}
.supr-ret{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:min(1.4vw,20px);color:var(--mut)}
.supr-fotos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.supr-fotos img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.chip{font-size:min(1.4vw,20px);font-weight:800;padding:6px 14px;border-radius:99px;white-space:nowrap}
.c-ok{background:#22c55e26;color:#86efac}.c-no{background:var(--bad);color:#fff}
.prog{position:absolute;left:0;bottom:0;height:4px;background:var(--acc);width:0}
footer{padding:8px 22px 10px;border-top:1px solid var(--line);background:#0a1020;display:flex;gap:14px;align-items:center;font-size:15px;flex-shrink:0}
footer .tag{background:var(--warn);color:#1a1200;font-weight:800;padding:3px 10px;border-radius:6px;font-size:12px;letter-spacing:.06em}
footer .msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctl{display:flex;gap:6px;opacity:.35;transition:opacity .2s}
#ctl:hover{opacity:1}
#ctl button{background:#1a2440;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
#ctl button.on{background:var(--acc);color:#04202e;font-weight:800}
/* ===== VAR ===== */
#ov{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:4vh 4vw;background:#000e}
#ov.show{display:flex}
#ov.f1{animation:fl .5s steps(2) infinite}
@keyframes fl{0%{background:#7f1d1dee}50%{background:#000e}}
#ov .big{font-size:min(15vw,240px);font-weight:900;color:#fff;letter-spacing:.04em;text-shadow:0 0 60px var(--bad);line-height:1}
#ov .sub{font-size:min(3.4vw,46px);margin-top:2vh;color:#fecaca;font-weight:700}
#ov .var{font-size:min(6vw,90px);font-weight:900;color:var(--acc);letter-spacing:.12em}
#ov .scan{width:60vw;height:8px;background:#1a2440;margin-top:4vh;border-radius:9px;overflow:hidden}
#ov .scan i{display:block;height:100%;width:30%;background:var(--acc);animation:sc 1s linear infinite}
@keyframes sc{from{margin-left:-30%}to{margin-left:100%}}
#ov .dec{background:var(--card);border:3px solid var(--bad);border-radius:24px;padding:3vh 3vw;width:min(1500px,92vw);text-align:left}
#ov .dec h1{font-size:min(3.6vw,52px);color:#fff;margin-bottom:2vh}
#ov .dec .ln{font-size:min(2.1vw,30px);padding:.7vh 0;border-bottom:1px solid var(--line);display:flex;gap:16px}
#ov .dec .ln b{color:var(--mut);min-width:14ch;font-weight:600}
#ov .dec .ln.hot span{color:#fca5a5;font-weight:800}
#ov .dec.rev .ln{font-size:min(1.55vw,23px);padding:.5vh 0}#ov .dec.rev h1{font-size:min(3vw,44px);margin-bottom:1vh}#ov .dec.rev .vd{font-size:min(2vw,28px);margin-top:1vh}
#ov .dec .vd{margin-top:2vh;font-size:min(2.4vw,34px);font-weight:800;color:#fca5a5}
#ov small{margin-top:2vh;color:var(--mut);font-size:16px}
/* CONTROLES DE FILTRO E CONGELAMENTO */
.filtros-header{display:flex;align-items:center;gap:8px;background:#0d1527;padding:3px 8px;border-radius:10px;border:1px solid var(--line)}
.filtros-header select{background:#15223c;color:#fff;border:1px solid #253658;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;outline:none;cursor:pointer;max-width:180px}
.filtros-header select:hover{border-color:var(--acc)}
.filtros-header button{background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s}
.filtros-header button:hover{background:#334155;color:#fff}
.filtros-header button.congelado{background:#b91c1c;border-color:#ef4444;color:#fff;animation:pulseCongela 1.5s infinite}
@keyframes pulseCongela{0%,100%{opacity:1}50%{opacity:.75}}

/* HIERARQUIA MODAL: SUPERVISOR -> VENDEDOR -> OCORRENCIAS/CLIENTES */
.det-tree-sup{background:#101a2f;border:1px solid #1e2c4a;border-radius:10px;margin-bottom:8px;overflow:hidden}
.det-tree-sup-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#15223c;cursor:pointer;user-select:none;font-size:14px;font-weight:800;color:var(--tx)}
.det-tree-sup-head:hover{background:#1c2d50}
.det-tree-sup-body{display:none;padding:6px 10px 10px;border-top:1px solid #1e2c4a}
.det-tree-sup-body.open{display:block}
.det-tree-vend{background:#0a0f1d;border:1px solid rgba(255,255,255,.05);border-radius:8px;margin:6px 0;overflow:hidden}
.det-tree-vend-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0d1424;cursor:pointer;user-select:none;font-size:13px;font-weight:700}
.det-tree-vend-head:hover{background:#131c33}
.det-tree-vend-body{display:none;padding:6px 10px 8px;border-top:1px solid rgba(255,255,255,.03);background:#070b14}
.det-tree-vend-body.open{display:block}
.det-tree-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.03)}
.det-tree-item:last-child{border-bottom:none}
.det-badge{padding:3px 9px;border-radius:6px;font-size:12px;font-weight:800;background:rgba(56,189,248,.15);color:var(--acc)}
.det-badge.red{background:rgba(239,68,68,.18);color:#fca5a5}
.det-badge.grn{background:rgba(34,197,94,.18);color:#86efac}
.det-toggle-all{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700}
.det-toggle-all:hover{color:#fff;border-color:var(--acc)}

/* BADGES ELEGANTES DE CANAL/SEGMENTO (AS, VAREJO, FARMA) */
.tag-canal{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:rgba(148,163,184,.12);color:#94a3b8;border:1px solid rgba(148,163,184,.25);vertical-align:middle;margin-left:4px}
.tag-canal.as{background:rgba(168,85,247,.12);color:#c084fc;border-color:rgba(168,85,247,.3)}
.tag-canal.vj{background:rgba(56,189,248,.1);color:#7dd3fc;border-color:rgba(56,189,248,.25)}
.tag-canal.farma{background:rgba(20,184,166,.12);color:#5eead4;border-color:rgba(20,184,166,.3)}
.tag-canal.esp{background:rgba(245,158,11,.12);color:#fcd34d;border-color:rgba(245,158,11,.25)}

/* VERSÃO MOBILE REFINADA */
@media(max-width:900px){
  body{height:auto;min-height:100vh;overflow-y:auto;overflow-x:hidden}
  header{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .rec{font-size:11px}
  .fil{font-size:18px}
  .clock{font-size:18px}
  .filtros-header{width:100%;justify-content:space-between;order:10;margin-top:4px}
  .filtros-header select{flex:1;max-width:none}
  .tot{display:grid;grid-template-columns:repeat(2,1fr);gap:1px}
  .tot div{padding:8px 12px}
  .tot b{font-size:18px}
  .tot span{font-size:10px}
  main{padding:10px;flex-direction:column;height:auto;overflow:visible}
  #ronda{display:flex;flex-direction:column;gap:12px}
  #painel{display:none;grid-template-columns:1fr;grid-template-rows:auto;gap:12px}
  .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));grid-template-rows:none;gap:10px}
  .grid4{grid-template-columns:repeat(2,1fr);gap:8px}
  .master{padding:14px}
  .master h1{font-size:22px}
  .lab b{font-size:20px}
  .kpi b{font-size:20px}
  .kpi span{font-size:10px}
  .kpi small{font-size:11px}
  .rt{font-size:13px;grid-template-columns:70px 1fr auto;gap:8px;padding:6px 8px}
  footer{flex-wrap:wrap;padding:8px 12px;gap:8px}
  footer .msg{width:100%;font-size:12px}
  #ctl{width:100%;overflow-x:auto;padding-bottom:4px}
  #modalDetalheBox{width:96vw;max-height:90vh}
  #modalDetalheHeader{padding:12px 14px}
  #modalDetalheTitulo{font-size:16px}
}
.row-clic{cursor:pointer}.row-clic:hover{background:rgba(255,255,255,.04);border-radius:8px}
#modalDetalheOverlay{display:none;position:fixed;inset:0;background:rgba(3,6,12,.85);z-index:900;align-items:center;justify-content:center}
#modalDetalheOverlay.show{display:flex}
#modalDetalheBox{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(820px,92vw);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modalDetalheHeader{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
#modalDetalheTitulo{font-size:19px;font-weight:800}
#modalDetalheSub{font-size:13px;color:var(--mut);margin-top:2px}
#modalDetalheFechar,#modalDetalheExportar{background:var(--card2);border:none;color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:700}
#modalDetalheLista{overflow-y:auto;padding:8px 12px}
.modal-det-linha{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.modal-det-nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-det-vazio{text-align:center;padding:30px;color:var(--mut);font-size:14px}
</style><script src="/animacoes/tv-animacoes.js"></script>
</head><body>

     (decisão do Vitório, 28/09/2026) -->

</div>
<header>
  <div class="rec"><i></i>CFTV AO VIVO</div>

<section class="tot" id="tot"></section>
<main>

  <div id="painel">
    <div class="panel" id="p1"></div><div class="panel" id="p2"></div>
    <div class="panel" id="p3"></div><div class="panel" id="p4"></div>
  </div>

</main>
<footer>
  <span class="tag">ALERTAS</span>
  <span class="msg" id="alert">—</span>
  <div id="ctl">
    <button id="bt-gol" style="background:#166534;color:#86efac;font-weight:700" title="Testar animação de Gol">⚽ Teste Gol</button>

let MOUSE_SOBRE_PAINEL = false;

function setupPaineisHover() {
  document.querySelectorAll('.panel, .rota, #ronda, .side').forEach(p => {
    if (p._hasHoverListener) return;
    p._hasHoverListener = true;
    p.addEventListener('mouseenter', () => { MOUSE_SOBRE_PAINEL = true; });
    p.addEventListener('mouseleave', () => { MOUSE_SOBRE_PAINEL = false; });
    p.addEventListener('touchstart', () => { MOUSE_SOBRE_PAINEL = true; }, { passive: true });
    p.addEventListener('touchend', () => { setTimeout(() => { MOUSE_SOBRE_PAINEL = false; }, 2000); }, { passive: true });
  });
}

function autoScrollPaineis() {
  if (MOUSE_SOBRE_PAINEL) return; // pausa imediata enquanto o usuário estiver com o mouse ou dedo sobre o painel
  setupPaineisHover();

  document.querySelectorAll('.panel, .rota').forEach((p) => {
    if (p.offsetParent === null) return;
    const excesso = p.scrollHeight - p.clientHeight;
    if (excesso < 15) return;
    const ciclo = 26000; // ciclo bem mais lento (26s) para facilitar a leitura confortável
    const t = (Date.now() % ciclo) / ciclo;
    const fase = t < 0.5 ? t * 2 : (1 - t) * 2;
    p.scrollTop = excesso * fase;
  });
}
