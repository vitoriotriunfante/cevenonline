<!--
FICHA DO ARQUIVO
O QUE É: a tela real da TV da filial. Aberta DENTRO da casca /tv (iframe) — quem cuida de tela cheia e atualização é a casca.
PROJETO: CFTV/TV (não é WhatsApp).
PREMISSA: 100% ONLINE - nada aqui pode depender do PC do Vitório (ver PREMISSA_ONLINE.md). Ver CLAUDE.md e docs/CFTV_MATRIX_VISAO_E_ESTADO_ATUAL.md.
LÊ: /api/representantes?filial= e /api/tv-vendedor?filial=&id= (dado ao vivo do CEVEN).
REGRA: nunca inventa dado. Sem resposta = "—" e mantém a última leitura real.
ALTERNÂNCIA: a partir das 08:00 (Brasília) alterna blocos de 10 min: RONDA / PAINEL.
ALERTAS: pênalti (ESTOQUE SUFICIENTE ou cliente fechado, com >30 dias sem compra),
         cartão vermelho (10h sem venda), expulsão (10h sem visita). Ver docs.
DIÁRIO: guarda no navegador os lances e snapshots do dia (botão Exportar).
-->

<script>
'use strict';
// ============================== CONFIG ==============================
const P = new URLSearchParams(location.search);
const FIL = (P.get('filial') || '').toUpperCase();
const VALID = ['TBL','TPH','TCV','ABC','TCA','MCD','TCG','API','TBE','TPA','TSJ'];
const CICLO_S = +P.get('ciclo') || 90;          // atualização dos dados
const BLOCO_MIN = +P.get('bloco') || 10;        // minutos por bloco na alternância
const ROTA_S = +P.get('rotacao') || 10;         // segundos por vendedor na ronda
const INICIO_H = 8, FIM_H = 19, LIMITE_H = 10;  // alternância 08h–19h; regras "10h"
const DIAS_PENALTI_ESTOQUE = 30, DIAS_PENALTI_FECHADO = 45; // limiares dos pênaltis P01/P02
const CAMPO = ['VJ','PET VJ'];                  // canais com cobrança de rota (regra de negócio)
const EXCLUI = ['GER','SUP'];

// ============================== UTIL ==============================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
const brl = v => num(v) == null ? '—' : 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const pc = v => num(v) == null ? '—' : (Math.round(v * 10) / 10).toLocaleString('pt-BR') + '%';
const nv = v => num(v) == null ? '—' : v.toLocaleString('pt-BR');
const fmtSP = new Intl.DateTimeFormat('en-GB', {timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function sp(d) {
  const o = {}; fmtSP.formatToParts(d || new Date()).forEach(p => o[p.type] = p.value);
  const h = (+o.hour) % 24;
  return {date: `${o.year}-${o.month}-${o.day}`, h, m: +o.minute, hms: `${String(h).padStart(2,'0')}:${o.minute}:${o.second}`, hm: `${String(h).padStart(2,'0')}:${o.minute}`};
}
function diasDesde(dataISO) {
  if (!dataISO || +dataISO.slice(0, 4) < 2000) return null; // data ausente ou inválida (ex.: 1900) = sem data de compra
  const a = Date.UTC(...sp().date.split('-').map((x,i)=>i===1?+x-1:+x));
  const b = Date.UTC(...dataISO.split('-').map((x,i)=>i===1?+x-1:+x));
  return Math.round((a - b) / 86400000);
}
// Dias úteis (seg-sex) do mês corrente até hoje e no mês inteiro — para meta diária pro-rata (G11).
function diasUteisMes() {
  const [ano, mes] = sp().date.split('-').map(Number);
  const ultimoDia = new Date(Date.UTC(ano, mes, 0)).getUTCDate();
  let totalUteis = 0, uteisAteHoje = 0;
  const hoje = +sp().date.split('-')[2];
  for (let dia = 1; dia <= ultimoDia; dia++) {
    const diaSemana = new Date(Date.UTC(ano, mes - 1, dia)).getUTCDay(); // 0=domingo, 6=sábado
    if (diaSemana !== 0 && diaSemana !== 6) {
      totalUteis++;
      if (dia <= hoje) uteisAteHoje++;
    }
  }
  return { totalUteis, uteisAteHoje };
}
// Texto do "porquê" do gol, por subtipo. relampago/acrescimos são APROXIMADOS (ver
// DIG_DETECTADO_EM) — o texto sempre avisa isso, nunca finge precisão que não temos.
function textoGol(subtipo, valor, c, horaAprox) {
  if (subtipo === 'super_pedido') return `Super Pedido: ${brl(valor)}!`;
  if (subtipo === 'inativo_recuperado') return `${c && c.nome} · cliente inativo resgatado!`;
  if (subtipo === 'relampago_aprox') return `Gol Relâmpago (detectado ~${String(horaAprox).padStart(2,'0')}h) · aprox.`;
  if (subtipo === 'acrescimos_aprox') return `Gol nos Acréscimos (detectado ~${String(horaAprox).padStart(2,'0')}h) · aprox.`;
  if (subtipo === 'conversao') return `Máquina de Conversão: ${valor.toFixed(0)}% de aproveitamento!`;
  if (subtipo === 'goleada') return `Goleada! ${valor} clientes positivados hoje!`;
  if (subtipo === 'campeao') return `Campeão da Rodada: 100% da meta do mês batida!`;
  if (subtipo === 'dobrou_mix') return `${c && c.nome} · dobrou o mix do cliente!`;
  if (subtipo === 'hattrick_aprox') return `Hat-Trick (3 pedidos seguidos, ~${String(horaAprox).padStart(2,'0')}h) · aprox.`;
  if (subtipo === 'meta1tempo_aprox') return `Meta do 1º Tempo batida (~${String(horaAprox).padStart(2,'0')}h) · aprox.`;
  if (subtipo === 'dobradinha_quinzenas') return `${c && c.nome} · dobradinha das quinzenas!`;
  return 'GOL DE PLACA';
}
// I02: distância Haversine entre check-out do vendedor e o cadastro do cliente (metros)
function distanciaM(lat1, lon1, lat2, lon2) {
  if ([lat1, lon1, lat2, lon2].some(v => v == null || isNaN(v))) return null;
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
const ddmm = iso => iso ? iso.slice(8,10) + '/' + iso.slice(5,7) : '—';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const HOJE0 = sp().date;
const K = {seen:`ceven_tv_seen_${FIL}_`, log:`ceven_tv_log_${FIL}_`, snap:`ceven_tv_snap_${FIL}_`};
(function limpaAntigos() { try { Object.keys(localStorage).forEach(k => { if (/^ceven_tv_(seen|log|snap)_/.test(k) && !k.endsWith(HOJE0)) localStorage.removeItem(k); }); } catch {} })();

// ============================== ESTADO ==============================
let REPS = [];            // [{id,nome,canal}]
const DATA = {};          // id -> última leitura real (tv-vendedor)
// id -> {valor: dig_hoje na última mudança percebida, em: timestamp em que percebemos}.
// APROXIMAÇÃO: o CEVEN não expõe horário exato de pedido (confirmado — ver
// REGRAS_CFTV/PLANO_AMANHA_27_09_2026.md). Isso usa o momento em que A NOSSA CHECAGEM (a cada
// ~90s) percebeu o valor subir, como proxy do horário real do pedido — margem de erro de até
// ~90s. Serve para lances de JANELA DE HORÁRIO do dia (ex.: "antes das 9h", "depois das 17h").
const DIG_DETECTADO_EM = {};
// id -> [{valor, em}, ...] TODAS as detecções do dia (não só a última) — usado só pelo Hat-Trick
