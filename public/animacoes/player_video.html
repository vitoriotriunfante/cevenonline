<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!--
FICHA DO ARQUIVO
O QUE É: player de vídeo isolado, usado dentro de um <iframe> por tv-animacoes.js
(tocaVideoLance) para tocar os vídeos reais dos lances (gol, vermelho, etc.) sem travar a
Smart TV. Motivo de existir: ov.innerHTML = '' (chamado a cada novo lance) destrói qualquer
<video> filho direto de #ov, mesmo mantendo a referência JS — vira tela preta. Isolando o
<video> num iframe à parte (dentro de #video-lance-fixo, IRMÃO de #ov, nunca filho), o reset
de HTML do lance nunca toca nele.
NÃO ALTERAR o nome/caminho deste arquivo sem atualizar tv-animacoes.js (pegaIframePlayer).
-->
<style>*{margin:0;padding:0}html,body{width:100%;height:100%;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover}</style>
</head><body>
<video id="v" autoplay playsinline muted></video>
<script>
const v = document.getElementById('v');
let seq = 0, urlBlob = null;
v.addEventListener('loadedmetadata', () => {
  if (window.parent && isFinite(v.duration)) window.parent.postMessage({ tipo: 'duracao', segundos: v.duration }, '*');
});
// Avisa a TV se o video realmente comecou a tocar ou falhou: sem isso, um MP4 que a Smart TV nao
// consegue tocar deixava a tela PRETA ate o tempo-teto (19/10/2026, TV da matriz).
v.addEventListener('playing', () => { if (window.parent) window.parent.postMessage({ tipo: 'tocando' }, '*'); });
// Progresso: a TV usa para perceber video CONGELADO (decodificador da Smart TV trava no meio, 19/10/2026).
let ultT = -1; setInterval(() => { if (!v.paused && v.currentTime !== ultT) { ultT = v.currentTime; if (window.parent) window.parent.postMessage({ tipo: 'progresso' }, '*'); } }, 500);
v.addEventListener('error', () => { if (window.parent && v.getAttribute('src')) window.parent.postMessage({ tipo: 'erro' }, '*'); });
window.addEventListener('message', (ev) => {
  const msg = ev.data || {};
  if (msg.tipo === 'tocar' && msg.arquivo) {
    try { v.pause(); } catch {}
    v.muted = !!msg.mudo;
    // BAIXA O VIDEO INTEIRO ANTES DE TOCAR (19/10/2026): tocar direto da rede congelava na TV
    // quando o Wi-Fi nao acompanhava. Com o arquivo na memoria, tocar nao depende mais da rede.
    const pedido = ++seq;
    if (urlBlob) { try { URL.revokeObjectURL(urlBlob); } catch {} urlBlob = null; }
    const toca = (src) => {
      if (pedido !== seq) return;
      v.src = src; v.load();
      v.play().catch(() => { if (!v.muted) { v.muted = true; v.play().catch(() => {}); } });
    };
    fetch(msg.arquivo).then((r) => { if (!r.ok) throw 0; return r.blob(); })
      .then((b) => { if (pedido !== seq) return; urlBlob = URL.createObjectURL(b); toca(urlBlob); })
      .catch(() => toca(msg.arquivo)); // sem fetch/blob: toca direto como antes
  } else if (msg.tipo === 'parar') {
    seq++;
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch {}
  }
});
if (window.parent) window.parent.postMessage({ tipo: 'player-pronto' }, '*');
</script>
</body></html>
