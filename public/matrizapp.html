<!--
FICHA DO ARQUIVO
O QUE É: TV da MATRIZ (link central /matriz): 11 filiais no consolidado + supervisores, com pênaltis dos casos mais críticos.
PROJETO: CFTV/TV (não é WhatsApp). PREMISSA: 100% ONLINE - nada aqui pode depender do PC do Vitório (ver PREMISSA_ONLINE.md).
COMO FUNCIONA: um laço contínuo atualiza UMA filial por vez (ordem: TCA/TCG/MCD por último, regra do fuso) chamando /api/tv-vendedor
  para cada vendedor MOSTRA=SIM (lista do Drive via /api/tv-mostra). A cada N min (padrão 4) mostra a próxima filial.
  Ranking à esquerda = NOTA DE CRITICIDADE (0 tranquilo … 100 crítico). Pênaltis: mesmas regras da TV das filiais, registrados no D1
  (tv_lances, filial 'MTZ') e limitados (1 VAR / 3 min, máx. 6/h); o mais crítico vai primeiro.
NOTA (v1, ajustável): 40% zerados (após 10h) + 35% pênaltis por vendedor + 25% sem nenhuma visita (após 10h).
GERADO: matrizapp.html é montado a partir de um modelo + trechos de tvapp.html (CSS do VAR e animação do pênalti).
-->

<script>
'use strict';
// ============================== CONFIG ==============================
const P = new URLSearchParams(location.search);
const MIN_FIL = +P.get('min') || 4;                        // minutos por filial na tela
const ORDEM = ['TBL','TCV','TPH','ABC','API','TSJ','TBE','TPA','MCD','TCA','TCG']; // TCA/TCG/MCD por último (regra do fuso)
// Canais com cobrança de rota/visita (REGRAS_DE_NEGOCIO_CEVEN.md §"Canais corporativos"): AS e PET AS

const CAMPO = ['VJ','PET VJ','FARMA','ESP'], EXCLUI = ['GER','SUP'], DIAS_PENALTI_ESTOQUE = 30, DIAS_PENALTI_FECHADO = 45, LIMITE_H = 10, FIM_H = 19;
const VAR_GAP_S = +P.get('vargap') || 180, VAR_MAX_H = +P.get('varmax') || 6;
const SUP_INI = 11 * 60 + 30, SUP_FIM = 12 * 60;
// RET/Compromissos em destaque periódico (decisão do Vitório, 28/09/2026): a partir das 11:00

const SUP_PERIODICO_INI = 11 * 60, SUP_PERIODICO_JANELA_MIN = 3, SUP_PERIODICO_CICLO_MIN = 30;
function emJanelaSupPeriodica(mm) {
  if (mm < SUP_PERIODICO_INI || mm >= FIM_H * 60) return false;
  return (mm - SUP_PERIODICO_INI) % SUP_PERIODICO_CICLO_MIN < SUP_PERIODICO_JANELA_MIN;
}
// ============================== UTIL ==============================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Nome do vendedor + código do RCA — usado em TODOS os lances/acompanhamentos da TV/CFTV
// (decisão do Vitório, 28/09/2026: facilita conferência cruzada com o CEVEN).
const nomeComRca = v => v ? `${esc(v.nome)} <span style="opacity:.65;font-weight:600">(RCA ${esc(v.id)})</span>` : '—';
const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
const brl = v => num(v) == null ? '—' : 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const nv = v => num(v) == null ? '—' : v.toLocaleString('pt-BR');
const pc = v => num(v) == null ? '—' : (Math.round(v * 10) / 10).toLocaleString('pt-BR') + '%';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtSP = new Intl.DateTimeFormat('en-GB', {timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function sp(d) { const o = {}; fmtSP.formatToParts(d || new Date()).forEach(p => o[p.type] = p.value); const h = (+o.hour) % 24;
  return {date: `${o.year}-${o.month}-${o.day}`, h, m: +o.minute, hms: `${String(h).padStart(2,'0')}:${o.minute}:${o.second}`, hm: `${String(h).padStart(2,'0')}:${o.minute}`}; }
function diasDesde(iso) { if (!iso || +iso.slice(0, 4) < 2000) return null; const a = Date.UTC(...sp().date.split('-').map((x,i)=>i===1?+x-1:+x)), b = Date.UTC(...iso.split('-').map((x,i)=>i===1?+x-1:+x)); return Math.round((a - b) / 86400000); }
// Dias úteis (seg-sex) do mês corrente até hoje e no mês inteiro — para meta diária pro-rata (G11).
function diasUteisMes() {
  const [ano, mes] = sp().date.split('-').map(Number);
  const ultimoDia = new Date(Date.UTC(ano, mes, 0)).getUTCDate();
  let totalUteis = 0, uteisAteHoje = 0;
  const hoje = +sp().date.split('-')[2];
  for (let dia = 1; dia <= ultimoDia; dia++) {
    const diaSemana = new Date(Date.UTC(ano, mes - 1, dia)).getUTCDay();
    if (diaSemana !== 0 && diaSemana !== 6) {
      totalUteis++;
      if (dia <= hoje) uteisAteHoje++;
    }
  }
  return { totalUteis, uteisAteHoje };
}
// Texto do "porquê" do gol, por subtipo — ver mesma função em tvapp.html.

function textoGol(subtipo, valor, c, horaReal) {
  if (subtipo === 'super_pedido') return `Super Pedido: ${brl(valor)}!`;
  if (subtipo === 'inativo_recuperado') return `${c && c.nome} · cliente inativo resgatado!`;

  if (subtipo === 'acrescimos') return `Gol nos Acréscimos (checkin ${horaReal})`;
  if (subtipo === 'conversao') return `Máquina de Conversão: ${valor.toFixed(0)}% de aproveitamento!`;
  if (subtipo === 'goleada') return `Goleada! ${valor} clientes positivados hoje!`;
  if (subtipo === 'campeao') return `Campeão da Rodada: 100% da meta do mês batida!`;
  if (subtipo === 'dobrou_mix') return `${c && c.nome} · dobrou o mix do cliente!`;
  if (subtipo === 'hattrick') return `Hat-Trick (3 visitas com venda em até 2h, última checkin ${horaReal})`;
  if (subtipo === 'meta1tempo') return `Meta do 1º Tempo batida (checkin ${horaReal})`;
  if (subtipo === 'dobradinha_quinzenas') return `${c && c.nome} · dobradinha das quinzenas!`;

}
// I02: distância Haversine entre check-out do vendedor e o cadastro do cliente (metros)
function distanciaM(lat1, lon1, lat2, lon2) {
  if ([lat1, lon1, lat2, lon2].some(v => v == null || isNaN(v))) return null;
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
const ddmm = iso => iso ? iso.slice(8,10) + '/' + iso.slice(5,7) : '—';
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const secDe = hms => { const [h, m, x] = String(hms || '0:0:0').split(':').map(Number); return h * 3600 + m * 60 + (x || 0); };
const limpaNome = n => String(n || '').replace(/^CLT\s*-\s*/i, '').replace(/^CLT\s+/i, '').trim();
const HOJE0 = sp().date, K = {seen: 'ceven_mtz_seen_', log: 'ceven_mtz_log_', devMax: 'ceven_mtz_devmax_'};
(function limpa() { try { Object.keys(localStorage).forEach(k => { if (/^ceven_mtz_(seen|log|devmax)_/.test(k) && !k.endsWith(HOJE0)) localStorage.removeItem(k); }); } catch {} })();
// Maior devolução acumulada do mês já vista HOJE por vendedor (chave sig|id -> valor). O CEVEN só
