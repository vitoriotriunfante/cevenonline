FICHA DO ARQUIVO
O QUE É: TV da MATRIZ (link central /matriz): 11 filiais no consolidado + supervisores, com pênaltis dos casos mais críticos.
PROJETO: CFTV/TV (não é WhatsApp). PREMISSA: 100% ONLINE - nada aqui pode depender do PC do Vitório (ver PREMISSA_ONLINE.md).
COMO FUNCIONA: um laço contínuo atualiza UMA filial por vez (ordem: TCA/TCG/MCD por último, regra do fuso) chamando /api/tv-vendedor
  para cada vendedor MOSTRA=SIM (lista do Drive via /api/tv-mostra). A cada N min (padrão 4) mostra a próxima filial.
  Ranking à esquerda = NOTA DE CRITICIDADE (0 tranquilo … 100 crítico). Pênaltis: mesmas regras da TV das filiais, registrados no D1
  (tv_lances, filial 'MTZ') e limitados (1 VAR / 3 min, máx. 6/h); o mais crítico vai primeiro.
NOTA (v1, ajustável): 40% zerados (após 10h) + 35% pênaltis por vendedor + 25% sem nenhuma visita (após 10h).
GERADO: matrizapp.html é montado a partir de um modelo + trechos de tvapp.html (CSS do VAR e animação do pênalti).
-->

        return `<h2 style="margin:6px 0 2px"><span>Supervisores · Score & Fair Play</span><b>2/3</b></h2>
          <table class="tb">
            <tr>
              <th>Supervisor</th>
              <th>Vend.</th>
              <th>Digitado</th>
              <th style="color:#22c55e">⚽ Gols</th>
              <th style="color:#f87171">🚨 Pên.</th>
              <th style="color:#ef4444">🟥 Verm.</th>
              <th>Zerados</th>
              <th style="color:#38bdf8">🏆 Score</th>
            </tr>

              <td><b>${esc(s.nome)}</b></td>
              <td>${s.n}</td>
              <td class="mono">${brl(s.dig)}</td>

              <td class="${s.zer ? 'bad' : ''}">${s.zer}</td>
              <td class="mono" style="font-weight:900;color:${s.score >= 0 ? '#38bdf8' : '#f87171'}">${s.score > 0 ? '+' : ''}${s.score}</td>

          </table>
          <small style="color:var(--mut);display:block;margin-top:6px;font-size:12px">Score: (+10 × Gols) - (5 × Pênaltis) - (8 × Vermelhos) - (2 × Amarelos)</small>`;
      })() :
      `<h2 style="margin:6px 0 2px"><span>Casos críticos (B.O.s) da filial</span><b>3/3</b></h2>${crit.length ? crit.map(o => `<div class="crit">${o.al.length ? tag(o.al[0]) : '<span class="tg t-ven">ZERADO</span>'}<div>${esc(o.v.nome)}<small>${o.al.length ? o.al.length + ' lance(s) · ' + esc(o.v.sup) : 'sem venda hoje · ' + esc(o.v.sup)}</small></div></div>`).join('') : '<div style="color:var(--mut);padding:8px 0">Nenhum caso crítico agora.</div>'}`}
   </div>

   <div class="prog" id="prog"></div>`;
}
function renderSupView() {
  const el = $('det'); el.innerHTML = `<h2><span>Supervisores · matinal (compromisso) e rota (RET)</span><b>em destaque até 12:00</b></h2>` + ORDEM.map(sig => { const l = (SUPS[sig] || []).filter(x => !/GERENTE/i.test(x.nome) && (!x.fez_compromisso || !x.iniciou_ret)); if (!l.length) return ''; const dois = l.filter(x => !x.fez_compromisso && !x.iniciou_ret).length;

}
function render() {

  const sup = modoSup(); $('modo').textContent = sup ? 'SUPERVISORES' : (auto ? 'FILIAL · AUTO' : 'FILIAL · MANUAL');
  if (sup) renderSupView(); else renderFilial(stats[idxFil]);
  const pen = ALERTAS.filter(a => a.nivel === 'penalti').length, crit = [...stats].filter(s => s.tem).sort((a, b) => b.nota - a.nota).slice(0, 3);
  $('alert').textContent = `${ALERTAS.length} alerta(s) ativo(s) (${pen} pênaltis) · mais críticas: ${crit.map(s => s.sig + ' ' + s.nota).join(' · ')} · lances do dia: ${LOG.filter(e => e.nivel !== 'supervisor').length}`;
  if (!sup) { const p = $('prog'); if (p) { const f = Math.min(1, (Date.now() - tFil) / (MIN_FIL * 60000)); p.style.width = (f * 100) + '%'; } }
}
let ultLanceAuto = Date.now(), idxDestaque = 0;
function confereLanceAuto() {
  if (emVAR || FILA.length || !ALERTAS.length) return;
  const t = sp();
  if (t.h < 8) return;
  // A cada 2.5 min mostra automaticamente um lance na TV
  if (Date.now() - ultLanceAuto >= 150000) {
    ultLanceAuto = Date.now();
    const categorias = [
      { tipo: 'gol', lista: ALERTAS.filter(a => a.nivel === 'gol') },
      { tipo: 'hattrick', lista: ALERTAS.filter(a => a.nivel === 'hattrick') },
      { tipo: 'penalti', lista: ALERTAS.filter(a => a.nivel === 'penalti') },
      { tipo: 'impedimento', lista: ALERTAS.filter(a => a.nivel === 'impedimento') },
      { tipo: 'vermelho', lista: ALERTAS.filter(a => a.nivel === 'vermelho') },
      { tipo: 'amarelo', lista: ALERTAS.filter(a => a.nivel === 'amarelo') },
      { tipo: 'defesa', lista: ALERTAS.filter(a => a.nivel === 'defesa') }
    ].filter(c => c.lista && c.lista.length > 0);

    if (!categorias.length) return;
    const cat = categorias[idxDestaque % categorias.length];
    idxDestaque++;
    // Pega o item mais relevante da categoria (ex: maior valor no gol, maior tempo/risco nas infrações)
    const lance = cat.lista.slice().sort((a,b) => (b.valor || b.dias || 0) - (a.valor || a.dias || 0))[0] || cat.lista[0];
    if (lance.nivel === 'gol') {
      FILA.push({tipo: 'gol', sig: lance.sig, v: lance.v, c: lance.c, a: lance, sub: textoGol(lance.subtipo, lance.valor, lance.c, lance.horaAprox)});
    } else if (lance.nivel === 'hattrick') {
      FILA.push({tipo: 'hattrick', sig: lance.sig, v: lance.v, a: lance, sub: textoGol(lance.subtipo, lance.valor, lance.c, lance.horaAprox)});
    } else if (lance.nivel === 'penalti') {
      FILA.push({tipo: 'penalti', sig: lance.sig, v: lance.v, itens: [lance], a: lance});
    } else if (lance.nivel === 'vermelho') {
      FILA.push({tipo: 'vermelho', sig: lance.sig, v: lance.v, c: lance.c, a: lance, sub: lance.subtipo === 'devolucao_nao_pediu' ? `Devolução: CLIENTE NÃO PEDIU (${brl(lance.valor)})` : lance.subtipo === 'bonificacao' ? `${lance.c && lance.c.nome} · bonificação disfarçada` : 'Abandono de campo: 0 visitas às 10h'});
    } else if (lance.nivel === 'amarelo') {
      FILA.push({tipo: 'amarelo', sig: lance.sig, v: lance.v, a: lance, sub: 'Rota ativa sem vendas às 10h'});
    } else if (lance.nivel === 'impedimento') {
      const sub = lance.subtipo === 'gps_fora' ? `Check-out a ${lance.distM}m do cliente ${lance.c && lance.c.nome}` : `Visita 00:00 no cliente ${lance.c && lance.c.nome}`;
      FILA.push({tipo: 'impedimento', sig: lance.sig, v: lance.v, c: lance.c, a: lance, sub});
    } else if (lance.nivel === 'defesa') {
      FILA.push({tipo: 'defesa', sig: lance.sig, v: lance.v, c: lance.c, a: lance, sub: `Cliente recorrente ${lance.c && lance.c.nome} · positivado hoje!`});
    } else {
      FILA.push({tipo: lance.nivel, a: lance, sig: lance.sig, v: lance.v, l: [lance]});

  }
}
function relogio() {

  const vistas = ORDEM.map(s => TS[s]).filter(Boolean); if (vistas.length) { const min = Math.round((Date.now() - Math.max(...vistas)) / 60000); const u = $('upd'); u.textContent = min >= 5 ? `SEM ATUALIZAR HÁ ${min} MIN` : `${vistas.length}/${ORDEM.length} filiais lidas`; u.className = 'upd' + (min >= 5 ? ' old' : ''); }
  render();
}
function exportar() {
  const doc = {matriz: true, data: HOJE0, exportado_em: sp().hms, lances: LOG, filiais: ORDEM.map(sig => { const x = statFilial(sig); return {filial: sig, nota: x.nota, vendedores: x.n, faturado: x.fat, meta: x.metaFat, positivados: x.realCli, meta_pos: x.metaPos, digitado_hoje: x.dig, zerados: x.nZer, penaltis_ativos: x.pen, sem_visita: x.nSemVis}; }), supervisores_pendentes: SUPS};
  const txt = JSON.stringify(doc, null, 2); try { const b = new Blob([txt], {type: 'application/json'}), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `diario_matriz_${HOJE0}.json`; document.body.appendChild(a); a.click(); a.remove(); } catch {}
}
function ctl() {
  const ir = d => { idxFil = (idxFil + d + ORDEM.length) % ORDEM.length; tFil = Date.now(); render(); };
  $('bprev').onclick = () => ir(-1); $('bnext').onclick = () => ir(1);
  $('bauto').onclick = () => { auto = !auto; $('bauto').classList.toggle('on', auto); tFil = Date.now(); render(); };
  $('bsom').textContent = somOn ? '🔊 Som' : '🔇 Som'; $('bsom').onclick = () => { somOn = !somOn; store.set('ceven_tv_som', somOn); $('bsom').textContent = somOn ? '🔊 Som' : '🔇 Som'; beep([[660, .15]]); };
  $('bexp').onclick = exportar;
  const raiz = () => { try { return window.top.document; } catch { return document; } };
  const fs = () => { const d = raiz(); try { d.fullscreenElement ? d.exitFullscreen() : d.documentElement.requestFullscreen(); } catch {} };
  $('bfs').onclick = fs; document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') fs(); });
  raiz().addEventListener('fullscreenchange', () => { $('bfs').textContent = raiz().fullscreenElement ? '⛶ Sair da tela cheia' : '⛶ Tela cheia'; });

  // Botões de Teste Manual dos Lances do Livro de Regras
  if ($('bt-gol')) $('bt-gol').onclick = () => (typeof animTeste === 'function' ? animTeste('gol', 'SUPER PEDIDO DE R$ 25.000!') : null);
  if ($('bt-def')) $('bt-def').onclick = () => (typeof animTeste === 'function' ? animTeste('defesa', 'Defesa milagrosa: salvou a meta no cliente') : null);
  if ($('bt-imp')) $('bt-imp').onclick = () => (typeof animTeste === 'function' ? animTeste('impedimento', 'Visita relâmpago de 00:00') : null);
  if ($('bt-ver')) $('bt-ver').onclick = () => (typeof animTeste === 'function' ? animTeste('vermelho', 'Devolução: CLIENTE NÃO PEDIU') : null);
  if ($('bt-ama')) $('bt-ama').onclick = () => (typeof animTeste === 'function' ? animTeste('amarelo', 'Rota ativa sem vendas às 10h') : null);
  if ($('bt-pen')) $('bt-pen').onclick = () => (typeof animTeste === 'function' ? animTeste('penalti', 'Simulação de falta / estoque suficiente') : null);
  if ($('bt-hat')) $('bt-hat').onclick = () => (typeof animTeste === 'function' ? animTeste('hattrick') : null);
  if ($('bt-inv')) $('bt-inv').onclick = () => (typeof animTeste === 'function' ? animTeste('semanainvicta') : null);
}
// ============================== LAÇO PRINCIPAL ==============================
async function laco() {
  await carregaBase(); if (!MOSTRA) { $('upd').textContent = 'sem lista de vendedores'; $('upd').className = 'upd old'; }
  await carregaLances();
  for (;;) {
    for (const sig of ORDEM) { if (MOSTRA) await atualizaFilial(sig); await processa(); render(); }

ctl(); setInterval(relogio, 1000); relogio(); laco();
window.__mtz = {DATA, TS, get ALERTAS() { return ALERTAS; }, get LOG() { return LOG; }, statFilial, ORDEM, ocupado: () => emVAR || FILA.length > 0, animTeste: typeof animTeste === 'function' ? animTeste : null};
window.__tv = window.__mtz; // a casca /tv usa __tv.ocupado para não recarregar durante um lance
