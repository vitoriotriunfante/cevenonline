<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEVEN CFTV — MATRIZ</title>
<!--
FICHA DO ARQUIVO
O QUE É: TV da MATRIZ (link central /matriz): 11 filiais no consolidado + supervisores, com pênaltis dos casos mais críticos.
PROJETO: CFTV/TV (não é WhatsApp). PREMISSA: 100% ONLINE - nada aqui pode depender do PC do Vitório (ver PREMISSA_ONLINE.md).
COMO FUNCIONA: um laço contínuo atualiza UMA filial por vez (ordem: TCA/TCG/MCD por último, regra do fuso) chamando /api/tv-vendedor
  para cada vendedor MOSTRA=SIM (lista do Drive via /api/tv-mostra). A cada N min (padrão 4) mostra a próxima filial.
  Ranking à esquerda = NOTA DE CRITICIDADE (0 tranquilo … 100 crítico). Pênaltis: mesmas regras da TV das filiais, registrados no D1
  (tv_lances, filial 'MTZ') e limitados (1 VAR / 3 min, máx. 6/h); o mais crítico vai primeiro.
NOTA (v1, ajustável): 40% zerados (após 10h) + 35% pênaltis por vendedor + 25% sem nenhuma visita (após 10h).
GERADO: matrizapp.html é montado a partir de um modelo + trechos de tvapp.html (CSS do VAR e animação do pênalti).
-->
<style>
:root{--bg:#070b14;--card:#0f1626;--card2:#131c30;--line:#1e2a44;--tx:#e8eefc;--mut:#8b9bbd;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--acc:#38bdf8;--pend:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Segoe UI,Inter,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.mono{font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:20px;padding:10px 22px;background:#0a1020;border-bottom:1px solid var(--line);flex-shrink:0;z-index:10}
.rec{color:var(--bad);font-weight:800;font-size:13px;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
.fil{font-size:22px;font-weight:800}.fil small{color:var(--mut);font-weight:500;font-size:14px;margin-left:8px}
.sp{flex:1}.upd{color:var(--mut);font-size:13px}.upd.old{color:var(--bad);font-weight:800}
.modo{font-size:12px;font-weight:800;letter-spacing:.08em;padding:3px 10px;border-radius:6px;background:#1a2440;color:var(--acc)}
.clock{font-size:26px;font-weight:700}
.tot{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line);flex-shrink:0;z-index:9}
.tot div{background:var(--card);padding:10px 18px}.tot b{display:block;font-size:24px;margin-top:2px}
.tot span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.tot small{font-size:14px;color:var(--mut)}
main{flex:1;min-height:0;padding:14px 22px;display:grid;grid-template-columns:.9fr 2.1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;scrollbar-width:none;position:relative}
.panel::-webkit-scrollbar{display:none}
.panel h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:flex;justify-content:space-between;gap:8px;position:sticky;top:-16px;background:var(--card);padding:6px 0;margin-top:-6px;z-index:5;border-bottom:1px solid rgba(255,255,255,.05)}
.panel h2 b{color:var(--tx)}
.rk{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;background:var(--card2);cursor:pointer;border:1px solid transparent}
.rk.cur{border-color:var(--acc);background:#10243b}
.rk .s{font-size:20px;font-weight:900}.rk small{color:var(--mut);display:block;font-size:12px}
.nota{font-size:22px;font-weight:900;min-width:52px;text-align:right}
.n-ok{color:var(--ok)}.n-w{color:var(--warn)}.n-b{color:var(--bad)}
.bar{height:10px;border-radius:99px;background:#1a2440;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.big{font-size:38px;font-weight:900}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.kpi span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.kpi b{display:block;font-size:28px;margin-top:4px}.kpi small{color:var(--mut);font-size:13px}
.tb{width:100%;border-collapse:collapse;font-size:17px}.tb th{color:var(--mut);font-size:12px;text-transform:uppercase;text-align:right;padding:4px 8px;letter-spacing:.06em}.tb th:first-child,.tb td:first-child{text-align:left}
.tb td{padding:6px 8px;text-align:right;border-top:1px solid #16203a}
.tb td.bad{color:#fca5a5;font-weight:800}
.tg{font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:6px}
.t-pen{background:var(--bad);color:#fff}.t-ven{background:#7f1d1d;color:#fecaca;border:1px solid var(--bad)}.t-vis{background:#450a0a;color:#fff;border:2px solid var(--bad)}
.crit{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:start;font-size:16px;padding:7px 0;border-top:1px solid #16203a}
.crit small{color:var(--mut);display:block;font-size:13px;margin-top:2px}
.crit>div:first-child small{margin-top:6px}
.prog{position:absolute;left:0;bottom:0;height:4px;background:var(--acc);width:0}
.subtab{flex:1;min-height:0;overflow:hidden}
.subprog{height:3px;background:#1a2440;border-radius:99px;overflow:hidden}.subprog i{display:block;height:100%;background:var(--warn)}
.supr{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:8px 12px;border-radius:12px;background:var(--card2);font-size:18px;align-items:start}
.supr.bad{border:1px solid var(--bad);background:#2a0a0a}
footer{padding:8px 22px 10px;border-top:1px solid var(--line);background:#0a1020;display:flex;gap:14px;align-items:center;font-size:15px;flex-shrink:0}
footer .tag{background:var(--warn);color:#1a1200;font-weight:800;padding:3px 10px;border-radius:6px;font-size:12px;letter-spacing:.06em}
footer .msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctl{display:flex;gap:6px;opacity:.35;transition:opacity .2s}#ctl:hover{opacity:1}
#ctl button{background:#1a2440;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
#ctl button.on{background:var(--acc);color:#04202e;font-weight:800}
/* ===== VAR ===== */
#ov{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:4vh 4vw;background:#000e}
#ov.show{display:flex}
#ov.f1{animation:fl .5s steps(2) infinite}
@keyframes fl{0%{background:#7f1d1dee}50%{background:#000e}}
#ov .big{font-size:min(15vw,240px);font-weight:900;color:#fff;letter-spacing:.04em;text-shadow:0 0 60px var(--bad);line-height:1}
#ov .sub{font-size:min(3.4vw,46px);margin-top:2vh;color:#fecaca;font-weight:700}
#ov .var{font-size:min(6vw,90px);font-weight:900;color:var(--acc);letter-spacing:.12em}
#ov .scan{width:60vw;height:8px;background:#1a2440;margin-top:4vh;border-radius:9px;overflow:hidden}
#ov .scan i{display:block;height:100%;width:30%;background:var(--acc);animation:sc 1s linear infinite}
@keyframes sc{from{margin-left:-30%}to{margin-left:100%}}
#ov .dec{background:var(--card);border:3px solid var(--bad);border-radius:24px;padding:3vh 3vw;width:min(1500px,92vw);text-align:left}
#ov .dec h1{font-size:min(3.6vw,52px);color:#fff;margin-bottom:2vh}
#ov .dec .ln{font-size:min(2.1vw,30px);padding:.7vh 0;border-bottom:1px solid var(--line);display:flex;gap:16px}
#ov .dec .ln b{color:var(--mut);min-width:14ch;font-weight:600}
#ov .dec .ln.hot span{color:#fca5a5;font-weight:800}
#ov .dec.rev .ln{font-size:min(1.55vw,23px);padding:.5vh 0}#ov .dec.rev h1{font-size:min(3vw,44px);margin-bottom:1vh}#ov .dec.rev .vd{font-size:min(2vw,28px);margin-top:1vh}
#ov .dec .vd{margin-top:2vh;font-size:min(2.4vw,34px);font-weight:800;color:#fca5a5}
/* POPUP COMPACTO (Vitório, 06/10/2026: "muita informação, reorganiza"): campos curtos lado a lado em 3 colunas, rótulo pequeno em cima; texto longo em linha inteira; nunca passa da tela */
#ov .dec{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:2vw;row-gap:0;align-content:start;width:min(1750px,96vw);max-height:94vh;overflow:auto;padding:2vh 2.2vw}
#ov .dec>h1,#ov .dec>.vd,#ov .dec>div:not(.ln){grid-column:1/-1}
#ov .dec>h1{font-size:min(2.6vw,42px);margin-bottom:1vh}
#ov .dec .ln{grid-column:span 2;display:block;font-size:min(1.9vw,30px);padding:.8vh 0;line-height:1.15;min-width:0;overflow-wrap:anywhere}
#ov .dec .ln.w{grid-column:1/-1}
#ov .dec .ln b{display:block;min-width:0;font-size:.52em;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.15em}
#ov .dec>.vd{font-size:min(2.1vw,32px);margin-top:1.2vh}
#ov small{margin-top:2vh;color:var(--mut);font-size:16px}

<script>
'use strict';

   </div>

// Estado da tela de Supervisores: filtro (GIRAR = troca sozinha entre as filiais; TODAS; ou uma filial travada) e "so pendentes"
let SUP_FILTRO = 'GIRAR', SUP_SO_PEND = false, SUP_HTML = '';

let PAINEL_DADOS = { alertas: [], justificativas: {}, digitado: [], penaltis: [] };

function abrirModalPainelMtz(tipo, motivo) {
  const overlay = document.getElementById('modalDetalheOverlay');

  if (btnToggle) btnToggle.textContent = '▾ Expandir Tudo';

  let tituloTxt = '', itens = [];

  if (tipo === 'alertas') {

  } else if (tipo === 'digitado') {

        valorNum: 1

    });

    if (!pensIndividuais.length) {
      LOG.filter(e => e.nivel === 'penalti').forEach(e => {

          sig: e.sig || 'MTZ',

  titulo.textContent = tituloTxt;

    arvore[s].sups[sup].total++;
    arvore[s].sups[sup].somaVal += (it.valorNum || 0);

    arvore[s].sups[sup].vends[v] = arvore[s].sups[sup].vends[v] || { rca: it.rca, canal: it.canal || '', itens: [] };

                </div>

// ROLAGEM AUTOMÁTICA OTIMIZADA: ciclo de 26s bem mais lento + pausa imediata no hover
let MOUSE_SOBRE_PAINEL_MTZ = false;

function setupPaineisHoverMtz() {
  document.querySelectorAll('.panel').forEach(p => {
    if (p._hasHoverMtz) return;
    p._hasHoverMtz = true;
    p.addEventListener('mouseenter', () => { MOUSE_SOBRE_PAINEL_MTZ = true; });
    p.addEventListener('mouseleave', () => { MOUSE_SOBRE_PAINEL_MTZ = false; });
    p.addEventListener('touchstart', () => { MOUSE_SOBRE_PAINEL_MTZ = true; }, { passive: true });
    p.addEventListener('touchend', () => { setTimeout(() => { MOUSE_SOBRE_PAINEL_MTZ = false; }, 2000); }, { passive: true });
  });
}

function autoScrollPaineis() {
  if (MOUSE_SOBRE_PAINEL_MTZ) return; // pausa imediata no hover do mouse
  setupPaineisHoverMtz();

  document.querySelectorAll('.panel').forEach((p) => {
    if (p.offsetParent === null) return;
    const excesso = p.scrollHeight - p.clientHeight;
    if (excesso < 20) return;
    const ciclo = 26000; // 26s bem cadenciado
    const t = (Date.now() % ciclo) / ciclo;
    const fase = t < 0.5 ? t * 2 : (1 - t) * 2;
    p.scrollTop = excesso * fase;
  });
}

checaDisparos(); setInterval(checaDisparos, 5 * 60 * 1000);
setInterval(autoScrollPaineis, 80);
ctl(); setInterval(relogio, 1000); relogio(); laco();
window.__mtz = {DATA, TS, get ALERTAS() { return ALERTAS; }, get LOG() { return LOG; }, statFilial, ORDEM, ocupado: () => emVAR || FILA.length > 0, animTeste: typeof animTeste === 'function' ? animTeste : null};
window.__tv = window.__mtz; // a casca /tv usa __tv.ocupado para não recarregar durante um lance

// DIGITADO HOJE OFICIAL (Vitorio, 05/10/2026: "pedidos entra de TUDO"): total e por filial vem do resumo da varredura central (TODOS os vendedores, ocultos e contas fora da planilha),
// a mesma fonte da TV Executiva e que fecha com o Tradepro. Se a leitura falhar, cai para a soma dos vendedores mostrados.
var RESUMO_OF = null; // var (nao let): evita erro se um render rodar antes desta linha
async function carregaResumoOficial() { const d = await j('/api/mapa-executivo-live', 15000); if (d && d.resumo) RESUMO_OF = d.resumo; }
setInterval(carregaResumoOficial, 60000); carregaResumoOficial();

// ATUALIZACAO AUTOMATICA DA MATRIZ (05/10/2026): a Matriz aberta direto (sem a casca /tv) nao recarregava quando publicavamos e ficava horas rodando codigo velho
// (ex.: popup de impedimento sem prova, regras antigas). Mesma regra da TV da filial: confere /api/version a cada 30 s e recarrega SEM interromper um lance.
let versaoMatriz = null, recarregarMatriz = false;
async function checaVersaoMatriz() {
  const d = await j('/api/version', 8000);
  if (d && d.version) {
    if (versaoMatriz && versaoMatriz !== d.version && window.top === window) recarregarMatriz = true;
    else if (!versaoMatriz) versaoMatriz = d.version;
  }
}
setInterval(checaVersaoMatriz, 30000); checaVersaoMatriz();
setInterval(() => { if (recarregarMatriz && !emVAR && !FILA.length) location.reload(); }, 2000);
