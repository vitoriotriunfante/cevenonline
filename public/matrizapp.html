<title>CEVEN CFTV — MATRIZ</title>
<!--
FICHA DO ARQUIVO
O QUE É: TV da MATRIZ (link central /matriz): 11 filiais no consolidado + supervisores, com pênaltis dos casos mais críticos.
PROJETO: CFTV/TV (não é WhatsApp). PREMISSA: 100% ONLINE - nada aqui pode depender do PC do Vitório (ver PREMISSA_ONLINE.md).
COMO FUNCIONA: um laço contínuo atualiza UMA filial por vez (ordem: TCA/TCG/MCD por último, regra do fuso) chamando /api/tv-vendedor
  para cada vendedor MOSTRA=SIM (lista do Drive via /api/tv-mostra). A cada N min (padrão 4) mostra a próxima filial.
  Ranking à esquerda = NOTA DE CRITICIDADE (0 tranquilo … 100 crítico). Pênaltis: mesmas regras da TV das filiais, registrados no D1
  (tv_lances, filial 'MTZ') e limitados (1 VAR / 3 min, máx. 6/h); o mais crítico vai primeiro.
NOTA (v1, ajustável): 40% zerados (após 10h) + 35% pênaltis por vendedor + 25% sem nenhuma visita (após 10h).
GERADO: matrizapp.html é montado a partir de um modelo + trechos de tvapp.html (CSS do VAR e animação do pênalti).
-->

<script>
'use strict';
// ============================== CONFIG ==============================
const P = new URLSearchParams(location.search);
const MIN_FIL = +P.get('min') || 4;                        // minutos por filial na tela
const ORDEM = ['TBL','TCV','TPH','ABC','API','TSJ','TBE','TPA','MCD','TCA','TCG']; // TCA/TCG/MCD por último (regra do fuso)
const CAMPO = ['VJ','PET VJ'], EXCLUI = ['GER','SUP'], DIAS_PENALTI = 30, LIMITE_H = 10, FIM_H = 19;
const VAR_GAP_S = +P.get('vargap') || 180, VAR_MAX_H = +P.get('varmax') || 6;
const SUP_INI = 11 * 60 + 30, SUP_FIM = 12 * 60;
// ============================== UTIL ==============================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
const brl = v => num(v) == null ? '—' : 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const nv = v => num(v) == null ? '—' : v.toLocaleString('pt-BR');
const pc = v => num(v) == null ? '—' : (Math.round(v * 10) / 10).toLocaleString('pt-BR') + '%';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtSP = new Intl.DateTimeFormat('en-GB', {timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function sp(d) { const o = {}; fmtSP.formatToParts(d || new Date()).forEach(p => o[p.type] = p.value); const h = (+o.hour) % 24;
  return {date: `${o.year}-${o.month}-${o.day}`, h, m: +o.minute, hms: `${String(h).padStart(2,'0')}:${o.minute}:${o.second}`, hm: `${String(h).padStart(2,'0')}:${o.minute}`}; }
function diasDesde(iso) { if (!iso || +iso.slice(0, 4) < 2000) return null; const a = Date.UTC(...sp().date.split('-').map((x,i)=>i===1?+x-1:+x)), b = Date.UTC(...iso.split('-').map((x,i)=>i===1?+x-1:+x)); return Math.round((a - b) / 86400000); }
const ddmm = iso => iso ? iso.slice(8,10) + '/' + iso.slice(5,7) : '—';
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const secDe = hms => { const [h, m, x] = String(hms || '0:0:0').split(':').map(Number); return h * 3600 + m * 60 + (x || 0); };
const limpaNome = n => String(n || '').replace(/^CLT\s*-\s*/i, '').replace(/^CLT\s+/i, '').trim();
const HOJE0 = sp().date, K = {seen: 'ceven_mtz_seen_', log: 'ceven_mtz_log_'};
(function limpa() { try { Object.keys(localStorage).forEach(k => { if (/^ceven_mtz_(seen|log)_/.test(k) && !k.endsWith(HOJE0)) localStorage.removeItem(k); }); } catch {} })();
async function j(url, ms = 25000) { const c = new AbortController(), t = setTimeout(() => c.abort(), ms); try { const r = await fetch(url, {signal: c.signal, cache: 'no-store'}); if (!r.ok) return null; return await r.json(); } catch { return null; } finally { clearTimeout(t); } }
// ============================== ESTADO ==============================
let MOSTRA = null, METAS = null, ALERTAS = [], idxFil = 0, tFil = Date.now(), auto = true, somOn = store.get('ceven_tv_som', false), listaAviso = '';
const DATA = {}, TS = {}, SUPS = {};                       // DATA[sig][rca] = leitura; TS[sig] = quando atualizou
let seen = new Set(store.get(K.seen + HOJE0, [])), LOG = store.get(K.log + HOJE0, []);
// ============================== BASE (Drive, metas) ==============================
async function carregaBase() {
  let m = await j('/api/tv-mostra', 25000), origem = 'drive';
  if (!(m && m.filiais && !m.erro)) { m = await j('/mostra_vendedores.json?t=' + Date.now(), 15000); origem = 'copia'; }
  if (m && m.filiais) { MOSTRA = m.filiais; listaAviso = origem === 'copia' ? 'LISTA: CÓPIA · DRIVE INDISPONÍVEL' : ''; }
  const mt = await j('/metas_mes.json?t=' + Date.now(), 15000);
  if (mt && mt.filiais && mt.mes === sp().date.slice(0, 7)) METAS = mt;
  const av = $('aviso'); av.textContent = listaAviso; av.style.display = listaAviso ? 'inline-block' : 'none';
}
const listaFil = sig => MOSTRA ? Object.keys(MOSTRA).filter(k => k === sig || k.startsWith(sig + '_')).flatMap(k => MOSTRA[k].map(r => ({...r, grupo: r.grupo || (k.includes('_') ? k.split('_').slice(1).join('_') : '')}))) : []; // filial canônica; tolera JSON antigo
const reps = sig => listaFil(sig).filter(r => r.mostra && !EXCLUI.includes((r.canal || '').toUpperCase())).map(r => ({id: String(r.rca), nome: limpaNome(r.nome), canal: (r.canal || '').toUpperCase(), sup: limpaNome(r.supervisor), grupo: r.grupo || ''}));
async function atualizaFilial(sig) {
  DATA[sig] = DATA[sig] || {}; const fila = [...reps(sig)];
  await Promise.all(Array.from({length: 6}, async () => { while (fila.length) { const r = fila.shift(); const d = await j(`/api/tv-vendedor?filial=${sig}&id=${r.id}`);
    if (d && !d.erro && !(d.falhas && d.falhas.length === 3)) { if (!d.falhas || !d.falhas.length || !DATA[sig][r.id]) DATA[sig][r.id] = d; } } }));
  TS[sig] = Date.now();
}
async function atualizaSups() {
  const t = sp(), m = t.h * 60 + t.m; if (m < 11 * 60 || m > 12 * 60 + 30) return;
  for (const sig of ORDEM) { const d = await j(`/api/tv-supervisores?filial=${sig}`, 20000); if (d && !d.erro && Array.isArray(d.supervisores)) SUPS[sig] = d.supervisores; }
  gatilhoSup();
}
// ============================== DERIVADOS ==============================
function vend(sig, r) {
  const d = (DATA[sig] || {})[r.id] || {}, cl = Array.isArray(d.clientes) ? d.clientes : null;
  const st = s => cl ? cl.filter(c => s.includes(c.status)).length : null;
  const feitas = cl ? cl.filter(c => !['AGENDADO', 'ABERTO'].includes(c.status)).length : null;
  return {sig, id: r.id, nome: r.nome, canal: r.canal, sup: r.sup, grupo: r.grupo || '', campo: CAMPO.includes(r.canal), d, cl, meta: num(d.meta_fat), fat: num(d.faturado), dev: num(d.devolucao),
    metaCli: num(d.meta_cli), realCli: num(d.real_cli), dig: num(d.dig_hoje), pos: num(d.pos_hoje), rota: cl ? cl.length : null, feitas, comVenda: st(['POSITIVADO', 'EFETIVADO']),
    temRota: !!(cl && cl.length), tem: !!(DATA[sig] || {})[r.id]};
}
const vendedores = sig => reps(sig).map(r => vend(sig, r)).filter(v => v.tem && ((v.meta || 0) > 0 || (v.metaCli || 0) > 0)); // mesma regra da TV da filial
const zerado = v => v.campo && v.temRota && !(v.dig > 0) && !(v.pos > 0);
function calcAlertas() {
  const t = sp(), depois10 = t.h >= LIMITE_H && t.h < FIM_H, out = [];
  for (const sig of ORDEM) for (const v of vendedores(sig)) {
    if (!v.cl) continue;
    v.cl.forEach(c => {
      if (['POSITIVADO', 'EFETIVADO'].includes(c.status) || !c.motivo) return;
      const m = c.motivo.toUpperCase(), dias = diasDesde(c.ultima_compra); if (!(dias == null || dias > DIAS_PENALTI)) return;
      const tipo = m.includes('ESTOQUE SUFICIENTE') ? 'estoque' : (m.includes('FECHADO') || m.includes('ENCERROU')) ? 'fechado' : null; if (!tipo) return;
      const key = `${sig}|pen|${tipo}|${v.id}|${c.id}`; if (!out.some(o => o.key === key)) out.push({key, sig, nivel: 'penalti', tipo, v, c, dias});
    });
    if (v.campo && v.temRota && depois10) { if (v.feitas === 0) out.push({key: `${sig}|vis10|${v.id}`, sig, nivel: 'visita10', v}); else if (!(v.dig > 0) && !(v.pos > 0)) out.push({key: `${sig}|ven10|${v.id}`, sig, nivel: 'venda10', v}); }
  }
  return out;
}
// NOTA DE CRITICIDADE (0 tranquilo … 100 crítico) — v1, transparente e ajustável
function statFilial(sig) {
  const vs = vendedores(sig), campo = vs.filter(v => v.campo && v.temRota), t = sp(), depois10 = t.h >= LIMITE_H;
  const s = (a, f) => a.reduce((x, v) => x + (f(v) || 0), 0), pen = ALERTAS.filter(a => a.sig === sig && a.nivel === 'penalti').length;
  const nZer = campo.filter(zerado).length, nSemVis = campo.filter(v => v.feitas === 0).length;
  const pZer = depois10 && campo.length ? nZer / campo.length : 0, pVis = depois10 && campo.length ? nSemVis / campo.length : 0, penV = vs.length ? pen / vs.length : 0;
  const nota = Math.round(Math.min(1, pZer / .30) * 40 + Math.min(1, penV / 1) * 35 + Math.min(1, pVis / .20) * 25);
  const mt = METAS && METAS.filiais[sig];
  return {sig, vs, campo, n: vs.length, tem: vs.length > 0, nota, pen, nZer, nSemVis, fat: s(vs, v => v.fat), dig: s(vs, v => v.dig), pos: s(vs, v => v.pos), realCli: s(vs, v => v.realCli),
    feitas: s(campo, v => v.feitas), rota: s(campo, v => v.rota), metaFat: mt ? mt.meta_fat : s(vs, v => v.meta), metaPos: mt ? mt.meta_pos : s(vs, v => v.metaCli)};
}
const corNota = n => n >= 60 ? 'n-b' : n >= 30 ? 'n-w' : 'n-ok';
// ============================== REGISTRO (D1) + LIMITADOR + VAR ==============================
async function registraLances(cands) {
  const corpo = {filial: 'MTZ', lances: cands.map(a => ({chave: a.key, nivel: a.nivel, rca: a.v ? a.v.id : null, vendedor: a.v ? a.v.nome : null, supervisor: a.v ? (a.v.sup || '') : '', cliente_id: a.c ? String(a.c.id) : null, cliente: a.c ? a.c.nome : null, motivo: a.c ? a.c.motivo : null,
    dias_sem_compra: a.dias != null ? a.dias : null, ultima_compra: a.c ? a.c.ultima_compra : null, tempo_visita: a.c ? a.c.tempo_visita : null, obs: a.sig}))};
  try { const r = await fetch('/api/tv-lances', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(corpo)}); const d = await r.json(); return r.ok && !d.erro ? d : null; } catch { return null; }
}
async function carregaLances() {
  const d = await j('/api/tv-lances?filial=MTZ', 15000); if (!d || !Array.isArray(d.lances)) return;
  const tem = new Set(LOG.map(e => e.key).filter(Boolean));
  d.lances.forEach(r => { seen.add(r.chave); if (!tem.has(r.chave)) LOG.push({key: r.chave, t: r.hora_sp, nivel: r.nivel, rca: r.rca, vendedor: r.vendedor, supervisor: r.supervisor || '', sig: r.obs || String(r.chave).split('|')[0], cliente: r.cliente, motivo: r.motivo, dias_sem_compra: r.dias_sem_compra, tempo_visita: r.tempo_visita, ao_ligar: !!r.baseline}); });
  LOG.sort((x, y) => secDe(x.t) - secDe(y.t)); store.set(K.seen + HOJE0, [...seen]); store.set(K.log + HOJE0, LOG);
}
let primeiraSync = false, processando = false;
async function processa() {
  if (processando) return; processando = true;
  try {
    ALERTAS = calcAlertas();
    const cands = ALERTAS.filter(a => !seen.has(a.key));
    if (cands.length || !primeiraSync) {
      const d = await registraLances(cands); let novos, baseline;
      if (d) { primeiraSync = true; baseline = !!d.baseline; const st = new Set(d.novos); novos = cands.filter(a => st.has(a.key)); } else { baseline = false; novos = []; } // sem servidor: não apita (evita repetição)
