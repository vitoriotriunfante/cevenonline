<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEVEN CFTV — Debug de Vídeo</title>
<!--
FICHA DO ARQUIVO
O QUE É: bancada de debug do <video> dos gols — toca cada arquivo real e mostra, em log na tela,
cada evento do elemento (loadstart, loadedmetadata, canplay, playing, waiting, stalled, ended,
error). Serve para diagnosticar travamento/tela preta em Smart TV real, sem depender do console
do navegador (que a TV não expõe). Página isolada, não lê dado do CEVEN.
-->
<style>
:root{--bg:#070b14;--tx:#e8eefc;--ok:#4ade80;--bad:#f87171;--mut:#8b9bbd}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Segoe UI,Consolas,monospace;min-height:100vh;display:flex;flex-direction:column}
#video-wrap{position:relative;width:100%;height:40vh;background:#000;flex:0 0 auto}
video{width:100%;height:100%;object-fit:contain;background:#000}
#ctl{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px;background:#0a1020;border-bottom:1px solid #1e2a44}
#ctl button{border:0;border-radius:8px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#e8eefc;color:#0a1020}
#ctl button.limpar{background:#334155;color:#fff}
#log{flex:1;overflow-y:auto;padding:14px 18px;font-size:15px;line-height:1.6}
#log div{white-space:pre-wrap}
#log .ok{color:var(--ok)}
#log .bad{color:var(--bad)}
#log .info{color:var(--mut)}
</style>
</head><body>
<div id="video-wrap"><video id="v" playsinline muted></video></div>
<div id="ctl">
  <button data-arq="/animacoes/videos/gol_1.mp4">Tocar gol_1</button>
  <button data-arq="/animacoes/videos/gol_2.mp4">Tocar gol_2</button>
  <button data-arq="/animacoes/videos/gol_3.mp4">Tocar gol_3</button>
  <button data-arq="/animacoes/videos/gol_4.mp4">Tocar gol_4</button>
  <button id="btn-limpar" class="limpar">Limpar log</button>
</div>
<div id="log"></div>
<script>
'use strict';
const v = document.getElementById('v'), log = document.getElementById('log');
let n = 0;
function hms() { const d = new Date(); return d.toTimeString().slice(0,8) + '.' + String(d.getMilliseconds()).padStart(3,'0'); }
function linha(txt, cls) { const e = document.createElement('div'); e.className = cls || ''; e.textContent = `[${hms()}] ${txt}`; log.appendChild(e); log.scrollTop = log.scrollHeight; }
['loadstart','loadedmetadata','canplay','playing','waiting','stalled','suspend','ended','abort','emptied'].forEach(ev => {
  v.addEventListener(ev, () => {
    if (ev === 'loadedmetadata') linha(`#${n} ${ev} - duracao: ${v.duration.toFixed(3)}s`, 'ok');
    else if (ev === 'playing') linha(`#${n} PLAYING (video realmente tocando)`, 'ok');
    else if (ev === 'waiting' || ev === 'stalled') linha(`#${n} ${ev} (rede travou)`, 'bad');
    else if (ev === 'ended') linha(`#${n} ENDED (terminou normalmente)`, 'ok');
    else linha(`#${n} ${ev}`, 'info');
  });
});
v.addEventListener('error', () => { const err = v.error; linha(`#${n} ERROR code=${err ? err.code : '?'} ${err ? err.message : ''}`, 'bad'); });
document.querySelectorAll('#ctl button[data-arq]').forEach(b => {
  b.onclick = () => {
    n++;
    const arq = b.dataset.arq;
    const reaproveitado = v.dataset.usado === '1';
    linha(`=== TESTE #${n}: ${arq} (elemento ${reaproveitado ? 'reaproveitado' : 'novo'}) ===`, 'info');
    v.dataset.usado = '1';
    v.muted = false;
    v.src = arq;
    v.load();
    linha(`#${n} src trocado + load(), chamando play()...`, 'info');
    v.play().then(() => linha(`#${n} play() resolveu com sucesso (com som)`, 'ok'))
      .catch(e => { linha(`#${n} play() com som falhou: ${e.message} — tentando mudo`, 'bad'); v.muted = true; v.play().catch(e2 => linha(`#${n} play() mudo tambem falhou: ${e2.message}`, 'bad')); });
  };
});
document.getElementById('btn-limpar').onclick = () => { log.innerHTML = ''; };
</script>
</body></html>
