<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEVEN CFTV — TV da Filial</title>
<!--
FICHA DO ARQUIVO
O QUE É: TV da filial (CFTV). Link travado: /tv.html?filial=TBL (o index.html redireciona ?filial= para cá).
PROJETO: CFTV/TV (não é WhatsApp). Ver CLAUDE.md e docs/CFTV_MATRIX_VISAO_E_ESTADO_ATUAL.md.
LÊ: /api/representantes?filial= e /api/tv-vendedor?filial=&id= (dado ao vivo do CEVEN).
REGRA: nunca inventa dado. Sem resposta = "—" e mantém a última leitura real.
ALTERNÂNCIA: a partir das 08:00 (Brasília) alterna blocos de 10 min: RONDA / PAINEL.
ALERTAS: pênalti (ESTOQUE SUFICIENTE ou cliente fechado, com >30 dias sem compra),
         cartão vermelho (10h sem venda), expulsão (10h sem visita). Ver docs.
DIÁRIO: guarda no navegador os lances e snapshots do dia (botão Exportar).
-->
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Segoe UI,Inter,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.s-v{background:#22c55e26;color:#86efac}.s-x{background:#f59e0b26;color:#fcd34d}.s-a{background:#8b9bbd22;color:var(--mut)}
.prog{position:absolute;left:0;bottom:0;height:4px;background:var(--acc);width:0}
footer{padding:8px 22px 10px;border-top:1px solid var(--line);background:#0a1020;display:flex;gap:14px;align-items:center;font-size:15px}

/* ===== VAR ===== */

#ov .dec .vd{margin-top:2vh;font-size:min(2.4vw,34px);font-weight:800;color:#fca5a5}

@media(max-width:900px){#ronda,#painel{grid-template-columns:1fr;grid-template-rows:auto}.tot{grid-template-columns:repeat(2,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}.side{display:none}body{overflow:auto}}
</style></head><body>
<header>
  <div class="rec"><i></i>CFTV AO VIVO</div>
  <div class="fil"><span id="fil">—</span><small><span id="nv">0</span> vendedores com meta</small></div>
  <span class="modo" id="modo">RONDA</span>
  <div class="sp"></div>
  <div class="upd" id="upd">carregando…</div>
  <div class="clock mono" id="clock"></div>
</header>
<section class="tot" id="tot"></section>
<main>
  <div id="ronda"><div class="master" id="master"></div><div class="side" id="side"></div></div>
  <div id="painel">
    <div class="panel" id="p1"></div><div class="panel" id="p2"></div>
    <div class="panel" id="p3"></div><div class="panel" id="p4"></div>
  </div>
</main>

  <span class="tag">ALERTAS</span>
  <span class="msg" id="alert">—</span>
  <div id="ctl">
    <button data-m="auto" class="on">Auto</button><button data-m="ronda">Ronda</button><button data-m="painel">Painel</button>
    <button id="bsom">🔇 Som</button><button id="brev">Revisar 30 min</button><button id="bexp">Exportar diário</button>
  </div>
</footer>
<div id="ov"></div>
<script>
'use strict';
// ============================== CONFIG ==============================
const P = new URLSearchParams(location.search);
const FIL = (P.get('filial') || '').toUpperCase();
const VALID = ['TBL','TPH','TCV','ABC','TCA','MCD','TCG','API','TBE','TPA','TSJ'];
const CICLO_S = +P.get('ciclo') || 90;          // atualização dos dados
const BLOCO_MIN = +P.get('bloco') || 10;        // minutos por bloco na alternância
const ROTA_S = +P.get('rotacao') || 10;         // segundos por vendedor na ronda
const INICIO_H = 8, FIM_H = 19, LIMITE_H = 10;  // alternância 08h–19h; regras "10h"
const DIAS_PENALTI = 30;
const CAMPO = ['VJ','PET VJ'];                  // canais com cobrança de rota (regra de negócio)
const EXCLUI = ['GER','SUP'];

// ============================== UTIL ==============================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
const brl = v => num(v) == null ? '—' : 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const pc = v => num(v) == null ? '—' : (Math.round(v * 10) / 10).toLocaleString('pt-BR') + '%';
const nv = v => num(v) == null ? '—' : v.toLocaleString('pt-BR');
const fmtSP = new Intl.DateTimeFormat('en-GB', {timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
function sp(d) {
  const o = {}; fmtSP.formatToParts(d || new Date()).forEach(p => o[p.type] = p.value);
  const h = (+o.hour) % 24;
  return {date: `${o.year}-${o.month}-${o.day}`, h, m: +o.minute, hms: `${String(h).padStart(2,'0')}:${o.minute}:${o.second}`, hm: `${String(h).padStart(2,'0')}:${o.minute}`};
}
function diasDesde(dataISO) {
  if (!dataISO || +dataISO.slice(0, 4) < 2000) return null; // data ausente ou inválida (ex.: 1900) = sem data de compra
  const a = Date.UTC(...sp().date.split('-').map((x,i)=>i===1?+x-1:+x));
  const b = Date.UTC(...dataISO.split('-').map((x,i)=>i===1?+x-1:+x));
  return Math.round((a - b) / 86400000);
}
const ddmm = iso => iso ? iso.slice(8,10) + '/' + iso.slice(5,7) : '—';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const HOJE0 = sp().date;
const K = {seen:`ceven_tv_seen_${FIL}_`, log:`ceven_tv_log_${FIL}_`, snap:`ceven_tv_snap_${FIL}_`};
(function limpaAntigos() { try { Object.keys(localStorage).forEach(k => { if (/^ceven_tv_(seen|log|snap)_/.test(k) && !k.endsWith(HOJE0)) localStorage.removeItem(k); }); } catch {} })();

// ============================== ESTADO ==============================
let REPS = [];            // [{id,nome,canal}]
const DATA = {};          // id -> última leitura real (tv-vendedor)
let lastOk = null, refreshing = false, ordem = [], idxRonda = 0, modoManual = ['auto','ronda','painel'].includes(P.get('modo')) ? P.get('modo') : store.get('ceven_tv_modo', 'auto');
let ALERTAS = [];         // ativos agora
let seen = new Set(store.get(K.seen + HOJE0, []));
let LOG = store.get(K.log + HOJE0, []);
let SNAP = store.get(K.snap + HOJE0, []);
const primeiraCarga = seen.size === 0 && LOG.length === 0;
let somOn = store.get('ceven_tv_som', false);

// ============================== DADOS ==============================
async function j(url, ms = 25000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {signal: c.signal, cache: 'no-store'}); if (!r.ok) return null; return await r.json(); }
  catch { return null; } finally { clearTimeout(t); }
}
async function carregaReps() {
  const lista = await j(`/api/representantes?filial=${FIL}`);
  if (!Array.isArray(lista)) return false;
  const doFil = lista.filter(r => ((r.filial || '').toUpperCase() === FIL) || ((r.filial_id || '').toUpperCase().replace(/1$/, '') === FIL));
  REPS = doFil.map(r => ({id: String(r.codigo), nome: String(r.nome || '').replace(/^CLT\s*-\s*/i, ''), canal: (r.area_atuacao || '').toUpperCase()}))
    .filter(r => !EXCLUI.includes(r.canal) && !/^VAGO/i.test(r.nome));
  return REPS.length > 0;
}
async function atualiza() {
  if (refreshing) return; refreshing = true;
  try {
    if (!REPS.length && !(await carregaReps())) { $('upd').textContent = 'sem lista de vendedores'; $('upd').className = 'upd old'; return; }
    const fila = [...REPS]; let ok = 0;
    await Promise.all(Array.from({length: 6}, async () => {
      while (fila.length) {
        const r = fila.shift();
        const d = await j(`/api/tv-vendedor?filial=${FIL}&id=${r.id}`);
        if (d && !d.erro && !(d.falhas && d.falhas.length === 3)) {
          if (!d.falhas || !d.falhas.length || !DATA[r.id]) DATA[r.id] = d; // leitura parcial só entra se não houver anterior
          ok++;
        }
      }
    }));
    if (ok > 0) { lastOk = Date.now(); processa(); }
  } finally { refreshing = false; render(); }
}

// ============================== DERIVADOS E ALERTAS ==============================
function vend(r) {
  const d = DATA[r.id] || {}; const cl = Array.isArray(d.clientes) ? d.clientes : null;
  const st = s => cl ? cl.filter(c => s.includes(c.status)).length : null;
  const feitas = cl ? cl.filter(c => !['AGENDADO', 'ABERTO'].includes(c.status)).length : null;
  const comVenda = st(['POSITIVADO', 'EFETIVADO']);
  const campo = CAMPO.includes(r.canal);
  return {
    id: r.id, nome: r.nome, canal: r.canal, campo, d, cl,
    meta: num(d.meta_fat), fat: num(d.faturado), pend: num(d.pendente), dev: num(d.devolucao),
    metaCli: num(d.meta_cli), realCli: num(d.real_cli), dig: num(d.dig_hoje), pos: num(d.pos_hoje),
    rota: cl ? cl.length : null, feitas, comVenda, semVenda: st(['VISITADO']), aFazer: st(['AGENDADO', 'ABERTO']),
    temRota: !!(cl && cl.length), tem: !!DATA[r.id]
  };
}
const inclui = v => v.tem && ((v.meta || 0) > 0 || (v.metaCli || 0) > 0);
function VS() { return REPS.map(vend).filter(inclui); }
function calcAlertas(vs) {
  const t = sp(), out = [];
  const depois10 = t.h >= LIMITE_H && t.h < FIM_H;
  vs.forEach(v => {
    if (!v.cl) return;
    v.cl.forEach(c => {
      if (['POSITIVADO', 'EFETIVADO'].includes(c.status) || !c.motivo) return;
      const m = c.motivo.toUpperCase(); const dias = diasDesde(c.ultima_compra);
      const parado = dias == null || dias > DIAS_PENALTI;
      if (!parado) return;
      let tipo = null;
      if (m.includes('ESTOQUE SUFICIENTE')) tipo = 'estoque';
      else if (m.includes('FECHADO') || m.includes('ENCERROU')) tipo = 'fechado';
      if (!tipo) return;
      if (out.some(o => o.key === `pen|${tipo}|${v.id}|${c.id}`)) return; // mesmo cliente repetido na rota
      out.push({key: `pen|${tipo}|${v.id}|${c.id}`, nivel: 'penalti', tipo, v, c, dias});
    });
    if (v.campo && v.temRota && depois10) {
      if (v.feitas === 0) out.push({key: `vis10|${v.id}`, nivel: 'visita10', v});
      else if (!(v.dig > 0) && !(v.pos > 0)) out.push({key: `ven10|${v.id}`, nivel: 'venda10', v});
    }
  });
  return out;
}
const PESO = {visita10: 4, venda10: 3, penalti: 2};
function processa() {
  const vs = VS();
  ALERTAS = calcAlertas(vs).sort((a, b) => PESO[b.nivel] - PESO[a.nivel]);
  const novos = ALERTAS.filter(a => !seen.has(a.key));
  if (novos.length) {
    const t = sp();
    // Se é a 1ª leitura do dia neste navegador, o que já existe é registrado sem VAR (não repete o que já aconteceu).
    const aoLigar = primeiraCarga && !primeiraLeituraFeita;
    novos.forEach(a => { seen.add(a.key); LOG.push(evento(a, t, aoLigar)); });
    store.set(K.seen + HOJE0, [...seen]); store.set(K.log + HOJE0, LOG);
    if (!aoLigar) enfileira(novos);
  }
  primeiraLeituraFeita = true;
  snapshot(vs);
}
let primeiraLeituraFeita = false;
function evento(a, t, aoLigar) {
  const e = {t: t.hms, nivel: a.nivel, rca: a.v.id, vendedor: a.v.nome, filial: FIL};
  if (a.nivel === 'penalti') Object.assign(e, {tipo: a.tipo, cliente: a.c.nome, id_cliente: a.c.id, motivo: a.c.motivo, obs: a.c.obs, dias_sem_compra: a.dias, ultima_compra: a.c.ultima_compra, valor_ultima_compra: a.c.valor_ultima, tempo_visita: a.c.tempo_visita, status_cliente: a.c.status});
  else Object.assign(e, {rota: a.v.rota, feitas: a.v.feitas, digitado: a.v.dig, positivacoes: a.v.pos});
  if (aoLigar) e.ao_ligar = true;
  return e;
}
function snapshot(vs) {
  const t = sp(); const ult = SNAP[SNAP.length - 1];
  const cur = t.h * 60 + t.m;
  if (ult && cur - (ult.min || 0) < 10 && ult.data === t.date) return;
  const campo = vs.filter(v => v.campo && v.temRota);
