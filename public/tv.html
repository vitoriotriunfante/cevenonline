<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEVEN CFTV</title>
<!--
FICHA DO ARQUIVO
O QUE É: "casca" da TV. Só abre a tela real (/tvapp) dentro de um iframe de 100% e cuida das atualizações.
POR QUÊ: quando publicamos uma versão nova, só o iframe recarrega; esta página NÃO navega,
         então a TELA CHEIA DO NAVEGADOR NÃO SAI. (Recarregar a página inteira sempre tira a tela cheia.)
LINKS: /tbl -> /tv?filial=TBL. A última filial usada fica lembrada neste aparelho: depois disso,
       basta abrir /tv (ou o endereço do site) que a TV já abre na filial.
ATUALIZAÇÃO AUTOMÁTICA: consulta /api/version a cada 30 s; quando muda, recarrega o iframe
       (espera fechar qualquer lance/alerta que esteja na tela).
PROJETO: CFTV/TV. Ver CLAUDE.md.
-->
<style>html,body{margin:0;height:100%;background:#070b14;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>
</head><body>
<iframe id="app" allow="fullscreen; autoplay"></iframe>
<script>
'use strict';
const f = document.getElementById('app');
const P = new URLSearchParams(location.search);
let fil = (P.get('filial') || '').toUpperCase(), matriz = P.get('matriz') === '1';
try {
  if (matriz) localStorage.setItem('ceven_tv_filial', 'MATRIZ');
  else if (fil) localStorage.setItem('ceven_tv_filial', fil);
  else { fil = localStorage.getItem('ceven_tv_filial') || ''; if (fil === 'MATRIZ') { matriz = true; fil = ''; } }
} catch {}
if (fil && !matriz) P.set('filial', fil);
f.src = (matriz ? '/matrizapp?' : '/tvapp?') + P.toString();
f.onload = () => { try { document.title = f.contentDocument.title; } catch {} f.contentWindow.focus(); };

// tela cheia (a página de cima nunca recarrega, então a tela cheia se mantém)
const alterna = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch {} };
document.addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') alterna(); });

// atualização automática: recarrega só o iframe
let versao = null, pendente = false;
async function confere() {
  try {
    const d = await (await fetch('/api/version', { cache: 'no-store' })).json();
    if (d && d.version) { if (versao && versao !== d.version) pendente = true; else if (!versao) versao = d.version; }
  } catch {}
}
setInterval(() => {
  if (!pendente) return;
  try { const w = f.contentWindow; if (w.__tv && w.__tv.ocupado && w.__tv.ocupado()) return; w.location.reload(); }
  catch { f.src = f.src; }
  pendente = false; versao = null; confere();
}, 2000);
setInterval(confere, 30000); confere();
</script></body></html>
